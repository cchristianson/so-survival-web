<svg xmlns="http://www.w3.org/2000/svg" width="660" height="590" viewBox="0 0 660 590" font-family="Arial, Helvetica, sans-serif">
  <title>Calving: telling front legs from hind legs, and where the pulling chain goes</title>
  <rect width="660" height="590" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b03a2e"/></marker>
    <marker id="lk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>

  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Which legs are coming? Feel the soles and the joints</text>

  <!-- ===== Panel 1: front legs ===== -->
  <rect x="10" y="40" width="315" height="262" rx="8" fill="#f7f7f4" stroke="#999" stroke-width="1.5"/>
  <text x="167" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f5f2a">FRONT feet: a normal birth</text>
  <!-- birth canal opening -->
  <ellipse cx="110" cy="182" rx="13" ry="62" fill="#f3d6d0" stroke="#7a4a3a" stroke-width="2.5"/>
  <text x="110" y="112" text-anchor="middle" font-size="13" fill="#555">vulva</text>
  <!-- head (inside part dashed) -->
  <path d="M60,160 Q60,132 120,132 L205,140 Q232,146 232,160 Q232,172 205,174 L120,178 Q60,182 60,160 Z" fill="#fbf3e6" stroke="#6b5a45" stroke-width="2"/>
  <circle cx="226" cy="158" r="3" fill="#333"/>
  <!-- leg: cannon, fetlock, pastern, hoof -->
  <line x1="40" y1="204" x2="175" y2="204" stroke="#6b5a45" stroke-width="14" stroke-linecap="round"/>
  <circle cx="44" cy="204" r="10" fill="#fbf3e6" stroke="#6b5a45" stroke-width="2"/>
  <circle cx="180" cy="204" r="9" fill="#fbf3e6" stroke="#6b5a45" stroke-width="2"/>
  <line x1="186" y1="204" x2="222" y2="206" stroke="#6b5a45" stroke-width="11" stroke-linecap="round"/>
  <polygon points="222,193 262,203 266,217 222,217" fill="#3d3d3d"/>
  <!-- fold arrows: both toward the sole (down) -->
  <path d="M196,226 Q192,246 172,248" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M60,226 Q56,246 36,248" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="44" y="190" text-anchor="middle" font-size="12" fill="#333">knee</text>
  <text x="178" y="190" text-anchor="middle" font-size="12" fill="#333">fetlock</text>
  <!-- labels -->
  <text x="245" y="122" text-anchor="middle" font-size="13" fill="#222">nose on top</text>
  <text x="245" y="137" text-anchor="middle" font-size="13" fill="#222">of the legs</text>
  <line x1="272" y1="210" x2="292" y2="228" stroke="#333" stroke-width="1.2"/>
  <text x="300" y="242" text-anchor="end" font-size="13" font-weight="bold" fill="#222">soles DOWN</text>
  <text x="167" y="272" text-anchor="middle" font-size="13" fill="#b03a2e">Both joints fold the SAME way,</text>
  <text x="167" y="289" text-anchor="middle" font-size="13" fill="#b03a2e">toward the sole</text>

  <!-- ===== Panel 2: hind legs ===== -->
  <rect x="335" y="40" width="315" height="262" rx="8" fill="#f7f7f4" stroke="#999" stroke-width="1.5"/>
  <text x="492" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a2a1e">HIND feet: a backward calf</text>
  <ellipse cx="435" cy="182" rx="13" ry="62" fill="#f3d6d0" stroke="#7a4a3a" stroke-width="2.5"/>
  <!-- tail -->
  <path d="M390,150 Q450,146 520,152" fill="none" stroke="#6b5a45" stroke-width="5" stroke-linecap="round"/>
  <text x="560" y="150" text-anchor="middle" font-size="13" fill="#222">tail</text>
  <!-- leg -->
  <line x1="372" y1="196" x2="500" y2="196" stroke="#6b5a45" stroke-width="14" stroke-linecap="round"/>
  <circle cx="376" cy="196" r="10" fill="#fbf3e6" stroke="#6b5a45" stroke-width="2"/>
  <!-- point of hock sticks up (sole side) -->
  <path d="M366,190 L360,172 L382,186 Z" fill="#6b5a45"/>
  <circle cx="505" cy="196" r="9" fill="#fbf3e6" stroke="#6b5a45" stroke-width="2"/>
  <line x1="511" y1="196" x2="547" y2="194" stroke="#6b5a45" stroke-width="11" stroke-linecap="round"/>
  <polygon points="547,181 591,181 587,195 547,205" fill="#3d3d3d"/>
  <!-- fold arrows: fetlock up, hock down -->
  <path d="M521,176 Q517,156 497,154" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M392,218 Q388,238 368,240" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="345" y="112" font-size="12" fill="#333">point of hock</text>
  <line x1="370" y1="116" x2="364" y2="170" stroke="#333" stroke-width="1"/>
  <text x="505" y="222" text-anchor="middle" font-size="12" fill="#333">fetlock</text>
  <line x1="594" y1="178" x2="612" y2="112" stroke="#333" stroke-width="1.2"/>
  <text x="640" y="104" text-anchor="end" font-size="13" font-weight="bold" fill="#222">soles UP</text>
  <text x="492" y="262" text-anchor="middle" font-size="13" fill="#b03a2e">The two joints fold OPPOSITE ways.</text>
  <text x="492" y="279" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2a1e">Pull it out fast:</text>
  <text x="492" y="295" text-anchor="middle" font-size="13" fill="#8a2a1e">the navel cord is pinched</text>

  <!-- ===== Panel 3: chains ===== -->
  <rect x="10" y="314" width="640" height="266" rx="8" fill="#f7f7f4" stroke="#999" stroke-width="1.5"/>
  <text x="330" y="338" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Putting on the pulling chain (a front leg, seen from the side)</text>
  <!-- big leg -->
  <rect x="70" y="410" width="270" height="36" rx="10" fill="#fbf3e6" stroke="#6b5a45" stroke-width="2.5"/>
  <circle cx="352" cy="428" r="24" fill="#fbf3e6" stroke="#6b5a45" stroke-width="2.5"/>
  <!-- dewclaws -->
  <ellipse cx="372" cy="456" rx="9" ry="6" fill="#3d3d3d"/>
  <rect x="372" y="415" width="88" height="28" rx="8" fill="#fbf3e6" stroke="#6b5a45" stroke-width="2.5"/>
  <polygon points="458,404 556,426 562,450 458,450" fill="#3d3d3d"/>
  <text x="352" y="398" text-anchor="middle" font-size="13" fill="#333">fetlock</text>
  <text x="372" y="482" text-anchor="middle" font-size="12" fill="#333">dewclaws</text>
  <text x="510" y="472" text-anchor="middle" font-size="13" fill="#333">hoof (sole down)</text>
  <text x="200" y="433" text-anchor="middle" font-size="13" fill="#555">cannon bone</text>
  <!-- loop 1 on cannon, 2-3 in above fetlock -->
  <ellipse cx="282" cy="428" rx="9" ry="27" fill="none" stroke="#2b4a8a" stroke-width="5" stroke-dasharray="7 3"/>
  <!-- loop 2 half hitch on pastern -->
  <ellipse cx="420" cy="429" rx="8" ry="22" fill="none" stroke="#2b4a8a" stroke-width="5" stroke-dasharray="7 3"/>
  <!-- chain along the top of the leg to the handle -->
  <path d="M420,407 L282,402 L40,392" fill="none" stroke="#2b4a8a" stroke-width="5" stroke-dasharray="7 3"/>
  <rect x="20" y="378" width="22" height="30" rx="4" fill="#2b4a8a"/>
  <text x="31" y="372" text-anchor="middle" font-size="12" fill="#2b4a8a">handle</text>
  <!-- labels for loops -->
  <line x1="282" y1="460" x2="240" y2="500" stroke="#333" stroke-width="1.2"/>
  <text x="30" y="514" font-size="13" font-weight="bold" fill="#2b4a8a">1. Loop on the cannon, 2–3 in above</text>
  <text x="30" y="530" font-size="13" font-weight="bold" fill="#2b4a8a">the fetlock and dewclaws</text>
  <line x1="420" y1="456" x2="440" y2="500" stroke="#333" stroke-width="1.2"/>
  <text x="400" y="514" font-size="13" font-weight="bold" fill="#2b4a8a">2. Half hitch between</text>
  <text x="400" y="530" font-size="13" font-weight="bold" fill="#2b4a8a">fetlock and hoof</text>
  <text x="330" y="556" text-anchor="middle" font-size="13" fill="#222">Pull only while she strains, one leg a few inches, then the other;</text>
  <text x="330" y="572" text-anchor="middle" font-size="13" fill="#222">once head and shoulders are out, pull down at about 45°. Never a chain on the jaw.</text>
</svg>
