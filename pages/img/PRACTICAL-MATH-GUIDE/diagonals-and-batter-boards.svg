<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="Arial, Helvetica, sans-serif">
  <title>Checking a 20 by 30 ft layout by its diagonals, with string lines on batter boards</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>
  <rect width="640" height="500" fill="#ffffff"/>
  <!-- building area -->
  <rect x="110" y="95" width="420" height="280" fill="#f1ede4"/>
  <!-- string lines -->
  <g stroke="#333" stroke-width="2">
    <line x1="60" y1="95" x2="580" y2="95"/>
    <line x1="60" y1="375" x2="580" y2="375"/>
    <line x1="110" y1="45" x2="110" y2="425"/>
    <line x1="530" y1="45" x2="530" y2="425"/>
  </g>
  <!-- batter boards: an L outside each corner -->
  <g stroke="#6b4a24" stroke-width="7" stroke-linecap="square">
    <path d="M60,120 L60,45 L135,45" fill="none"/>
    <path d="M580,120 L580,45 L505,45" fill="none"/>
    <path d="M60,350 L60,425 L135,425" fill="none"/>
    <path d="M580,350 L580,425 L505,425" fill="none"/>
  </g>
  <!-- corner stakes -->
  <g fill="#c0661b" stroke="#333" stroke-width="1.5">
    <circle cx="110" cy="95" r="6"/><circle cx="530" cy="95" r="6"/>
    <circle cx="110" cy="375" r="6"/><circle cx="530" cy="375" r="6"/>
  </g>
  <!-- diagonals -->
  <g stroke="#1f5f8b" stroke-width="3" stroke-dasharray="10 6">
    <line x1="110" y1="95" x2="530" y2="375"/>
    <line x1="530" y1="95" x2="110" y2="375"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#1f5f8b">
    <text transform="translate(420,292) rotate(33.69)" text-anchor="middle">36 ft ⅝ in</text>
    <text transform="translate(220,292) rotate(-33.69)" text-anchor="middle">36 ft ⅝ in</text>
  </g>
  <!-- sizes -->
  <g font-size="16" font-weight="bold" fill="#222">
    <text x="320" y="140" text-anchor="middle">30 ft</text>
    <text transform="translate(136,235) rotate(-90)" text-anchor="middle">20 ft</text>
  </g>
  <!-- labels -->
  <g font-size="14" fill="#222">
    <text x="150" y="30">batter boards, set back from the corners</text>
    <line x1="145" y1="34" x2="128" y2="42" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="320" y="87" text-anchor="middle">string line</text>
    <text x="518" y="402" text-anchor="end">corner stake</text>
  </g>
  <g font-size="15" fill="#222">
    <text x="320" y="458" text-anchor="middle" font-weight="bold">Square only when both diagonals are the same length.</text>
    <text x="320" y="480" text-anchor="middle">Strings hang on batter boards set back from the corners, so they survive digging.</text>
  </g>
</svg>
