<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Arial, Helvetica, sans-serif">
  <title>Laying out steps to a porch 36 inches high: 5 risers and 4 treads</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>
  <rect width="640" height="440" fill="#ffffff"/>
  <!-- porch -->
  <rect x="400" y="118" width="140" height="252" fill="#e8e3d8" stroke="#555" stroke-width="2"/>
  <text x="470" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#444">PORCH</text>
  <!-- stairs -->
  <path d="M120,370 L120,319.6 L190,319.6 L190,269.2 L260,269.2 L260,218.8 L330,218.8 L330,168.4 L400,168.4 L400,118 L400,370 Z" fill="#e7cfa8" stroke="#6b4a24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ground -->
  <line x1="20" y1="370" x2="620" y2="370" stroke="#555" stroke-width="2.5"/>
  <!-- riser numbers -->
  <g font-size="14" font-weight="bold" fill="#6b4a24">
    <text x="128" y="350">1</text><text x="198" y="299">2</text><text x="268" y="249">3</text><text x="338" y="198">4</text><text x="408" y="148">5</text>
  </g>
  <!-- single step labels -->
  <g font-size="14" fill="#222">
    <text x="112" y="342" text-anchor="end" font-weight="bold">riser</text>
    <text x="112" y="358" text-anchor="end">7.2 in</text>
    <text x="150" y="294" text-anchor="middle" font-weight="bold">tread</text>
    <text x="150" y="311" text-anchor="middle">10 in</text>
  </g>
  <!-- overall dimensions -->
  <g stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="122" y1="392" x2="398" y2="392"/>
    <line x1="570" y1="120" x2="570" y2="368"/>
  </g>
  <line x1="545" y1="118" x2="580" y2="118" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <g font-size="15" font-weight="bold" fill="#222">
    <text x="260" y="415" text-anchor="middle">run 40 in = 4 treads × 10 in</text>
    <text transform="translate(596,244) rotate(-90)" text-anchor="middle">36 in = 5 risers × 7.2 in</text>
  </g>
  <!-- rules -->
  <g font-size="15" fill="#222">
    <text x="20" y="32" font-weight="bold">Check the step:</text>
    <text x="20" y="54">riser + tread = 17–19 in → 7.2 + 10 = 17.2</text>
    <text x="20" y="76">riser × tread = 70–75 → 7.2 × 10 = 72</text>
    <text x="20" y="98">One fewer tread than risers (the porch is the last step).</text>
  </g>
  <text x="20" y="432" font-size="13" fill="#555">Side view.</text>
</svg>
