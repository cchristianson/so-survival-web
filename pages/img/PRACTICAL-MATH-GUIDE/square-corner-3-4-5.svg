<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Arial, Helvetica, sans-serif">
  <title>Squaring a corner with the 3-4-5 triangle, seen from above</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>
  <rect width="640" height="440" fill="#ffffff"/>
  <!-- strings -->
  <line x1="110" y1="370" x2="600" y2="370" stroke="#333" stroke-width="2.5"/>
  <line x1="110" y1="370" x2="110" y2="40" stroke="#333" stroke-width="2.5"/>
  <!-- right-angle marker -->
  <path d="M110,348 L132,348 L132,370" fill="none" stroke="#333" stroke-width="1.6"/>
  <!-- tape across: 5 ft -->
  <line x1="110" y1="160" x2="390" y2="370" stroke="#c0661b" stroke-width="5"/>
  <!-- stakes -->
  <g fill="#8a5a2b" stroke="#4d3115" stroke-width="2">
    <rect x="102" y="362" width="16" height="16"/>
    <rect x="592" y="362" width="16" height="16"/>
    <rect x="102" y="32" width="16" height="16"/>
  </g>
  <!-- marks -->
  <g fill="#c0661b" stroke="#333" stroke-width="2">
    <circle cx="390" cy="370" r="8"/>
    <circle cx="110" cy="160" r="8"/>
  </g>
  <!-- labels -->
  <g font-size="16" fill="#222">
    <text x="88" y="270" text-anchor="end" font-weight="bold">3 ft</text>
    <text x="250" y="398" text-anchor="middle" font-weight="bold">4 ft</text>
    <text x="110" y="405" text-anchor="middle" font-size="14">corner stake</text>
    <text x="0" y="0" transform="translate(268,250) rotate(36.87)" text-anchor="middle" font-weight="bold" fill="#8a4410">exactly 5 ft</text>
    <text x="400" y="352" font-size="14">mark</text>
    <text x="124" y="155" font-size="14">mark</text>
    <text x="128" y="60" font-size="14">string</text>
    <text x="520" y="358" font-size="14">string</text>
  </g>
  <!-- explanation -->
  <g font-size="15" fill="#222">
    <text x="320" y="70" font-weight="bold">Marks exactly 5 ft apart</text>
    <text x="320" y="90" font-weight="bold">= the corner is square.</text>
    <text x="320" y="128">Bigger is more accurate —</text>
    <text x="320" y="148">never start under 6 ft:</text>
    <text x="336" y="174">6 – 8 – 10 ft</text>
    <text x="336" y="196">9 – 12 – 15 ft</text>
    <text x="336" y="218">12 – 16 – 20 ft</text>
    <text x="336" y="236" font-size="13" fill="#444">(for a 50 × 100 ft layout)</text>
  </g>
  <text x="320" y="432" text-anchor="middle" font-size="13" fill="#555">Seen from above.</text>
</svg>
