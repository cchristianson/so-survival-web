<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="Arial, Helvetica, sans-serif">
  <title>An irregular pasture split into two triangles by a diagonal, with all sides measured</title>
  <rect width="640" height="560" fill="#ffffff"/>
  <!-- two triangles -->
  <polygon points="110,290 510,290 347.4,52.2" fill="#e3efd9" stroke="#333" stroke-width="2.5"/>
  <polygon points="110,290 510,290 343.6,484.6" fill="#f3ead2" stroke="#333" stroke-width="2.5"/>
  <line x1="110" y1="290" x2="510" y2="290" stroke="#1f5f8b" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- corner stakes -->
  <g fill="#8a5a2b" stroke="#4d3115" stroke-width="1.5">
    <circle cx="110" cy="290" r="6"/><circle cx="510" cy="290" r="6"/>
    <circle cx="347.4" cy="52.2" r="6"/><circle cx="343.6" cy="484.6" r="6"/>
  </g>
  <!-- side lengths -->
  <g font-size="16" font-weight="bold" fill="#222">
    <text x="208" y="160" text-anchor="end">210 ft</text>
    <text x="452" y="160">180 ft</text>
    <text x="448" y="402">160 ft</text>
    <text x="210" y="402" text-anchor="end">190 ft</text>
    <text x="310" y="282" text-anchor="middle" fill="#1f5f8b">250 ft diagonal</text>
  </g>
  <!-- areas -->
  <g font-size="16" fill="#222" text-anchor="middle">
    <text x="322" y="214" font-weight="bold">18,573 sq ft</text>
    <text x="322" y="234" font-size="13" fill="#444">(210, 180, 250)</text>
    <text x="322" y="352" font-weight="bold">15,199 sq ft</text>
    <text x="322" y="372" font-size="13" fill="#444">(250, 160, 190)</text>
  </g>
  <!-- method -->
  <g font-size="14" fill="#222">
    <text x="16" y="30" font-weight="bold">Area of a triangle from its 3 sides:</text>
    <text x="16" y="50">s = half the perimeter</text>
    <text x="16" y="70">area = √(s(s−a)(s−b)(s−c))</text>
  </g>
  <text x="320" y="530" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Total 33,772 sq ft = 0.78 acre</text>
  <text x="320" y="550" text-anchor="middle" font-size="13" fill="#555">Measure level distances, not along a slope.</text>
</svg>
