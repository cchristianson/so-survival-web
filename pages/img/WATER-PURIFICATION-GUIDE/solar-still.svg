<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Arial, Helvetica, sans-serif">
  <title>A solar still cut open: sun heats a black basin of salty or dirty water, vapor condenses on sloped glass and runs into a gutter</title>
  <rect width="640" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2f6fa8"/></marker>
    <pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e9dcc0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b9a275" stroke-width="2"/></pattern>
  </defs>

  <!-- sun -->
  <circle cx="44" cy="44" r="22" fill="#f4c430" stroke="#c99a10" stroke-width="2"/>
  <g stroke="#e0a800" stroke-width="2.5">
    <line x1="74" y1="62" x2="150" y2="118"/><line x1="66" y1="74" x2="118" y2="124"/><line x1="82" y1="50" x2="210" y2="122"/>
  </g>
  <text x="76" y="30" font-size="15" fill="#222">Sun heats the dark basin</text>

  <!-- insulated box -->
  <rect x="80" y="270" width="442" height="32" fill="url(#ins)" stroke="#6b5a3a" stroke-width="2"/>
  <rect x="80" y="108" width="12" height="164" fill="#8b6f47" stroke="#5b4a30" stroke-width="1.5"/>
  <rect x="510" y="212" width="12" height="60" fill="#8b6f47" stroke="#5b4a30" stroke-width="1.5"/>

  <!-- black basin with water -->
  <rect x="96" y="240" width="370" height="30" fill="#222"/>
  <rect x="100" y="248" width="362" height="18" fill="#6fa8d6"/>
  <line x1="100" y1="248" x2="462" y2="248" stroke="#2f6fa8" stroke-width="2"/>

  <!-- gutter -->
  <path d="M470,212 L470,234 L508,234 L508,214" fill="#cfe3f3" stroke="#333" stroke-width="2.5"/>
  <!-- outlet pipe and jar -->
  <path d="M508,226 L560,226 L560,296" fill="none" stroke="#2f6fa8" stroke-width="5"/>
  <path d="M542,300 L578,300 L584,312 L584,372 L536,372 L536,312 Z" fill="#e8f2fa" stroke="#333" stroke-width="2"/>
  <rect x="538" y="330" width="44" height="40" fill="#9cc6e6"/>
  <text x="560" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4f7a">clean water</text>

  <!-- sloped glass -->
  <line x1="86" y1="108" x2="526" y2="214" stroke="#3a8fb7" stroke-width="5"/>

  <!-- vapor rising -->
  <g fill="none" stroke="#2f6fa8" stroke-width="2" marker-end="url(#b)">
    <path d="M335,244 q-6,-12 0,-24 q6,-12 0,-24"/>
    <path d="M375,244 q-6,-11 0,-21 q6,-10 0,-20"/>
    <path d="M415,244 q-6,-9 0,-17 q6,-8 0,-16"/>
  </g>
  <!-- drops under the glass, running down -->
  <g fill="#2f6fa8">
    <circle cx="200" cy="140" r="3.5"/><circle cx="260" cy="154" r="3.5"/><circle cx="320" cy="169" r="3.5"/>
    <circle cx="380" cy="183" r="3.5"/><circle cx="440" cy="198" r="3.5"/><circle cx="480" cy="208" r="3.5"/>
  </g>
  <line x1="404" y1="193" x2="460" y2="206" stroke="#2f6fa8" stroke-width="2" marker-end="url(#b)"/>

  <!-- labels -->
  <line x1="300" y1="100" x2="300" y2="146" stroke="#333" stroke-width="1.4"/>
  <text x="300" y="94" text-anchor="middle" font-size="15" fill="#222">Glass or clear plastic, sloped</text>

  <text x="112" y="196" font-size="14.5" fill="#1f4f7a">Water turns to vapor and</text>
  <text x="112" y="214" font-size="14.5" fill="#1f4f7a">forms drops on the cool glass</text>

  <text x="532" y="172" font-size="14.5" fill="#222">Drops run</text>
  <text x="532" y="189" font-size="14.5" fill="#222">down into</text>
  <text x="532" y="206" font-size="14.5" fill="#222">the gutter</text>

  <text x="96" y="326" font-size="15" font-weight="bold" fill="#222">Black basin: salty or dirty water goes in.</text>
  <text x="96" y="346" font-size="14.5" fill="#333">Salt, metals and germs stay behind.</text>

  <text x="320" y="418" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#222">About 1 gallon a day for each 10–12 sq ft of glass</text>
</svg>
