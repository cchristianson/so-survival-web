<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Arial, Helvetica, sans-serif">
  <title>A solar pump fills a covered tank on the hill at midday; gravity delivers the water to the house later, 0.43 psi for each foot of height</title>
  <rect width="640" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#1f5f99"/></marker>
  </defs>

  <!-- hill and ground -->
  <path d="M0,118 L170,118 C240,130 300,230 360,300 C380,318 400,330 430,335 L640,335 L640,440 L0,440 Z" fill="#e9e3d3" stroke="#6b6359" stroke-width="2"/>

  <!-- tank, half buried in the hilltop -->
  <rect x="45" y="88" width="120" height="60" rx="4" fill="#9cc3e4" stroke="#2f5d86" stroke-width="2.5"/>
  <rect x="40" y="80" width="130" height="10" fill="#7d7d7d" stroke="#333" stroke-width="1.5"/>
  <line x1="45" y1="98" x2="165" y2="98" stroke="#2f5d86" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="105" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3f5e">TANK</text>
  <g font-size="13.5" fill="#222">
    <text x="15" y="30" font-weight="bold">Covered tightly, on a hill,</text>
    <text x="15" y="47">partly buried against frost.</text>
    <text x="15" y="64">Holds 3 days or more.</text>
  </g>

  <!-- solar pump at a well near the bottom -->
  <rect x="215" y="352" width="24" height="60" fill="#d9d4cb" stroke="#555" stroke-width="2"/>
  <text x="227" y="430" text-anchor="middle" font-size="13" fill="#222">well</text>
  <g transform="translate(150,300) rotate(-30)">
    <rect x="0" y="0" width="60" height="38" fill="#dfe7f2" stroke="#2f3e55" stroke-width="2"/>
    <line x1="30" y1="0" x2="30" y2="38" stroke="#9fb0c8"/><line x1="0" y1="19" x2="60" y2="19" stroke="#9fb0c8"/>
  </g>
  <line x1="190" y1="330" x2="190" y2="350" stroke="#555" stroke-width="3"/>
  <text x="110" y="372" font-size="13" fill="#222">solar pump runs</text>
  <text x="110" y="388" font-size="13" fill="#222">only when the</text>
  <text x="110" y="404" font-size="13" fill="#222">sun shines</text>
  <!-- fill line up the hill -->
  <path d="M232,352 C250,300 220,250 200,200 C185,160 175,135 160,125" fill="none" stroke="#1f5f99" stroke-width="4" marker-end="url(#b)"/>
  <text x="140" y="240" font-size="13" fill="#1f5f99" font-weight="bold">fill line</text>

  <!-- supply line down to the house -->
  <path d="M168,140 C260,160 300,240 360,305 C390,330 420,330 470,322" fill="none" stroke="#1f5f99" stroke-width="4" stroke-dasharray="10 5" marker-end="url(#b)"/>
  <text x="330" y="232" font-size="13" fill="#1f5f99" font-weight="bold">to the house, by gravity</text>

  <!-- house -->
  <path d="M470,265 L530,225 L590,265 L590,335 L470,335 Z" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <line x1="478" y1="322" x2="500" y2="322" stroke="#333" stroke-width="4"/>
  <path d="M500,322 L500,330" stroke="#333" stroke-width="3"/>
  <text x="530" y="300" text-anchor="middle" font-size="13" fill="#222">highest</text>
  <text x="530" y="316" text-anchor="middle" font-size="13" fill="#222">faucet</text>

  <!-- height -->
  <line x1="175" y1="98" x2="630" y2="98" stroke="#2f5d86" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="590" y1="322" x2="630" y2="322" stroke="#2f5d86" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="615" y1="103" x2="615" y2="317" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="440" y="120" width="165" height="78" rx="6" fill="#eef4fa" stroke="#2f5d86" stroke-width="1.5"/>
  <text x="522" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d3f5e">40 ft up</text>
  <text x="522" y="161" text-anchor="middle" font-size="13.5" fill="#222">≈ 17 psi at the faucet</text>
  <text x="522" y="180" text-anchor="middle" font-size="13" fill="#222">(0.43 psi per foot)</text>
</svg>
