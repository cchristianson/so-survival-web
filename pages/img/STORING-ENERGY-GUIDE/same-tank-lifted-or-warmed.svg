<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Arial, Helvetica, sans-serif">
  <title>The same 1,000 gallons of water stores about 94 watt-hours lifted 30 feet, but about 122,000 watt-hours warmed 50 degrees</title>
  <rect width="640" height="420" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>

  <!-- ===== LIFTED ===== -->
  <text x="160" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">LIFTED 30 FT</text>
  <!-- tower -->
  <g stroke="#6b5a45" stroke-width="4"><line x1="110" y1="140" x2="95" y2="300"/><line x1="190" y1="140" x2="205" y2="300"/></g>
  <g stroke="#6b5a45" stroke-width="2"><line x1="108" y1="180" x2="192" y2="180"/><line x1="104" y1="230" x2="197" y2="230"/><line x1="108" y1="180" x2="197" y2="230"/><line x1="192" y1="180" x2="104" y2="230"/></g>
  <!-- tank -->
  <rect x="95" y="60" width="110" height="80" rx="6" fill="#9cc3e4" stroke="#2f5d86" stroke-width="2.5"/>
  <text x="150" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3f5e">1,000 gal</text>
  <text x="150" y="116" text-anchor="middle" font-size="13" fill="#1d3f5e">of water</text>
  <!-- height arrow -->
  <line x1="245" y1="100" x2="245" y2="296" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="252" y="205" font-size="14" font-weight="bold" fill="#222">30 ft</text>
  <line x1="20" y1="300" x2="300" y2="300" stroke="#6b6359" stroke-width="2"/>
  <!-- result -->
  <rect x="25" y="318" width="270" height="88" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
  <text x="160" y="352" text-anchor="middle" font-size="26" font-weight="bold" fill="#555">94 Wh</text>
  <text x="160" y="375" text-anchor="middle" font-size="13.5" fill="#333">a light and a phone</text>
  <text x="160" y="393" text-anchor="middle" font-size="13.5" fill="#333">for one evening</text>

  <line x1="320" y1="20" x2="320" y2="405" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== WARMED ===== -->
  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">WARMED 50 °F</text>
  <rect x="425" y="190" width="110" height="110" rx="6" fill="#f0a27a" stroke="#a3461f" stroke-width="2.5"/>
  <text x="480" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#5e230b">1,000 gal</text>
  <text x="480" y="256" text-anchor="middle" font-size="13" fill="#5e230b">of water</text>
  <!-- insulation -->
  <rect x="413" y="178" width="134" height="122" rx="10" fill="none" stroke="#c9b48a" stroke-width="10" stroke-dasharray="4 3"/>
  <text x="480" y="168" text-anchor="middle" font-size="13" fill="#6d5a2e">well insulated</text>
  <line x1="340" y1="300" x2="620" y2="300" stroke="#6b6359" stroke-width="2"/>
  <rect x="345" y="318" width="270" height="88" rx="8" fill="#fdeee6" stroke="#a3461f" stroke-width="2"/>
  <text x="480" y="352" text-anchor="middle" font-size="26" font-weight="bold" fill="#a3461f">122,000 Wh</text>
  <text x="480" y="375" text-anchor="middle" font-size="13.5" fill="#333">about 20 hours of house heat</text>
  <text x="480" y="393" text-anchor="middle" font-size="13.5" fill="#333">about a thousand times more</text>
</svg>
