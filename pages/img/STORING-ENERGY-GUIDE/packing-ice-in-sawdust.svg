<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Arial, Helvetica, sans-serif">
  <title>Cross-section of ice packed in sawdust: at least 15 inches under the ice, 15 to 18 inches between ice and walls, and a drained floor</title>
  <rect width="640" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <pattern id="saw" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#ead9b0"/><circle cx="3" cy="3" r="1.1" fill="#b89b5e"/><circle cx="8" cy="7" r="1" fill="#b89b5e"/></pattern>
    <pattern id="grav" width="14" height="10" patternUnits="userSpaceOnUse"><rect width="14" height="10" fill="#d6d1c7"/><circle cx="4" cy="5" r="3" fill="#a59e90"/><circle cx="11" cy="3" r="2" fill="#a59e90"/></pattern>
  </defs>

  <!-- roof -->
  <path d="M70,70 L320,22 L570,70" fill="none" stroke="#333" stroke-width="3"/>
  <!-- walls -->
  <rect x="80" y="70" width="18" height="300" fill="#a9773f" stroke="#5e4220" stroke-width="2"/>
  <rect x="542" y="70" width="18" height="300" fill="#a9773f" stroke="#5e4220" stroke-width="2"/>
  <!-- sawdust fill -->
  <rect x="98" y="88" width="444" height="252" fill="url(#saw)"/>
  <!-- drained floor -->
  <rect x="80" y="340" width="480" height="30" fill="url(#grav)" stroke="#6b6359" stroke-width="1.5"/>
  <path d="M560,362 L610,380" stroke="#1f5f99" stroke-width="3" fill="none"/>
  <path d="M600,370 L612,381 L597,384" stroke="#1f5f99" stroke-width="3" fill="none"/>
  <text x="560" y="405" text-anchor="middle" font-size="13" fill="#1f5f99" font-weight="bold">meltwater drains away</text>

  <!-- ice stack, close to a cube -->
  <g fill="#cfe6f7" stroke="#4d86b3" stroke-width="2">
    <rect x="196" y="130" width="62" height="42"/><rect x="258" y="130" width="62" height="42"/><rect x="320" y="130" width="62" height="42"/><rect x="382" y="130" width="62" height="42"/>
    <rect x="196" y="172" width="62" height="42"/><rect x="258" y="172" width="62" height="42"/><rect x="320" y="172" width="62" height="42"/><rect x="382" y="172" width="62" height="42"/>
    <rect x="196" y="214" width="62" height="42"/><rect x="258" y="214" width="62" height="42"/><rect x="320" y="214" width="62" height="42"/><rect x="382" y="214" width="62" height="42"/>
    <rect x="196" y="256" width="62" height="42"/><rect x="258" y="256" width="62" height="42"/><rect x="320" y="256" width="62" height="42"/><rect x="382" y="256" width="62" height="42"/>
  </g>
  <rect x="246" y="182" width="148" height="82" rx="6" fill="#e7f2fb" stroke="#4d86b3" stroke-width="1"/>
  <text x="320" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d3f5e">ICE</text>
  <text x="320" y="240" text-anchor="middle" font-size="13" fill="#1d3f5e">stacked tight,</text>
  <text x="320" y="256" text-anchor="middle" font-size="13" fill="#1d3f5e">close to a cube</text>

  <!-- dimension: bed under the ice -->
  <line x1="470" y1="302" x2="470" y2="336" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="478" y="316" font-size="13" font-weight="bold" fill="#222">15 in</text>
  <text x="478" y="331" font-size="13" fill="#222">or more</text>
  <!-- dimension: side gap -->
  <line x1="102" y1="150" x2="192" y2="150" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="147" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">15–18 in</text>
  <text x="147" y="176" text-anchor="middle" font-size="13" fill="#222">sawdust,</text>
  <text x="147" y="192" text-anchor="middle" font-size="13" fill="#222">rammed</text>
  <line x1="448" y1="150" x2="538" y2="150" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="493" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">15–18 in</text>
  <text x="320" y="112" text-anchor="middle" font-size="13" fill="#5e4a1e">sawdust over the top too</text>

  <g font-size="13.5" fill="#222">
    <text x="20" y="400">Bed of sawdust or shavings under the ice; packing between ice and walls.</text>
    <text x="20" y="418">1 ton of ice takes about 35 cu ft. A block in its own meltwater melts in hours.</text>
  </g>
  <text x="20" y="436" font-size="13" fill="#555">Cross-section. Not to scale.</text>
</svg>
