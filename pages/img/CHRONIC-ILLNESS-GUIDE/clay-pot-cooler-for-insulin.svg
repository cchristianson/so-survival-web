<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" font-family="Arial, Helvetica, sans-serif">
  <title>A clay-pot cooler cut open: a pot inside a pot with wet sand between and a wet cloth on top, insulin and a thermometer inside, and the temperatures to keep</title>
  <rect width="620" height="470" fill="#ffffff"/>
  <defs>
    <pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#c9a77c"/><circle cx="3" cy="3" r="1.3" fill="#8a6a48"/><circle cx="8" cy="7" r="1.1" fill="#7aa7c7"/></pattern>
    <marker id="h" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c8431a"/></marker>
  </defs>

  <!-- outer pot, cut open, with wet sand inside -->
  <path d="M170,118 H450 C452,200 438,290 400,352 H220 C182,290 168,200 170,118 z" fill="url(#sand)" stroke="#a0522d" stroke-width="12" stroke-linejoin="round"/>
  <!-- inner pot -->
  <path d="M222,122 H398 C398,200 388,260 362,316 H258 C232,260 222,200 222,122 z" fill="#f7f3ea" stroke="#b5653a" stroke-width="7" stroke-linejoin="round"/>
  <!-- foot -->
  <rect x="250" y="356" width="120" height="16" rx="3" fill="#a0522d"/>
  <line x1="60" y1="372" x2="560" y2="372" stroke="#6b5a45" stroke-width="2.5"/>

  <!-- wet cloth over the top -->
  <path d="M156,116 C190,104 230,112 270,104 C310,96 350,110 390,102 C420,98 448,106 464,116 L462,132 C440,126 420,132 400,128 L220,128 C200,132 178,126 158,132 z" fill="#8fb7d6" stroke="#4f7fa6" stroke-width="2"/>

  <!-- insulin vial -->
  <rect x="268" y="236" width="30" height="62" rx="5" fill="#e8f2f8" stroke="#333" stroke-width="2"/>
  <rect x="272" y="226" width="22" height="12" rx="2" fill="#d14b3b" stroke="#333" stroke-width="1.5"/>
  <rect x="271" y="256" width="24" height="24" fill="#ffffff" stroke="#999" stroke-width="1"/>
  <!-- thermometer -->
  <rect x="330" y="176" width="12" height="114" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="336" cy="296" r="11" fill="#d14b3b" stroke="#333" stroke-width="2"/>
  <rect x="333" y="232" width="6" height="60" fill="#d14b3b"/>
  <g stroke="#333" stroke-width="1.2"><line x1="342" y1="196" x2="348" y2="196"/><line x1="342" y1="216" x2="348" y2="216"/><line x1="342" y1="236" x2="348" y2="236"/><line x1="342" y1="256" x2="348" y2="256"/></g>

  <!-- heat carried off as the water evaporates -->
  <g stroke="#c8431a" stroke-width="2.5" fill="none" marker-end="url(#h)">
    <path d="M462,190 C478,180 486,200 504,188"/>
    <path d="M454,270 C470,260 478,280 496,268"/>
    <path d="M160,160 C144,150 136,170 118,158"/>
    <path d="M162,208 C146,198 138,218 120,206"/>
  </g>

  <!-- labels -->
  <g font-size="15" fill="#222">
    <text x="20" y="40" font-weight="bold">Wet cloth on top</text>
    <line x1="120" y1="48" x2="190" y2="110" stroke="#333" stroke-width="1.2"/>
    <text x="400" y="40" font-weight="bold">Two clay pots,</text>
    <text x="400" y="58" font-weight="bold">wet sand between</text>
    <line x1="440" y1="66" x2="420" y2="160" stroke="#333" stroke-width="1.2"/>
    <text x="512" y="220" font-weight="bold" fill="#c8431a">Water drying</text>
    <text x="512" y="238" font-weight="bold" fill="#c8431a">off the pot</text>
    <text x="512" y="256" font-weight="bold" fill="#c8431a">carries the</text>
    <text x="512" y="274" font-weight="bold" fill="#c8431a">heat away</text>
    <text x="20" y="300" font-weight="bold">insulin</text>
    <line x1="80" y1="296" x2="264" y2="270" stroke="#333" stroke-width="1.2"/>
    <text x="20" y="250" font-weight="bold">a thermometer</text>
    <text x="20" y="268">to check it</text>
    <line x1="122" y1="246" x2="326" y2="214" stroke="#333" stroke-width="1.2"/>
  </g>

  <!-- the numbers -->
  <rect x="20" y="390" width="580" height="70" rx="6" fill="#eef4f8" stroke="#4f7fa6" stroke-width="1.5"/>
  <g font-size="15" fill="#222">
    <text x="34" y="414"><tspan font-weight="bold">Inside: 13–22 °C</tspan> on 30–45 °C days, in dry heat.</text>
    <text x="34" y="436"><tspan font-weight="bold">Opened insulin: below 25 °C (77 °F),</tspan> out of the light,</text>
    <text x="34" y="454">4 weeks at most. <tspan font-weight="bold" fill="#c8431a">Never let it freeze.</tspan></text>
  </g>
</svg>
