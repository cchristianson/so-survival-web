<svg xmlns="http://www.w3.org/2000/svg" width="660" height="480" viewBox="0 0 660 480" font-family="Arial, Helvetica, sans-serif">
  <title>Two ways to burn lime: a heap of limestone on a ring of logs, and a shaft kiln at least six times as tall as it is wide</title>
  <rect width="660" height="480" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <pattern id="brick" width="16" height="10" patternUnits="userSpaceOnUse">
      <rect width="16" height="10" fill="#c8735a"/><path d="M0,10 H16 M8,0 V5 M0,5 H16 M16,5 V10" stroke="#8e4a35" stroke-width="1" fill="none"/>
    </pattern>
    <pattern id="stone" width="18" height="14" patternUnits="userSpaceOnUse">
      <rect width="18" height="14" fill="#cfcac0"/><path d="M1,6 l6,-4 l6,2 l-1,5 l-8,1 z" fill="#a19b90" stroke="#6b665d" stroke-width="0.8"/><circle cx="14" cy="11" r="2.2" fill="#3b3128"/>
    </pattern>
    <pattern id="lime" width="16" height="12" patternUnits="userSpaceOnUse">
      <rect width="16" height="12" fill="#f6f4ee"/><path d="M2,8 l5,-5 l6,2 l-2,5 z" fill="#ffffff" stroke="#b9b4aa" stroke-width="0.8"/>
    </pattern>
  </defs>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Simplest: a heap</text>
  <text x="360" y="28" font-size="16" font-weight="bold" fill="#222">A shaft kiln</text>

  <!-- HEAP -->
  <line x1="20" y1="380" x2="300" y2="380" stroke="#6b5a45" stroke-width="2.5"/>
  <!-- limestone mound -->
  <path d="M50,330 Q160,210 270,330 Z" fill="url(#stone)" stroke="#6b665d" stroke-width="1.5"/>
  <!-- ring of logs (log ends) -->
  <g fill="#a8794a" stroke="#6b4a24" stroke-width="1.5">
    <circle cx="60" cy="356" r="22"/><circle cx="106" cy="356" r="22"/><circle cx="152" cy="356" r="22"/>
    <circle cx="198" cy="356" r="22"/><circle cx="244" cy="356" r="22"/>
      </g>
  <g font-size="13" fill="#222">
    <text x="160" y="236" text-anchor="middle">limestone broken to 4–6 in,</text>
    <text x="160" y="252" text-anchor="middle">heaped on top</text>
    <text x="160" y="408" text-anchor="middle">a ring of logs underneath</text>
    <text x="160" y="436" text-anchor="middle" font-weight="bold">Gives under 1,100 lb of lime.</text>
  </g>

  <!-- SHAFT KILN: inner width 56, height 336 (6 x 56), y 50..386 -->
  <rect x="420" y="50" width="22" height="336" fill="url(#brick)" stroke="#6e3a2a" stroke-width="1.2"/>
  <rect x="498" y="50" width="22" height="336" fill="url(#brick)" stroke="#6e3a2a" stroke-width="1.2"/>
  <!-- charge: stone and fuel above, burning zone, lime below -->
  <rect x="442" y="60" width="56" height="140" fill="url(#stone)"/>
  <rect x="442" y="200" width="56" height="90" fill="#f2a24a"/>
  <rect x="442" y="200" width="56" height="90" fill="url(#stone)" opacity="0.45"/>
  <rect x="442" y="290" width="56" height="80" fill="url(#lime)"/>
  <!-- draw opening -->
  <rect x="498" y="350" width="22" height="34" fill="#ffffff" stroke="#6e3a2a" stroke-width="1.2"/>
  <line x1="420" y1="386" x2="650" y2="386" stroke="#6b5a45" stroke-width="2.5"/>
  <!-- arrows -->
  <line x1="470" y1="20" x2="470" y2="56" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="368" x2="560" y2="368" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <!-- dimensions -->
  <line x1="442" y1="404" x2="498" y2="404" stroke="#333" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="470" y="424" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">W</text>
  <line x1="400" y1="52" x2="400" y2="384" stroke="#333" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="392" y="210" text-anchor="end" font-size="14" font-weight="bold" fill="#222">at least</text>
  <text x="392" y="228" text-anchor="end" font-size="14" font-weight="bold" fill="#222">6 × W</text>
  <!-- labels -->
  <g font-size="13" fill="#222">
    <text x="530" y="74">stone and fuel</text>
    <text x="530" y="90">go in the top</text>
    <text x="530" y="236" font-weight="bold">burning zone:</text>
    <text x="530" y="252">about 1,830°F</text>
    <text x="530" y="268">for several hours</text>
    <text x="566" y="350">lime comes</text>
    <text x="566" y="366">out the bottom</text>
  </g>
  <text x="20" y="470" font-size="13" fill="#8a2a0a" font-weight="bold">Burn lime only in the wet season. Underburn rather than overburn.</text>
</svg>
