<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="Arial, Helvetica, sans-serif">
  <title>Where doors and windows may go in an earth wall in quake country</title>
  <rect width="680" height="480" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>
  <!-- scale 24 px per ft; wall from x=50 to 602 (23 ft) -->
  <!-- overall length -->
  <line x1="50" y1="40" x2="602" y2="40" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="326" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">unsupported wall: 23 ft at most</text>
  <!-- ring beam -->
  <rect x="44" y="70" width="564" height="16" fill="#a77b48" stroke="#5e3f1e" stroke-width="1.5"/>
  <text x="326" y="63" text-anchor="middle" font-size="13" fill="#5e3f1e">closed timber ring beam on top, tied down to the foundation</text>
  <!-- earth wall -->
  <rect x="50" y="86" width="552" height="240" fill="#e2c9a0" stroke="#8c6a3c" stroke-width="2"/>
  <!-- plinth -->
  <rect x="44" y="326" width="564" height="34" fill="#b9b4aa" stroke="#6b6359" stroke-width="1.5"/>
  <text x="326" y="348" text-anchor="middle" font-size="13" fill="#333">stone plinth</text>
  <line x1="20" y1="360" x2="640" y2="360" stroke="#6b5a45" stroke-width="2"/>

  <!-- window 1: x 98-194 (2 ft from corner, 4 ft wide), y 134-230 -->
  <rect x="58" y="122" width="176" height="12" fill="#a77b48" stroke="#5e3f1e" stroke-width="1.2"/>
  <rect x="98" y="134" width="96" height="96" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <!-- door: x 272-344 (3 1/4 ft pier, 3 ft door), y 158-326 -->
  <rect x="232" y="146" width="152" height="12" fill="#a77b48" stroke="#5e3f1e" stroke-width="1.2"/>
  <rect x="272" y="158" width="72" height="168" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <!-- window 2: x 422-518, y 134-230; 3.5 ft to corner -->
  <rect x="382" y="122" width="176" height="12" fill="#a77b48" stroke="#5e3f1e" stroke-width="1.2"/>
  <rect x="422" y="134" width="96" height="96" fill="#ffffff" stroke="#555" stroke-width="2"/>

  <!-- lintel bearing callout on window 2 -->
  <line x1="518" y1="104" x2="558" y2="104" stroke="#333" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="518" y1="100" x2="518" y2="122" stroke="#333" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="558" y1="100" x2="558" y2="122" stroke="#333" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="566" y="109" font-size="13" font-weight="bold" fill="#222">20 in</text>
  <text x="470" y="258" text-anchor="middle" font-size="13" fill="#333">lintels run 20 in</text>
  <text x="470" y="274" text-anchor="middle" font-size="13" fill="#333">into the wall each side</text>
  <g font-size="13" fill="#333" text-anchor="middle"><text x="308" y="232">door</text><text x="308" y="248">opens</text><text x="308" y="264">outward</text></g>

  <!-- height -->
  <line x1="622" y1="86" x2="622" y2="324" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="630" y="196" font-size="13" font-weight="bold" fill="#222">11.5</text>
  <text x="630" y="212" font-size="13" font-weight="bold" fill="#222">ft at</text>
  <text x="630" y="228" font-size="13" font-weight="bold" fill="#222">most</text>

  <!-- bottom dimensions -->
  <g stroke="#333" stroke-width="1.4">
    <line x1="50" y1="384" x2="98" y2="384" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="98" y1="384" x2="194" y2="384" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="194" y1="384" x2="272" y2="384" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="344" y1="384" x2="422" y2="384" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g stroke="#999" stroke-width="1" stroke-dasharray="2 3">
    <line x1="50" y1="362" x2="50" y2="392"/><line x1="98" y1="230" x2="98" y2="392"/><line x1="194" y1="230" x2="194" y2="392"/>
    <line x1="272" y1="362" x2="272" y2="392"/><line x1="344" y1="362" x2="344" y2="392"/><line x1="422" y1="230" x2="422" y2="392"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="74" y="404">2 ft+</text>
    <text x="146" y="404">4 ft max</text>
    <text x="233" y="404">3¼ ft+</text>
    <text x="383" y="404">3¼ ft+</text>
  </g>
  <g font-size="13" fill="#222">
    <text x="20" y="436">• Openings at least 2 ft from corners; wall between openings at least 3¼ ft.</text>
    <text x="20" y="455">• A window no wider than 4 ft, nor more than ⅓ of the wall's length.</text>
    <text x="20" y="474">• No gables: tie the wall tops together. Front view, not to scale.</text>
  </g>
</svg>
