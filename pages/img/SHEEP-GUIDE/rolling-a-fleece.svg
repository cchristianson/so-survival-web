<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500" font-family="Arial, Helvetica, sans-serif">
  <title>Skirting, folding, rolling and tying a shorn fleece in four steps</title>
  <rect width="660" height="500" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>

  <!-- panel frames -->
  <g fill="#fafafa" stroke="#999" stroke-width="1.5">
    <rect x="10" y="10" width="315" height="235" rx="8"/>
    <rect x="335" y="10" width="315" height="235" rx="8"/>
    <rect x="10" y="255" width="315" height="235" rx="8"/>
    <rect x="335" y="255" width="315" height="235" rx="8"/>
  </g>

  <!-- 1: spread and skirt -->
  <text x="24" y="36" font-size="16" font-weight="bold" fill="#222">1. Spread, cut side down</text>
  <path d="M60,62 C110,50 210,50 260,62 C282,90 290,140 280,190 C250,210 80,210 50,190 C40,140 42,90 60,62 Z"
        fill="#efe6cf" stroke="#8a7a52" stroke-width="2"/>
  <path d="M60,62 C110,50 210,50 260,62 C282,90 290,140 280,190 C250,210 80,210 50,190 C40,140 42,90 60,62 Z"
        fill="none" stroke="#b5651d" stroke-width="12" stroke-opacity="0.45"/>
  <text x="165" y="80" text-anchor="middle" font-size="13" fill="#555">neck</text>
  <text x="165" y="198" text-anchor="middle" font-size="13" fill="#555">tail</text>
  <text x="165" y="128" text-anchor="middle" font-size="13.5" fill="#333">Pull off the edges:</text>
  <text x="165" y="146" text-anchor="middle" font-size="13.5" fill="#333">tags, dung locks,</text>
  <text x="165" y="164" text-anchor="middle" font-size="13.5" fill="#333">belly and leg wool</text>
  <text x="24" y="232" font-size="12.5" fill="#555">Bag the edge wool separately.</text>

  <!-- 2: fold sides in -->
  <text x="349" y="36" font-size="16" font-weight="bold" fill="#222">2. Fold the sides in</text>
  <rect x="440" y="58" width="110" height="150" rx="10" fill="#efe6cf" stroke="#8a7a52" stroke-width="2"/>
  <path d="M440,58 L388,66 C378,110 378,160 388,200 L440,208 Z" fill="#f7f1e2" stroke="#8a7a52" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M550,58 L602,66 C612,110 612,160 602,200 L550,208 Z" fill="#f7f1e2" stroke="#8a7a52" stroke-width="2" stroke-dasharray="6 4"/>
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M396,134 L436,134"/>
    <path d="M594,134 L554,134"/>
  </g>
  <text x="495" y="128" text-anchor="middle" font-size="13" fill="#333">sides</text>
  <text x="495" y="145" text-anchor="middle" font-size="13" fill="#333">folded in</text>
  <text x="349" y="232" font-size="12.5" fill="#555">Fold the neck and tail ends in a little too.</text>

  <!-- 3: roll tail to neck -->
  <text x="24" y="281" font-size="16" font-weight="bold" fill="#222">3. Roll from tail to neck</text>
  <rect x="115" y="300" width="100" height="110" rx="8" fill="#efe6cf" stroke="#8a7a52" stroke-width="2"/>
  <ellipse cx="165" cy="420" rx="54" ry="22" fill="#e2d4b0" stroke="#8a7a52" stroke-width="2"/>
  <path d="M135,420 C140,408 190,408 195,420" fill="none" stroke="#8a7a52" stroke-width="1.5"/>
  <path d="M240,418 L240,316" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="165" y="296" text-anchor="middle" font-size="12.5" fill="#555">neck</text>
  <text x="250" y="380" font-size="13" fill="#333">roll</text>
  <text x="250" y="397" font-size="13" fill="#333">this</text>
  <text x="250" y="414" font-size="13" fill="#333">way</text>
  <text x="24" y="462" font-size="12.5" fill="#555">The best shoulder wool ends up on the</text>
  <text x="24" y="478" font-size="12.5" fill="#555">outside. Don't roll it tight: keep it springy.</text>

  <!-- 4: tie -->
  <text x="349" y="281" font-size="16" font-weight="bold" fill="#222">4. Tie with paper twine</text>
  <rect x="420" y="310" width="150" height="110" rx="26" fill="#efe6cf" stroke="#8a7a52" stroke-width="2"/>
  <g stroke="#7a5a2a" stroke-width="3" fill="none">
    <line x1="428" y1="318" x2="562" y2="412"/>
    <line x1="562" y1="318" x2="428" y2="412"/>
    <path d="M428,318 C470,306 520,306 562,318"/>
    <path d="M428,412 C470,424 520,424 562,412"/>
  </g>
  <text x="349" y="452" font-size="12.5" fill="#555">Corner to corner, crossed, then round the</text>
  <text x="349" y="468" font-size="12.5" fill="#555">other corners: about 8½ ft of twine. No sisal,</text>
  <text x="349" y="484" font-size="12.5" fill="#555">binder twine or wire: fibers spoil the wool.</text>
</svg>
