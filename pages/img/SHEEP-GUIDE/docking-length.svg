<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Arial, Helvetica, sans-serif">
  <title>Where to dock a lamb's tail: at the skin fold, never shorter</title>
  <rect width="640" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Docking: cut at the skin fold, never shorter</text>

  <!-- lamb's back half, side view, facing left -->
  <path d="M20,140 C80,118 190,110 270,116 C310,119 336,128 346,150
           C356,176 356,206 346,232 C340,250 334,262 330,280
           L326,372 L306,372 L304,290 C300,272 290,262 276,258
           L250,256 L240,300 L236,372 L216,372 L214,300 L200,262
           C150,262 80,262 20,256 Z"
        fill="#f3efe6" stroke="#6b6359" stroke-width="3"/>
  <text x="60" y="166" font-size="15" fill="#6b6359">lamb (rear half)</text>

  <!-- tail: kept stump + removed part -->
  <path d="M338,136 C352,138 364,146 370,160 L378,178 L362,186 L354,168 C348,158 342,152 334,150 Z" fill="#e8dcc4" stroke="#6b6359" stroke-width="2.5"/>
  <path d="M378,178 C392,214 404,262 410,320 L392,322 C386,268 374,222 362,186 Z" fill="#f7f4ee" stroke="#9a9184" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- skin fold from back of thigh to underside of tail -->
  <path d="M348,214 C356,200 362,190 366,182" fill="none" stroke="#7a3e9d" stroke-width="3.5"/>
  <text x="120" y="206" font-size="14" fill="#5a2a75" font-weight="bold">skin fold</text>
  <text x="120" y="223" font-size="13" fill="#5a2a75">(from the back of the thigh</text>
  <text x="120" y="239" font-size="13" fill="#5a2a75">to the underside of the tail)</text>
  <line x1="290" y1="214" x2="345" y2="210" stroke="#5a2a75" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- cut line -->
  <line x1="352" y1="192" x2="392" y2="172" stroke="#c0392b" stroke-width="4"/>
  <text x="410" y="120" font-size="15" font-weight="bold" fill="#c0392b">CUT or RING here:</text>
  <text x="410" y="140" font-size="14" fill="#333">where the skin fold meets</text>
  <text x="410" y="157" font-size="14" fill="#333">the tail, about 1 inch</text>
  <text x="410" y="174" font-size="14" fill="#333">(2–3 cm) from the body</text>
  <line x1="420" y1="180" x2="390" y2="178" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- removed part label -->
  <text x="430" y="262" font-size="14" fill="#555">this part comes off</text>
  <line x1="428" y1="258" x2="404" y2="262" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- warning -->
  <rect x="420" y="296" width="206" height="76" rx="6" fill="#fbe3df" stroke="#a83a2a" stroke-width="2"/>
  <text x="523" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e1d12">NEVER shorter than</text>
  <text x="523" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e1d12">the skin fold.</text>
  <text x="523" y="358" text-anchor="middle" font-size="13" fill="#333">A ring drops off in 10–14 days.</text>

  <text x="320" y="404" text-anchor="middle" font-size="13.5" fill="#333">Dock and castrate by 2 weeks old. Fat-tailed and short-tailed breeds are not docked.</text>
</svg>
