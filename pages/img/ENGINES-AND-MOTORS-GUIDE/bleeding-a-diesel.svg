<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Arial, Helvetica, sans-serif">
  <title>Bleeding air out of a diesel fuel system in order: tank valve, filter bleed screw, injection pump bleed screw, then the injection line nut at the injector</title>
  <rect width="640" height="470" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8a6d12"/></marker>
    <g id="n"><circle r="13" fill="#1f3b66"/></g>
  </defs>

  <!-- tank -->
  <rect x="20" y="60" width="110" height="80" rx="8" fill="#e9eef3" stroke="#333" stroke-width="2.5"/>
  <rect x="22" y="92" width="106" height="46" rx="6" fill="#f3d58a"/>
  <text x="75" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">TANK</text>
  <line x1="75" y1="140" x2="75" y2="185" stroke="#8a6d12" stroke-width="5"/>
  <path d="M65,170 L85,170 L75,160 Z M65,170 L85,170 L75,180 Z" fill="#555"/>
  <text x="92" y="176" font-size="13" fill="#222">valve</text>
  <use href="#n" x="40" y="172"/><text x="40" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>

  <!-- line to filter -->
  <path d="M75,185 L75,215 L170,215" fill="none" stroke="#8a6d12" stroke-width="5" marker-end="url(#f)"/>
  <!-- filter -->
  <rect x="175" y="180" width="70" height="90" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2.5"/>
  <text x="210" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">FUEL</text>
  <text x="210" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">FILTER</text>
  <rect x="203" y="166" width="14" height="14" fill="#c9a227" stroke="#333" stroke-width="1.5"/>
  <text x="160" y="164" text-anchor="middle" font-size="13" fill="#222">bleed screw</text>
  <use href="#n" x="245" y="160"/><text x="245" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>

  <!-- line to injection pump -->
  <path d="M245,225 L310,225" fill="none" stroke="#8a6d12" stroke-width="5" marker-end="url(#f)"/>
  <rect x="315" y="185" width="100" height="85" rx="6" fill="#d9dfe6" stroke="#333" stroke-width="2.5"/>
  <text x="365" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">INJECTION</text>
  <text x="365" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">PUMP</text>
  <rect x="358" y="171" width="14" height="14" fill="#c9a227" stroke="#333" stroke-width="1.5"/>
  <text x="313" y="168" text-anchor="middle" font-size="13" fill="#222">bleed screw</text>
  <use href="#n" x="400" y="160"/><text x="400" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>

  <!-- high-pressure line to injector -->
  <path d="M415,210 L470,210 L470,110 L540,110" fill="none" stroke="#a12a1c" stroke-width="4"/>
  <text x="372" y="104" font-size="13" fill="#a12a1c" font-weight="bold">injection line</text>
  <!-- engine head and injector -->
  <rect x="520" y="130" width="105" height="140" rx="4" fill="#cfcfcf" stroke="#333" stroke-width="2.5"/>
  <text x="572" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ENGINE</text>
  <rect x="560" y="88" width="24" height="74" rx="4" fill="#9aa5b1" stroke="#333" stroke-width="2"/>
  <rect x="538" y="102" width="14" height="16" fill="#c9a227" stroke="#333" stroke-width="1.5"/>
  <text x="572" y="80" text-anchor="middle" font-size="13" fill="#222">injector</text>
  <text x="530" y="60" text-anchor="middle" font-size="13" fill="#222">line nut</text>
  <use href="#n" x="505" y="78"/><text x="505" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>

  <!-- steps -->
  <g font-size="14" fill="#222">
    <use href="#n" x="32" y="315"/><text x="32" y="320" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
    <text x="55" y="320">Fill the tank with clean diesel and open the tank valve.</text>
    <use href="#n" x="32" y="349"/><text x="32" y="354" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
    <text x="55" y="354">Loosen the bleed screw on the filter, then on the pump, until fuel</text>
    <text x="55" y="372">runs in a steady stream with no bubbles. Tighten each one.</text>
    <use href="#n" x="32" y="401"/><text x="32" y="406" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
    <text x="55" y="406">Loosen the line nut at the injector; crank until fuel comes out</text>
    <text x="55" y="424">without foam. Tighten it and check every joint for leaks.</text>
  </g>
  <text x="20" y="456" font-size="13.5" font-weight="bold" fill="#a12a1c">Keep hands and face away from a spraying line: 4,000–10,000 psi.</text>
</svg>
