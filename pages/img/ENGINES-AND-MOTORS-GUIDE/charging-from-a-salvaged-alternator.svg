<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="Arial, Helvetica, sans-serif">
  <title>Charging a battery from a salvaged magnet alternator: three-phase rectifier, battery with a fuse at the positive post, and a diversion controller with a dump load</title>
  <rect width="640" height="480" fill="#ffffff"/>
  <defs>
    <g id="fuseV"><rect x="-8" y="-20" width="16" height="40" rx="3" fill="#fff6d6" stroke="#333" stroke-width="2"/><line x1="0" y1="-14" x2="0" y2="14" stroke="#333" stroke-width="2"/></g>
    <g id="diode"><path d="M-8,-7 L-8,7 L6,0 Z" fill="#333"/><line x1="7" y1="-7" x2="7" y2="7" stroke="#333" stroke-width="2.5"/></g>
  </defs>

  <!-- + bus and - bus -->
  <polyline points="230,190 500,190" fill="none" stroke="#c0392b" stroke-width="5"/>
  <polyline points="230,410 500,410" fill="none" stroke="#222" stroke-width="5"/>

  <!-- generator -->
  <circle cx="60" cy="300" r="42" fill="#e9eef3" stroke="#333" stroke-width="2.5"/>
  <text x="60" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">magnet</text>
  <text x="60" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">alternator</text>
  <text x="60" y="366" text-anchor="middle" font-size="13" fill="#222">turned by a</text>
  <text x="60" y="382" text-anchor="middle" font-size="13" fill="#222">water wheel</text>
  <text x="60" y="398" text-anchor="middle" font-size="13" fill="#222">or wind rotor</text>
  <g stroke="#7a5a3a" stroke-width="3"><line x1="102" y1="280" x2="140" y2="280"/><line x1="102" y1="300" x2="140" y2="300"/><line x1="102" y1="320" x2="140" y2="320"/></g>
  <text x="117" y="268" text-anchor="middle" font-size="13" fill="#222">3 wires</text>

  <!-- rectifier -->
  <rect x="140" y="230" width="90" height="140" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="2.5"/>
  <use href="#diode" x="170" y="262"/><use href="#diode" x="200" y="262"/>
  <use href="#diode" x="170" y="300"/><use href="#diode" x="200" y="300"/>
  <use href="#diode" x="170" y="338"/><use href="#diode" x="200" y="338"/>
  <text x="185" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">rectifier</text>
  <line x1="215" y1="230" x2="215" y2="190" stroke="#c0392b" stroke-width="5"/>
  <line x1="215" y1="370" x2="215" y2="380" stroke="#222" stroke-width="5"/>
  <polyline points="215,380 215,410 232,410" fill="none" stroke="#222" stroke-width="5"/>
  <polyline points="215,190 232,190" fill="none" stroke="#c0392b" stroke-width="5"/>
  <text x="140" y="215" font-size="13" fill="#222">six diodes</text>

  <!-- battery with the fuse right at its + post -->
  <rect x="285" y="285" width="120" height="80" rx="5" fill="#e6e1d6" stroke="#333" stroke-width="2.5"/>
  <rect x="300" y="272" width="20" height="13" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <rect x="370" y="272" width="20" height="13" fill="#444" stroke="#333" stroke-width="1.5"/>
  <text x="345" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">BATTERY</text>
  <text x="345" y="340" text-anchor="middle" font-size="13" fill="#333">12 V</text>
  <line x1="310" y1="190" x2="310" y2="272" stroke="#c0392b" stroke-width="5"/>
  <use href="#fuseV" x="310" y="245"/>
  <polyline points="380,285 380,272 380,260 430,260 430,410" fill="none" stroke="#222" stroke-width="5"/>
  <text x="320" y="225" font-size="13" font-weight="bold" fill="#222">fuse right at</text>
  <text x="320" y="241" font-size="13" font-weight="bold" fill="#222">the + post</text>

  <!-- diversion controller -->
  <rect x="455" y="235" width="120" height="110" rx="6" fill="#eef2e6" stroke="#333" stroke-width="2.5"/>
  <text x="515" y="262" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">DIVERSION</text>
  <text x="515" y="279" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">(dump-load)</text>
  <text x="515" y="296" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">controller</text>
  <text x="515" y="316" text-anchor="middle" font-size="13" fill="#a12a1c">not a solar</text>
  <text x="515" y="331" text-anchor="middle" font-size="13" fill="#a12a1c">controller</text>
  <line x1="480" y1="190" x2="480" y2="235" stroke="#c0392b" stroke-width="4"/>
  <line x1="480" y1="345" x2="480" y2="410" stroke="#222" stroke-width="4"/>
  <!-- dump wires to the load -->
  <polyline points="575,270 610,270 610,140" fill="none" stroke="#7a5a3a" stroke-width="4"/>
  <polyline points="575,310 625,310 625,140" fill="none" stroke="#7a5a3a" stroke-width="4"/>
  <rect x="440" y="40" width="190" height="100" rx="6" fill="#fdeee6" stroke="#a3461f" stroke-width="2"/>
  <path d="M470,100 l12,-20 l12,20 l12,-20 l12,20 l12,-20 l12,20" fill="none" stroke="#a3461f" stroke-width="3"/>
  <text x="535" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#a3461f">DUMP LOAD</text>
  <text x="535" y="122" text-anchor="middle" font-size="13" fill="#222">water-heater element</text>

  <!-- notes -->
  <g font-size="13.5" fill="#222">
    <text x="20" y="28" font-weight="bold">The controller sends spare power to the dump load</text>
    <text x="20" y="46">when the battery is full: over about 14 V on a</text>
    <text x="20" y="64">12 V battery, it's charging too hard.</text>
    <text x="20" y="98" font-weight="bold" fill="#a12a1c">Never let the generator run with no load:</text>
    <text x="20" y="116" fill="#a12a1c">it overspeeds and its voltage can climb</text>
    <text x="20" y="134" fill="#a12a1c">dangerously high.</text>
  </g>
  <g font-size="13" fill="#222">
    <line x1="20" y1="455" x2="50" y2="455" stroke="#c0392b" stroke-width="4"/><text x="56" y="460">+ positive</text>
    <line x1="150" y1="455" x2="180" y2="455" stroke="#222" stroke-width="4"/><text x="186" y="460">− negative</text>
    <text x="280" y="460" fill="#555">Connect the battery last. Not to scale.</text>
  </g>
</svg>
