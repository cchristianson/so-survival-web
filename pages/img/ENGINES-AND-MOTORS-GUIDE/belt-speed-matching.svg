<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Arial, Helvetica, sans-serif">
  <title>Matching a slow turbine to a fast generator head with a big pulley driving a small one: about 3.4 to 1 for an 8-inch Pelton wheel on 100 feet of drop</title>
  <rect width="640" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#1f3b66"/></marker>
  </defs>

  <!-- big pulley on the turbine shaft -->
  <circle cx="170" cy="170" r="102" fill="#e9eef3" stroke="#333" stroke-width="3"/>
  <circle cx="170" cy="170" r="10" fill="#333"/>
  <!-- small pulley on the generator -->
  <circle cx="480" cy="170" r="30" fill="#e9eef3" stroke="#333" stroke-width="3"/>
  <circle cx="480" cy="170" r="6" fill="#333"/>
  <!-- belt: tangent lines -->
  <line x1="185" y1="69" x2="484" y2="140" stroke="#222" stroke-width="7"/>
  <line x1="185" y1="271" x2="484" y2="200" stroke="#222" stroke-width="7"/>
  <path d="M185,69 A102,102 0 1 0 185,271" fill="none" stroke="#222" stroke-width="7"/>
  <path d="M484,140 A30,30 0 0 1 484,200" fill="none" stroke="#222" stroke-width="7"/>

  <!-- rotation arrows -->
  <!-- labels -->
  <text x="170" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">turbine</text>
  <text x="170" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f3b66">1,060 rpm</text>
  <text x="170" y="218" text-anchor="middle" font-size="13" fill="#222">BIG pulley</text>
  <text x="520" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">generator head</text>
  <text x="480" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f3b66">3,600 rpm</text>
  <text x="480" y="250" text-anchor="middle" font-size="13" fill="#222">small pulley</text>
  <text x="330" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">V-belt</text>

  <!-- the rule -->
  <rect x="20" y="295" width="600" height="115" rx="6" fill="#eef4fa" stroke="#1f3b66" stroke-width="1.5"/>
  <g font-size="14" fill="#222">
    <text x="34" y="318"><tspan font-weight="bold">Diameter × rpm is the same on both shafts.</tspan> Ratio = 3,600 ÷ 1,060 ≈ 3.4,</text>
    <text x="34" y="337">so the turbine's pulley is about 3.4 times the generator's (an 8-in Pelton, 100 ft of drop).</text>
    <text x="34" y="361">V-belts slip instead of breaking things if the turbine jams. Smallest pulley:</text>
    <text x="34" y="380">about 3 in for an A belt, 5.4 in for a B. Size belts for 1.4–1.5 times the power,</text>
    <text x="34" y="399">and make the distance between shafts adjustable: belts stretch.</text>
  </g>
</svg>
