<svg xmlns="http://www.w3.org/2000/svg" width="680" height="516" viewBox="0 0 680 516" font-family="Arial, Helvetica, sans-serif">
  <title>A neighbourhood grid cut free of the dead utility line: the utility's poles drawn grey with every building's main switch to them open and locked, and a power house feeding five numbered buildings over its own cable</title>
  <rect width="680" height="516" fill="#ffffff"/>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">One source, a few buildings close together, on your own cable.</text>

  <!-- THE UTILITY'S LINE, DEAD -->
  <g stroke="#b8b8b4" stroke-width="5"><path d="M165,214 V48 M295,214 V48 M425,214 V48 M555,214 V48"/></g>
  <g stroke="#b8b8b4" stroke-width="4"><path d="M151,56 H179 M281,56 H309 M411,56 H439 M541,56 H569"/></g>
  <g stroke="#b8b8b4" stroke-width="1.8" fill="none">
    <path d="M155,54 C200,70 250,70 291,54 M285,54 C330,70 380,70 421,54 M415,54 C460,70 510,70 551,54 M545,54 C600,62 640,66 664,70"/>
  </g>
  <text x="16" y="42" font-size="13.5" font-weight="bold" fill="#8a8a85">THE UTILITY'S LINE — dead, and not used</text>
  <text x="664" y="42" text-anchor="end" font-size="13.5" font-weight="bold" fill="#c8431a">each main switch to it: OFF, locked and labelled</text>

  <!-- dead drops to each building -->
  <g stroke="#b8b8b4" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <path d="M160,60 C130,90 90,120 70,156"/>
    <path d="M172,60 C186,92 198,124 204,156"/>
    <path d="M290,60 C278,92 334,124 330,156"/>
    <path d="M430,60 C444,92 456,124 462,156"/>
    <path d="M560,60 C574,92 586,124 592,156"/>
  </g>

  <!-- buildings -->
  <g stroke="#333" stroke-width="2">
    <polygon points="64,152 100,126 136,152" fill="#c8a07a"/><rect x="70" y="152" width="60" height="62" fill="#f0e6d8"/>
    <polygon points="194,152 230,126 266,152" fill="#c8a07a"/><rect x="200" y="152" width="60" height="62" fill="#f0e6d8"/>
    <polygon points="324,152 360,126 396,152" fill="#c8a07a"/><rect x="330" y="152" width="60" height="62" fill="#f0e6d8"/>
    <polygon points="454,152 490,126 526,152" fill="#c8a07a"/><rect x="460" y="152" width="60" height="62" fill="#f0e6d8"/>
    <polygon points="584,152 620,126 656,152" fill="#c8a07a"/><rect x="590" y="152" width="60" height="62" fill="#f0e6d8"/>
  </g>
  <line x1="16" y1="214" x2="664" y2="214" stroke="#6b5a45" stroke-width="2.5"/>

  <!-- open, locked main switches -->
  <g stroke="#c8431a" stroke-width="2.2" fill="none">
    <g transform="translate(70,156)"><circle cx="0" cy="0" r="2.6" fill="#c8431a"/><circle cx="0" cy="16" r="2.6" fill="#c8431a"/><path d="M0,16 L11,4"/><rect x="-13" y="3" width="10" height="8" fill="#fff"/><path d="M-10.6,3 V0.5 a2.6,2.6 0 0 1 5.2,0 V3"/></g>
    <g transform="translate(204,156)"><circle cx="0" cy="0" r="2.6" fill="#c8431a"/><circle cx="0" cy="16" r="2.6" fill="#c8431a"/><path d="M0,16 L11,4"/><rect x="-13" y="3" width="10" height="8" fill="#fff"/><path d="M-10.6,3 V0.5 a2.6,2.6 0 0 1 5.2,0 V3"/></g>
    <g transform="translate(330,156)"><circle cx="0" cy="0" r="2.6" fill="#c8431a"/><circle cx="0" cy="16" r="2.6" fill="#c8431a"/><path d="M0,16 L11,4"/><rect x="-13" y="3" width="10" height="8" fill="#fff"/><path d="M-10.6,3 V0.5 a2.6,2.6 0 0 1 5.2,0 V3"/></g>
    <g transform="translate(462,156)"><circle cx="0" cy="0" r="2.6" fill="#c8431a"/><circle cx="0" cy="16" r="2.6" fill="#c8431a"/><path d="M0,16 L11,4"/><rect x="-13" y="3" width="10" height="8" fill="#fff"/><path d="M-10.6,3 V0.5 a2.6,2.6 0 0 1 5.2,0 V3"/></g>
    <g transform="translate(592,156)"><circle cx="0" cy="0" r="2.6" fill="#c8431a"/><circle cx="0" cy="16" r="2.6" fill="#c8431a"/><path d="M0,16 L11,4"/><rect x="-13" y="3" width="10" height="8" fill="#fff"/><path d="M-10.6,3 V0.5 a2.6,2.6 0 0 1 5.2,0 V3"/></g>
  </g>

  <!-- numbers and loads -->
  <g text-anchor="middle">
    <g fill="#2f5e16" font-weight="bold" font-size="17">
      <text x="106" y="196">1</text><text x="236" y="196">2</text><text x="366" y="196">3</text>
      <text x="496" y="196">4</text><text x="626" y="196">5</text>
    </g>
    <g fill="#222" font-weight="bold" font-size="13">
      <text x="100" y="236">Water pump</text><text x="230" y="236">Clinic</text><text x="360" y="236">Cold store</text>
      <text x="490" y="236">Radio</text><text x="620" y="236">Houses</text>
    </g>
  </g>

  <!-- POWER HOUSE -->
  <rect x="16" y="296" width="110" height="64" rx="4" fill="#dfe4e8" stroke="#333" stroke-width="2"/>
  <circle cx="46" cy="328" r="17" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M46,312 V344 M32,320 L60,336 M32,336 L60,320" stroke="#333" stroke-width="2"/>
  <text x="96" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#222">power</text>
  <text x="96" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#222">house</text>

  <!-- your own cable -->
  <path d="M126,328 H658" stroke="#2f5e16" stroke-width="4"/>
  <g stroke="#2f5e16" stroke-width="3" fill="none">
    <path d="M100,328 V216"/><path d="M230,328 V216"/><path d="M360,328 V216"/>
    <path d="M490,328 V216"/><path d="M620,328 V216"/>
  </g>
  <text x="340" y="352" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5e16">your own 120/240 V cable, not the utility's poles</text>
  <line x1="126" y1="378" x2="500" y2="378" stroke="#333" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g stroke="#333" stroke-width="1.4"><path d="M126,372 V384 M500,372 V384"/></g>
  <text x="313" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">keep it short: small plants feed loads under about 500 ft</text>

  <line x1="16" y1="414" x2="664" y2="414" stroke="#ccc" stroke-width="1"/>
  <g font-size="13.5" fill="#222">
    <text x="16" y="438" font-weight="bold">The simple way: do not use the utility's wires at all.</text>
    <text x="16" y="458">Every building takes your power through its own transfer switch. Mark every open point</text>
    <text x="16" y="476">on a map the operator keeps: anyone who closes one without their word can kill.</text>
  </g>
  <text x="16" y="498" font-size="13" font-weight="bold" fill="#c8431a">If a stretch of utility line must be used, only a trained lineworker opens it, proves it dead,</text>
  <text x="16" y="514" font-size="13" font-weight="bold" fill="#c8431a">grounds it, and locks and tags it.</text>
</svg>
