<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Arial, Helvetica, sans-serif">
  <title>Morse timing: the words AT ME drawn as on and off time, counted in dot lengths</title>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#222">Count everything in dot lengths</text>
  <text x="20" y="54" font-size="15" fill="#222">dot = 1 · dash = 3 · gap inside a letter = 1</text>
  <text x="20" y="76" font-size="15" fill="#222">gap between letters = 3 · gap between words = 7</text>
  <text x="140.0" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d5f8a">word: AT</text>
  <text x="500.0" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d5f8a">word: ME</text>
  <text x="80.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">A  .-</text>
  <text x="220.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">T  -</text>
  <text x="460.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">M  --</text>
  <text x="600.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">E  .</text>
  <line x1="30" y1="186" x2="610" y2="186" stroke="#999" stroke-width="1"/>
  <line x1="30" y1="182" x2="30" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="50" y1="182" x2="50" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="70" y1="182" x2="70" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="90" y1="182" x2="90" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="110" y1="182" x2="110" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="130" y1="182" x2="130" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="150" y1="182" x2="150" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="170" y1="182" x2="170" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="190" y1="182" x2="190" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="210" y1="182" x2="210" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="230" y1="182" x2="230" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="250" y1="182" x2="250" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="270" y1="182" x2="270" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="290" y1="182" x2="290" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="310" y1="182" x2="310" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="330" y1="182" x2="330" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="350" y1="182" x2="350" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="370" y1="182" x2="370" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="390" y1="182" x2="390" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="410" y1="182" x2="410" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="430" y1="182" x2="430" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="450" y1="182" x2="450" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="470" y1="182" x2="470" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="490" y1="182" x2="490" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="510" y1="182" x2="510" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="530" y1="182" x2="530" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="550" y1="182" x2="550" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="570" y1="182" x2="570" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="590" y1="182" x2="590" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="610" y1="182" x2="610" y2="190" stroke="#999" stroke-width="1"/>
  <rect x="30" y="150" width="20" height="30" fill="#222"/>
  <rect x="70" y="150" width="60" height="30" fill="#222"/>
  <rect x="190" y="150" width="60" height="30" fill="#222"/>
  <rect x="390" y="150" width="60" height="30" fill="#222"/>
  <rect x="470" y="150" width="60" height="30" fill="#222"/>
  <rect x="590" y="150" width="20" height="30" fill="#222"/>
  <path d="M50,204 L50,212 L70,212 L70,204" fill="none" stroke="#777" stroke-width="2"/>
  <text x="60.0" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#777">1</text>
  <path d="M130,204 L130,212 L190,212 L190,204" fill="none" stroke="#5b7f3a" stroke-width="2"/>
  <text x="160.0" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b7f3a">3</text>
  <path d="M250,204 L250,212 L390,212 L390,204" fill="none" stroke="#b03a2e" stroke-width="2"/>
  <text x="320.0" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a2e">7</text>
  <path d="M450,204 L450,212 L470,212 L470,204" fill="none" stroke="#777" stroke-width="2"/>
  <text x="460.0" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#777">1</text>
  <path d="M530,204 L530,212 L590,212 L590,204" fill="none" stroke="#5b7f3a" stroke-width="2"/>
  <text x="560.0" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b7f3a">3</text>
  <g font-size="14" fill="#333">
    <text x="20" y="268"><tspan fill="#777" font-weight="bold">1</tspan> = gap inside a letter</text>
    <text x="220" y="268"><tspan fill="#5b7f3a" font-weight="bold">3</tspan> = gap between letters</text>
    <text x="430" y="268"><tspan fill="#b03a2e" font-weight="bold">7</tspan> = between words</text>
  </g>
  <text x="20" y="306" font-size="14.5" fill="#222">Send each letter at full speed; to go slower, make the gaps longer.</text>
  <text x="20" y="330" font-size="14.5" fill="#222">With a lamp or horn, make dots a little shorter so they can't pass for dashes.</text>
  <text x="20" y="352" font-size="12.5" fill="#555">Black = light on or sound on. Each tick = one dot length.</text>
</svg>
