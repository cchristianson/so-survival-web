<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" font-family="Arial, Helvetica, sans-serif">
  <title>A handheld radio with its six controls labelled: antenna, on/off and volume, squelch, channel or frequency display, transmit button, and power level</title>
  <rect width="600" height="500" fill="#ffffff"/>
  <defs>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,2 L9,5 L0,8 z" fill="#333"/></marker>
  </defs>

  <!-- radio body -->
  <rect x="230" y="92" width="150" height="330" rx="14" fill="#e9edef" stroke="#3b4347" stroke-width="2.5"/>
  <!-- battery pack behind the lower body -->
  <path d="M230,300 H380 V408 a14,14 0 0 1 -14,14 H244 a14,14 0 0 1 -14,-14 z" fill="#d3d9dc" stroke="#3b4347" stroke-width="2"/>
  <line x1="230" y1="300" x2="380" y2="300" stroke="#3b4347" stroke-width="2"/>

  <!-- antenna -->
  <path d="M252,92 V40 a6,6 0 0 1 12,0 V92 z" fill="#4a5257" stroke="#2c3337" stroke-width="2"/>
  <rect x="248" y="88" width="20" height="10" rx="3" fill="#8e979c" stroke="#2c3337" stroke-width="1.8"/>

  <!-- volume / on-off knob -->
  <ellipse cx="352" cy="86" rx="19" ry="8" fill="#8e979c" stroke="#2c3337" stroke-width="2"/>
  <path d="M333,86 V72 a19,8 0 0 1 38,0 V86" fill="#b6bfc4" stroke="#2c3337" stroke-width="2"/>
  <line x1="352" y1="72" x2="352" y2="64" stroke="#2c3337" stroke-width="2.5"/>

  <!-- display -->
  <rect x="244" y="110" width="122" height="74" rx="4" fill="#f4f8fa" stroke="#3b4347" stroke-width="2"/>
  <text x="252" y="124" font-size="11" fill="#555">N</text>
  <rect x="268" y="116" width="20" height="9" rx="2" fill="none" stroke="#555" stroke-width="1.2"/>
  <rect x="269" y="117" width="12" height="7" fill="#555"/>
  <text x="348" y="124" font-size="12" font-weight="bold" fill="#333">L</text>
  <text x="258" y="150" font-size="21" font-weight="bold" fill="#1d2326">146.520</text>
  <path d="M248,142 l8,4 -8,4 z" fill="#1d2326"/>
  <text x="258" y="174" font-size="15" fill="#1d2326">7  RIDGE</text>

  <!-- keypad -->
  <g fill="#cfd6da" stroke="#5a646a" stroke-width="1.4">
    <rect x="248" y="196" width="34" height="20" rx="4"/><rect x="288" y="196" width="34" height="20" rx="4"/><rect x="328" y="196" width="34" height="20" rx="4"/>
    <rect x="248" y="222" width="34" height="20" rx="4"/><rect x="288" y="222" width="34" height="20" rx="4"/><rect x="328" y="222" width="34" height="20" rx="4"/>
    <rect x="248" y="248" width="34" height="20" rx="4"/><rect x="288" y="248" width="34" height="20" rx="4"/><rect x="328" y="248" width="34" height="20" rx="4"/>
    <rect x="248" y="274" width="34" height="20" rx="4"/><rect x="288" y="274" width="34" height="20" rx="4"/><rect x="328" y="274" width="34" height="20" rx="4"/>
  </g>
  <text x="265" y="210" font-size="10" text-anchor="middle" fill="#2c3337">MENU</text>
  <text x="305" y="210" font-size="10" text-anchor="middle" fill="#2c3337">▲</text>
  <text x="345" y="210" font-size="10" text-anchor="middle" fill="#2c3337">▼</text>

  <!-- speaker holes -->
  <g fill="#8e979c">
    <circle cx="276" cy="330" r="3"/><circle cx="292" cy="330" r="3"/><circle cx="308" cy="330" r="3"/><circle cx="324" cy="330" r="3"/><circle cx="340" cy="330" r="3"/>
    <circle cx="276" cy="346" r="3"/><circle cx="292" cy="346" r="3"/><circle cx="308" cy="346" r="3"/><circle cx="324" cy="346" r="3"/><circle cx="340" cy="346" r="3"/>
    <circle cx="276" cy="362" r="3"/><circle cx="292" cy="362" r="3"/><circle cx="308" cy="362" r="3"/><circle cx="324" cy="362" r="3"/><circle cx="340" cy="362" r="3"/>
  </g>

  <!-- PTT bar on the left side -->
  <rect x="218" y="170" width="14" height="66" rx="5" fill="#8e979c" stroke="#2c3337" stroke-width="2"/>
  <rect x="220" y="246" width="11" height="22" rx="4" fill="#b6bfc4" stroke="#2c3337" stroke-width="1.6"/>

  <!-- ===== labels ===== -->
  <g font-size="14" fill="#1d2326">
    <!-- 1 antenna -->
    <circle cx="36" cy="46" r="13" fill="#2c3337"/><text x="36" y="51" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <text x="56" y="43" font-weight="bold">ANTENNA</text>
    <text x="56" y="61" font-size="13">the radio's voice and ears</text>
    <text x="56" y="79" font-size="13" font-weight="bold" fill="#c8431a">never transmit without it</text>
    <line x1="152" y1="34" x2="246" y2="52" stroke="#333" stroke-width="1.2" marker-end="url(#l)"/>

    <!-- 2 volume -->
    <circle cx="434" cy="46" r="13" fill="#2c3337"/><text x="434" y="51" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <text x="454" y="43" font-weight="bold">ON / OFF</text>
    <text x="454" y="61" font-size="13">and VOLUME</text>
    <line x1="430" y1="60" x2="372" y2="74" stroke="#333" stroke-width="1.2" marker-end="url(#l)"/>

    <!-- 3 channel -->
    <circle cx="36" cy="136" r="13" fill="#2c3337"/><text x="36" y="141" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <text x="56" y="133" font-weight="bold">CHANNEL or</text>
    <text x="56" y="151" font-weight="bold">FREQUENCY</text>
    <text x="56" y="169" font-size="13">the arrow shows which</text>
    <text x="56" y="185" font-size="13">line you are using</text>
    <line x1="176" y1="145" x2="242" y2="145" stroke="#333" stroke-width="1.2" marker-end="url(#l)"/>

    <!-- 4 squelch -->
    <circle cx="434" cy="150" r="13" fill="#2c3337"/><text x="434" y="155" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
    <text x="454" y="147" font-weight="bold">SQUELCH</text>
    <text x="454" y="165" font-size="13">a knob on a CB;</text>
    <text x="454" y="181" font-size="13">a number in the</text>
    <text x="454" y="197" font-size="13">menu on this kind</text>
    <line x1="450" y1="190" x2="366" y2="203" stroke="#333" stroke-width="1.2" marker-end="url(#l)"/>

    <!-- 5 PTT -->
    <circle cx="36" cy="238" r="13" fill="#2c3337"/><text x="36" y="243" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
    <text x="56" y="235" font-weight="bold">TRANSMIT (PTT)</text>
    <text x="56" y="253" font-size="13">hold it to talk, let go</text>
    <text x="56" y="269" font-size="13">to listen. You hear</text>
    <text x="56" y="285" font-size="13">nothing while held</text>
    <line x1="180" y1="240" x2="214" y2="210" stroke="#333" stroke-width="1.2" marker-end="url(#l)"/>
    <text x="56" y="311" font-size="12" fill="#555">(the small button under it</text>
    <text x="56" y="326" font-size="12" fill="#555">is usually MONITOR: it</text>
    <text x="56" y="341" font-size="12" fill="#555">opens the squelch)</text>

    <!-- 6 power -->
    <circle cx="434" cy="252" r="13" fill="#2c3337"/><text x="434" y="257" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
    <text x="454" y="249" font-weight="bold">POWER</text>
    <text x="454" y="267" font-size="13">high or low — shown</text>
    <text x="454" y="283" font-size="13">as a flag (H or L) on</text>
    <text x="454" y="299" font-size="13">the screen</text>
    <polyline points="450,286 396,286 396,122 362,122" fill="none" stroke="#333" stroke-width="1.1" stroke-dasharray="4 4" marker-end="url(#l)"/>

    <!-- battery -->
    <text x="420" y="372" font-size="13" font-weight="bold">BATTERY</text>
    <text x="420" y="389" font-size="12">carry a spare,</text>
    <text x="420" y="404" font-size="12">charged</text>
    <line x1="416" y1="368" x2="384" y2="356" stroke="#333" stroke-width="1.2" marker-end="url(#l)"/>
  </g>

  <text x="300" y="460" text-anchor="middle" font-size="14" fill="#1d2326">Every radio has these six. Only their shape and their place change.</text>
  <text x="300" y="482" text-anchor="middle" font-size="13" fill="#c8431a" font-weight="bold">Antenna on, then battery, then switch on.</text>
</svg>
