<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="Arial, Helvetica, sans-serif">
  <title>Felling cuts seen from the side: the notch, the back cut, the hinge and the wedge</title>
  <rect width="660" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2f5e16"/></marker>
  </defs>
  <!-- fall direction -->
  <path d="M330,64 C290,40 230,40 180,62" fill="none" stroke="#2f5e16" stroke-width="4" marker-end="url(#b)"/>
  <text x="250" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5e16">the tree falls this way</text>

  <!-- trunk: x 210-450 (240 px = 20 in, 12 px per inch) -->
  <rect x="210" y="70" width="240" height="340" fill="#d8b98c" stroke="#7a5a35" stroke-width="2"/>
  <g stroke="#b8956a" stroke-width="1.2" fill="none"><path d="M240,70 V410 M330,70 V170 M330,330 V410 M420,70 V410"/></g>
  <!-- ground -->
  <line x1="20" y1="410" x2="640" y2="410" stroke="#6b5a45" stroke-width="2.5"/>
  <!-- open-face notch: top cut and bottom cut meet at apex (290,250); 80 px = 1/3 of 240 -->
  <polygon points="208,168 290,250 208,332" fill="#ffffff" stroke="#7a5a35" stroke-width="2"/>
  <circle cx="290" cy="250" r="4" fill="#c8431a"/>
  <!-- back cut: level, 12 px (1 in) above the notch floor, stopping 15 px (1¼ in) short -->
  <line x1="305" y1="238" x2="452" y2="238" stroke="#3b2a14" stroke-width="3.5"/>
  <!-- hinge -->
  <rect x="290" y="232" width="15" height="24" fill="#2f5e16" opacity="0.85"/>
  <!-- wedge in the back cut -->
  <polygon points="486,226 486,250 424,238" fill="#e6b13a" stroke="#7a5a10" stroke-width="1.5"/>

  <!-- notch depth dimension -->
  <line x1="210" y1="352" x2="290" y2="352" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="290" y1="256" x2="290" y2="360" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="250" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">⅓ through</text>
  <!-- 1 in step -->
  <line x1="470" y1="238" x2="510" y2="238" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="300" y1="250" x2="510" y2="250" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="504" y1="216" x2="504" y2="237" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="504" y1="272" x2="504" y2="251" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- left labels -->
  <g font-size="13" fill="#222">
    <text x="16" y="150" font-weight="bold" font-size="14">1. NOTCH</text>
    <text x="16" y="168">on the side it will fall,</text>
    <text x="16" y="184">about ⅓ of the way</text>
    <text x="16" y="200">through. Open face</text>
    <text x="16" y="216">(about 90°) is the</text>
    <text x="16" y="232">most controlled.</text>
    <text x="16" y="262" font-weight="bold" fill="#c8431a">The two cuts must</text>
    <text x="16" y="278" font-weight="bold" fill="#c8431a">meet exactly.</text>
  </g>
  <!-- right labels -->
  <g font-size="13" fill="#222">
    <text x="516" y="150" font-weight="bold" font-size="14">2. BACK CUT</text>
    <text x="516" y="168">from the other side,</text>
    <text x="516" y="184">level, about 1 in</text>
    <text x="516" y="200">higher than the</text>
    <text x="516" y="216">notch floor</text>
    <text x="516" y="248" font-weight="bold">1 in</text>
    <text x="516" y="290" font-weight="bold" font-size="14">3. WEDGE</text>
    <text x="516" y="308">the back cut early</text>
  </g>
  <line x1="514" y1="296" x2="482" y2="248" stroke="#333" stroke-width="1"/>
  <!-- hinge label -->
  <text x="330" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5e16">HINGE: leave 1–1½ in uncut. It steers the tree.</text>
  <line x1="300" y1="426" x2="298" y2="258" stroke="#2f5e16" stroke-width="1.4"/>
  <text x="330" y="462" text-anchor="middle" font-size="13" fill="#222">When it starts to go, set the saw down and walk out your escape path.</text>
</svg>
