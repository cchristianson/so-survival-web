<svg xmlns="http://www.w3.org/2000/svg" width="660" height="460" viewBox="0 0 660 460" font-family="Arial, Helvetica, sans-serif">
  <title>Clearances around a wood stove with no label, seen from above</title>
  <rect width="660" height="460" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e9dfcc"/><line x1="0" y1="0" x2="0" y2="8" stroke="#a88f68" stroke-width="2"/></pattern>
  </defs>
  <!-- walls (4 px per inch) -->
  <rect x="20" y="20" width="620" height="22" fill="url(#wall)" stroke="#7a6a50" stroke-width="1.5"/>
  <rect x="20" y="20" width="22" height="420" fill="url(#wall)" stroke="#7a6a50" stroke-width="1.5"/>
  <text x="56" y="64" font-size="13" font-weight="bold" fill="#222">walls that can burn</text>

  <!-- floor pad: stove plus 18 in (72 px) in front -->
  <rect x="198" y="198" width="132" height="186" fill="#d6d3cc" stroke="#6b6359" stroke-width="1.5"/>
  <!-- stove: 42 in from each wall -->
  <rect x="210" y="210" width="108" height="100" rx="6" fill="#3d3d3d"/>
  <text x="264" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">STOVE</text>
  <!-- pipe and its 18-in circle -->
  <circle cx="264" cy="236" r="72" fill="none" stroke="#c8431a" stroke-width="2" stroke-dasharray="7 4"/>
  <circle cx="264" cy="236" r="12" fill="#888" stroke="#222" stroke-width="2"/>
  <!-- dimensions to walls -->
  <line x1="264" y1="44" x2="264" y2="208" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="274" y="92" font-size="14" font-weight="bold" fill="#222">36–48 in</text>
  <line x1="44" y1="350" x2="208" y2="350" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="210" y1="312" x2="210" y2="360" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="126" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">36–48 in</text>
  <!-- pad in front -->
  <line x1="342" y1="312" x2="342" y2="382" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="352" y="344" font-size="13.5" font-weight="bold" fill="#222">18 in</text>
  <text x="200" y="406" font-size="13" fill="#222">floor pad that can't burn, reaching 18 in in front</text>
  <!-- pipe label -->
  <text x="352" y="128" font-size="13" fill="#c8431a" font-weight="bold">single-wall stovepipe:</text>
  <text x="352" y="144" font-size="13" fill="#c8431a">18 in from anything that burns</text>
  <line x1="350" y1="140" x2="318" y2="180" stroke="#c8431a" stroke-width="1"/>
  <!-- wood box 3 ft away -->
  <rect x="462" y="270" width="80" height="60" fill="#b98d55" stroke="#6b4a24" stroke-width="1.5"/>
  <text x="502" y="305" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">woodbox</text>
  <line x1="320" y1="300" x2="460" y2="300" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="390" y="294" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">3 ft</text>
  <text x="462" y="352" font-size="13" fill="#222">wood, furniture and</text>
  <text x="462" y="368" font-size="13" fill="#222">drying clothes at</text>
  <text x="462" y="384" font-size="13" fill="#222">least 3 ft away</text>
  <text x="640" y="452" text-anchor="end" font-size="13" fill="#555">For a stove with no label. If it has a label, follow the label.</text>
</svg>
