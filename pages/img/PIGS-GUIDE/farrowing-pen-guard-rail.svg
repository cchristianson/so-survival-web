<svg xmlns="http://www.w3.org/2000/svg" width="660" height="560" viewBox="0 0 660 560" font-family="Arial, Helvetica, sans-serif">
  <title>A farrowing pen seen from above, and a cut-through view of its guard rail</title>
  <rect width="660" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>

  <!-- ===== LEFT: top view ===== -->
  <text x="190" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">From above</text>

  <!-- outside feeding pen for the sow -->
  <rect x="40" y="48" width="300" height="78" fill="#f1ede4" stroke="#6b6359" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="190" y="78" text-anchor="middle" font-size="14" fill="#222">Sow's feeding pen outside</text>
  <text x="190" y="97" text-anchor="middle" font-size="13" fill="#444">6–8 ft long: feed and water her here,</text>
  <text x="190" y="114" text-anchor="middle" font-size="13" fill="#444">away from the piglets</text>

  <!-- pen walls, 7 ft = 280 px -->
  <rect x="50" y="140" width="280" height="280" fill="#fbf6df" stroke="#333" stroke-width="5"/>
  <!-- door gap to outside pen -->
  <rect x="160" y="136" width="60" height="9" fill="#fbf6df"/>
  <text x="190" y="160" text-anchor="middle" font-size="12" fill="#444">door</text>

  <!-- guard rail inset about 5 in (17 px) -->
  <g stroke="#9a6a32" stroke-width="6" fill="none" stroke-linecap="square">
    <line x1="67" y1="157" x2="150" y2="157"/>
    <line x1="230" y1="157" x2="313" y2="157"/>
    <line x1="67" y1="157" x2="67" y2="403"/>
    <line x1="313" y1="157" x2="313" y2="403"/>
    <line x1="67" y1="403" x2="313" y2="403"/>
  </g>

  <!-- creep / warm corner (piglets only) -->
  <rect x="236" y="330" width="77" height="73" fill="#e6efe0" stroke="#5b7f3a" stroke-width="2"/>
  <line x1="236" y1="352" x2="236" y2="372" stroke="#e6efe0" stroke-width="4"/>
  <text x="274" y="350" text-anchor="middle" font-size="12" fill="#2f4f1a">warm</text>
  <text x="274" y="365" text-anchor="middle" font-size="12" fill="#2f4f1a">corner,</text>
  <text x="274" y="380" text-anchor="middle" font-size="12" fill="#2f4f1a">piglets</text>
  <text x="274" y="395" text-anchor="middle" font-size="12" fill="#2f4f1a">only</text>

  <!-- sow lying down -->
  <ellipse cx="160" cy="275" rx="70" ry="34" fill="#e7b8a6" stroke="#8a5a48" stroke-width="2"/>
  <ellipse cx="236" cy="270" rx="18" ry="15" fill="#e7b8a6" stroke="#8a5a48" stroke-width="2"/>
  <text x="160" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a2f22">SOW</text>
  <!-- piglets along the wall under the rail -->
  <g fill="#f3cdbf" stroke="#8a5a48" stroke-width="1.5">
    <ellipse cx="85" cy="200" rx="7" ry="12"/>
    <ellipse cx="85" cy="232" rx="7" ry="12"/>
    <ellipse cx="85" cy="330" rx="7" ry="12"/>
    <ellipse cx="120" cy="394" rx="12" ry="6"/>
    <ellipse cx="160" cy="394" rx="12" ry="6"/>
  </g>

  <!-- 7 ft dimensions -->
  <line x1="50" y1="440" x2="330" y2="440" stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="190" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">about 7 ft</text>
  <line x1="352" y1="140" x2="352" y2="420" stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="362" y="285" font-size="15" font-weight="bold" fill="#222" transform="rotate(90 362 285)" text-anchor="middle">about 7 ft</text>

  <!-- legend under top view -->
  <line x1="44" y1="486" x2="80" y2="486" stroke="#9a6a32" stroke-width="6"/>
  <text x="90" y="491" font-size="13" fill="#222">guard rail all the way round</text>
  <text x="44" y="514" font-size="13" fill="#222">Bed with dry wheat or rye straw,</text>
  <text x="44" y="532" font-size="13" fill="#222">not oat straw (it stays wet).</text>

  <!-- ===== RIGHT: cut-through view ===== -->
  <text x="520" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Cut through the wall</text>

  <!-- floor and bedding -->
  <rect x="392" y="400" width="250" height="14" fill="#e9dcae" stroke="none"/>
  <line x1="392" y1="414" x2="642" y2="414" stroke="#333" stroke-width="3"/>
  <!-- wall: 1 in = 8 px -->
  <rect x="618" y="150" width="20" height="264" fill="#c9b08a" stroke="#333" stroke-width="2"/>
  <text x="628" y="140" text-anchor="middle" font-size="13" fill="#222">wall</text>

  <!-- 2x4 rail: 1.5 x 3.5 in = 12 x 28 px; wall side 5 in (40 px) out from the wall, top of rail 10 in (80 px) up -->
  <rect x="566" y="306" width="12" height="28" fill="#b07a3a" stroke="#5c3d17" stroke-width="2"/>
  <!-- brace back to the wall -->
  <line x1="578" y1="318" x2="618" y2="318" stroke="#5c3d17" stroke-width="4"/>

  <!-- piglet lying in the gap -->
  <ellipse cx="598" cy="399" rx="18" ry="12" fill="#f3cdbf" stroke="#8a5a48" stroke-width="2"/>
  <text x="598" y="403" text-anchor="middle" font-size="11" fill="#5a2f22">piglet</text>

  <!-- sow's body leaning against the rail -->
  <path d="M392,414 L392,250 C440,205 520,215 556,262 C570,282 570,330 552,360 C532,392 470,410 392,414 Z" fill="#e7b8a6" stroke="#8a5a48" stroke-width="2"/>
  <text x="462" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a2f22">SOW</text>
  <text x="462" y="338" text-anchor="middle" font-size="12" fill="#5a2f22">lies down</text>
  <text x="462" y="353" text-anchor="middle" font-size="12" fill="#5a2f22">against the rail</text>

  <!-- 10 in height dimension -->
  <line x1="572" y1="413" x2="572" y2="336" stroke="#1b4f8a" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="520" y="452" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4f8a">rail about 10 in above the floor</text>
  <!-- 4–6 in out from wall -->
  <line x1="566" y1="292" x2="618" y2="292" stroke="#1b4f8a" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="592" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4f8a">4–6 in</text>
  <text x="520" y="474" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4f8a">and 4–6 in out from the wall</text>

  <text x="520" y="508" text-anchor="middle" font-size="13" fill="#222">A 2-by-4 (or pipe) rail stops the sow</text>
  <text x="520" y="526" text-anchor="middle" font-size="13" fill="#222">rolling onto a piglet against the wall.</text>
</svg>
