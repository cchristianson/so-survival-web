  <text x="482" y="38" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="562" y="314" font-size="19" fill="#1d2721" text-anchor="middle" font-weight="bold">Let it sink in,</text>
  <text x="562" y="338" font-size="16" fill="#555555" text-anchor="middle">straight, to flush</text>
  <rect x="681" y="6" width="213" height="348" rx="14" fill="#fbfaf6" stroke="#dcd6c8" stroke-width="1.5"/>
