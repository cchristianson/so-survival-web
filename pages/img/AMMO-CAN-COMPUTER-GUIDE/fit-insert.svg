  <text x="32" y="38" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="112" y="314" font-size="19" fill="#1d2721" text-anchor="middle" font-weight="bold">Heat the iron</text>
  <text x="112" y="338" font-size="16" fill="#555555" text-anchor="middle">230 °C for ABS</text>
  <rect x="231" y="6" width="213" height="348" rx="14" fill="#fbfaf6" stroke="#dcd6c8" stroke-width="1.5"/>
