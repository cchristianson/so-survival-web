  <text x="337" y="314" font-size="19" fill="#1d2721" text-anchor="middle" font-weight="bold">On the bevel,</text>
  <text x="337" y="338" font-size="16" fill="#555555" text-anchor="middle">small end down</text>
  <rect x="456" y="6" width="213" height="348" rx="14" fill="#fbfaf6" stroke="#dcd6c8" stroke-width="1.5"/>
