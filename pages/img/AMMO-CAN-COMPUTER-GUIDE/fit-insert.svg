<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Arial, Helvetica, sans-serif">
  <title>Fitting a heat-set insert in four steps: 1, heat the soldering iron to 230 °C; 2, stand the insert on the hole's bevel, small end down; 3, rest the iron's tip in the insert and let it sink in straight until it is flush; 4, press it flat with the side of a screwdriver while the plastic is soft</title>
  <rect width="900" height="360" fill="#ffffff"/>
  <rect x="6" y="6" width="213" height="348" rx="14" fill="#fbfaf6" stroke="#dcd6c8" stroke-width="1.5"/>
