  <text x="98" y="575" font-size="12" fill="#333" text-anchor="start">16 AWG black: the 12 V minus</text>
  <text x="20" y="595" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">Run 7</text>
  <text x="98" y="595" font-size="12" fill="#333" text-anchor="start">the meter’s own thick red wire</text>
  <text x="430" y="555" font-size="12" fill="#9a7400" text-anchor="start" font-weight="bold">Runs 10–13</text>
  <text x="508" y="555" font-size="12" fill="#333" text-anchor="start">22 AWG: the meter’s thin wires and its button</text>
  <text x="430" y="575" font-size="12" fill="#d03b2f" text-anchor="start" font-weight="bold">Runs 14, 15</text>
  <text x="508" y="575" font-size="12" fill="#333" text-anchor="start">18 AWG red and black: the Pi’s 5 V</text>
  <text x="430" y="595" font-size="12" fill="#2b6cb0" text-anchor="start" font-weight="bold">Runs 16, 17</text>
  <text x="508" y="595" font-size="12" fill="#333" text-anchor="start">the fan’s own lead; the printer’s USB cable</text>
  <text x="20" y="28" font-size="16" fill="#222" text-anchor="start" font-weight="bold">The ARK Vault wiring</text>
  <text x="20" y="48" font-size="12" fill="#555" text-anchor="start">Each number is a run in the guide’s table. Thick lines: 16 AWG (12 V). Medium: 18 AWG (the Pi’s 5 V). Thin: 22 AWG.</text>
  <text x="20" y="636" font-size="12.5" fill="#444" text-anchor="start">The Pi’s pair: 18 AWG most of the way, soldered to two female jumper leads about 5 cm from the pins.</text>
  <text x="20" y="656" font-size="12.5" fill="#444" text-anchor="start">Check your meter’s own wiring sheet: some put the thick wires the other way round.</text>
  <text x="20" y="676" font-size="12.5" fill="#444" text-anchor="start">Check the converter’s 5 V output with a meter (5.0 to 5.25 V, + and − the right way round) before plugging it onto the Pi.</text>
