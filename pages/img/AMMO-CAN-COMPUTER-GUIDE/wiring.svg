<svg xmlns="http://www.w3.org/2000/svg" width="840" height="700" viewBox="0 0 840 700" font-family="Arial, Helvetica, sans-serif">
  <title>The ARK Vault wiring, with each wire's size. Run 1: battery plus to the 7.5 amp fuse, 16 AWG red. Run 2: fuse to the power switch's input, 16 AWG red. Run 3: the switch's output to a splice, 16 AWG red, and from the splice run 4 to the 5 volt converter's input plus and run 5 to the printer's plus, both 16 AWG red. Run 6: battery minus to the volt/amp meter's thick black wire, 16 AWG black. Run 7: the meter's thick red wire to a splice, and from it run 8 to the converter's input minus and run 9 to the printer's minus, 16 AWG black. The meter's thin wires, 22 AWG: run 10, thin black to the battery minus side of the meter; run 11, thin yellow to the switch's input; run 12, thin red to the meter button's COM; run 13, the button's NO to the switch's input, so the meter lights only while the button is held. Runs 14 and 15: the converter's 5 volt output to the Pi's pin 2 (plus) and pin 14 (ground), 18 AWG red and black, ending in female jumper leads. The fan is on pins 4, 6 and 8; the printer's USB lead goes to a Pi USB port. The solar controller is stored in the can, not wired.</title>
