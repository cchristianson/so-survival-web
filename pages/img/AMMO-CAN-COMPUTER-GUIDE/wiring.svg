<svg xmlns="http://www.w3.org/2000/svg" width="840" height="610" viewBox="0 0 840 610" font-family="Arial, Helvetica, sans-serif">
  <title>The ARK Vault wiring. Battery plus goes through a 7.5 amp fuse and the power switch to the printer and the 5 volt converter. Battery minus goes through the volt/amp meter's thick wires (black in, red out) to the printer and the converter. The meter's thin black wire goes to battery minus, its thin yellow wire to plus after the fuse, and its thin red wire through the meter button to plus after the fuse, so it lights only while the button is held. The converter's 5 volt output goes to the Pi's pin 2 (plus) and pin 14 (ground); the fan is on pins 4, 6 and 8; the printer's USB lead goes to a Pi USB port. The solar controller is stored in the can, not wired.</title>
  <rect width="840" height="610" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">The ARK Vault wiring</text>
  <text x="20" y="48" font-size="12" fill="#555">Thick lines: the main power (16 AWG). Thin lines: the meter's own wires. The solar controller is stored, not wired.</text>
  <polyline points="140,165 180,165" fill="none" stroke="#d03b2f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="260,165 340,165" fill="none" stroke="#d03b2f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="440,165 560,165" fill="none" stroke="#d03b2f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="560,85 560,245" fill="none" stroke="#d03b2f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="560,85 600,85" fill="none" stroke="#d03b2f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="560,245 573,245" fill="none" stroke="#d03b2f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M573 245 A7 7 0 0 1 587 245" fill="none" stroke="#d03b2f" stroke-width="4"/>
  <polyline points="587,245 600,245" fill="none" stroke="#d03b2f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="560" cy="165" r="5" fill="#d03b2f"/>
  <circle cx="300" cy="165" r="5" fill="#d03b2f"/>
  <circle cx="320" cy="165" r="5" fill="#d03b2f"/>
  <polyline points="140,275 200,275 200,445 330,445" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="480,445 580,445 580,130 600,130" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="580,310 600,310" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="580" cy="310" r="5" fill="#222222"/>
  <circle cx="200" cy="370" r="5" fill="#222222"/>
  <text x="212" y="462" font-size="10.5" fill="#222222" text-anchor="start">thick black</text>
  <text x="486" y="438" font-size="10.5" fill="#222222" text-anchor="start">thick red</text>
  <text x="505" y="462" font-size="10.5" fill="#555" text-anchor="start">− to the loads</text>
  <polyline points="350,400 350,370 200,370" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="390,400 390,330 300,330 300,165" fill="none" stroke="#d9a400" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="430,400 430,340" fill="none" stroke="#d03b2f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="450,300 450,230 320,230 320,165" fill="none" stroke="#d03b2f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="212" y="362" font-size="10.5" fill="#222222" text-anchor="start">thin black</text>
  <text x="294" y="252" font-size="10.5" fill="#9a7400" text-anchor="end">thin yellow</text>
  <text x="294" y="266" font-size="10.5" fill="#9a7400" text-anchor="end">(reads the volts)</text>
  <text x="326" y="222" font-size="10.5" fill="#d03b2f" text-anchor="start">thin red (powers the meter)</text>
  <rect x="30" y="140" width="110" height="160" rx="7" fill="#fde8d4" stroke="#333" stroke-width="1.5"/>
  <text x="85.0" y="220.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Battery</text>
  <text x="85.0" y="237.0" font-size="11.5" fill="#444" text-anchor="middle">12.8 V LiFePO4</text>
  <text x="146" y="158" font-size="14" fill="#d03b2f" text-anchor="start" font-weight="bold">+</text>
  <text x="146" y="292" font-size="16" fill="#222222" text-anchor="start" font-weight="bold">−</text>
  <rect x="180" y="150" width="80" height="30" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="220.0" y="170.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Fuse</text>
  <text x="220" y="198" font-size="11.5" fill="#555" text-anchor="middle">7.5 A, inline</text>
  <rect x="340" y="145" width="100" height="40" rx="7" fill="#ffe1dc" stroke="#333" stroke-width="1.5"/>
  <text x="390.0" y="170.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Power switch</text>
  <text x="390" y="201" font-size="11.5" fill="#555" text-anchor="middle">red rocker, on the riser</text>
  <rect x="405" y="300" width="90" height="40" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="450.0" y="325.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Meter button</text>
  <text x="500" y="316" font-size="11.5" fill="#555" text-anchor="start">microswitch:</text>
  <text x="500" y="330" font-size="11.5" fill="#555" text-anchor="start">COM and NO</text>
  <rect x="330" y="400" width="150" height="90" rx="7" fill="#e3eefb" stroke="#333" stroke-width="1.5"/>
  <text x="405.0" y="445.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Volt/amp meter</text>
  <text x="405.0" y="462.0" font-size="11.5" fill="#444" text-anchor="middle">hold the button to read it</text>
  <rect x="600" y="60" width="170" height="90" rx="7" fill="#efefef" stroke="#333" stroke-width="1.5"/>
  <text x="685.0" y="105.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Printer</text>
  <text x="685.0" y="122.0" font-size="11.5" fill="#444" text-anchor="middle">12 V, on the riser</text>
  <rect x="600" y="220" width="170" height="110" rx="7" fill="#efefef" stroke="#333" stroke-width="1.5"/>
  <text x="685.0" y="275.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">5 V converter</text>
  <text x="685.0" y="292.0" font-size="11.5" fill="#444" text-anchor="middle">TOBSUN EA25-5V, 5 A</text>
  <text x="606" y="241" font-size="10.5" fill="#d03b2f" text-anchor="start">IN +</text>
  <text x="606" y="323" font-size="10.5" fill="#222222" text-anchor="start">IN −</text>
  <text x="606" y="82" font-size="12" fill="#d03b2f" text-anchor="start" font-weight="bold">+</text>
  <text x="606" y="127" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">−</text>
  <polyline points="650,330 650,400" fill="none" stroke="#d03b2f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="720,330 720,400" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="644" y="368" font-size="10.5" fill="#d03b2f" text-anchor="end">5 V +</text>
  <text x="726" y="368" font-size="10.5" fill="#222222" text-anchor="start">5 V −</text>
  <rect x="600" y="400" width="170" height="120" rx="7" fill="#e2f3e5" stroke="#333" stroke-width="1.5"/>
  <text x="685.0" y="460.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Raspberry Pi</text>
  <text x="685.0" y="477.0" font-size="11.5" fill="#444" text-anchor="middle">on the lid</text>
  <text x="650" y="418" font-size="11" fill="#d03b2f" text-anchor="middle" font-weight="bold">pin 2</text>
  <text x="720" y="418" font-size="11" fill="#222222" text-anchor="middle" font-weight="bold">pin 14</text>
  <text x="685" y="498" font-size="11.5" fill="#2b6cb0" text-anchor="middle">fan: pins 4, 6, 8</text>
  <polyline points="770,105 795,105 795,470 770,470" fill="none" stroke="#777" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="801" y="290" font-size="11" fill="#777" text-anchor="start" font-weight="bold">USB</text>
  <text x="20" y="576" font-size="12.5" fill="#444">Check your meter's own wiring sheet: some put the thick wires the other way round.</text>
  <text x="20" y="596" font-size="12.5" fill="#444">Check the converter's 5 V output with a meter (5.0 to 5.25 V, + and − the right way round) before plugging it onto the Pi.</text>
</svg>
