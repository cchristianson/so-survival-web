<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Wiring: battery plus through a 7.5 amp fuse to switch A and the relay side by side, then to the 12 volt to USB-C adapter and the printer. The relay runs from the Pi's 3.3 volt, 5 volt and ground pins (1, 2 and 9). Switch B connects pins 5 and 6.</title>
  <rect width="680" height="452" fill="#ffffff"/>
  <g fill="none" stroke="#d03b2f" stroke-width="3" stroke-linejoin="round">
    <path d="M70 150 V128 H150"/><path d="M220 128 H238 V92 H262"/><path d="M238 128 V164 H262"/>
    <path d="M412 92 H436 V164 H412"/><path d="M436 92 H462"/><path d="M436 164 H462"/>
  </g>
  <g fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round">
    <path d="M70 214 V236 H628 V102 H592"/><path d="M522 184 V236"/>
  </g>
  <g fill="none" stroke="#7b4fb5" stroke-width="3" stroke-linejoin="round">
    <path d="M592 84 H650 V262"/><path d="M592 168 H636 V262"/>
  </g>
  <g fill="none" stroke="#2b6cb0" stroke-width="2" stroke-linejoin="round">
    <path d="M285 184 V304 H462"/><path d="M337 184 V326 H462"/><path d="M389 184 V348 H462"/>
    <path d="M412 368 H440 V370 H462"/><path d="M412 386 H440 V392 H462"/>
  </g>
  <g fill="#f5f6f8" stroke="#8a94a3" stroke-width="1.5">
    <rect x="20" y="150" width="100" height="64" rx="8"/><rect x="150" y="114" width="70" height="28" rx="6"/>
    <rect x="262" y="72" width="150" height="40" rx="6"/><rect x="262" y="144" width="150" height="40" rx="6"/>
    <rect x="462" y="66" width="130" height="40" rx="6"/><rect x="462" y="144" width="130" height="40" rx="6"/>
    <rect x="462" y="262" width="200" height="150" rx="8"/><rect x="262" y="350" width="150" height="48" rx="6"/>
  </g>
  <g fill="#222">
    <text x="70" y="178" text-anchor="middle" font-weight="bold">Battery</text><text x="70" y="196" text-anchor="middle">12.8 V LiFePO4</text>
    <text x="185" y="133" text-anchor="middle">Fuse 7.5 A</text>
    <text x="337" y="89" text-anchor="middle" font-weight="bold">Switch A · COM–NC</text>
    <text x="337" y="161" text-anchor="middle" font-weight="bold">Relay · COM–NO</text>
    <text x="527" y="91" text-anchor="middle" font-weight="bold">12 V → USB-C</text>
    <text x="527" y="169" text-anchor="middle" font-weight="bold">Printer</text>
    <text x="476" y="284" font-weight="bold">Raspberry Pi 4 or 5</text>
    <text x="337" y="370" text-anchor="middle" font-weight="bold">Switch B · COM–NO</text>
  </g>
  <g fill="#555" font-size="11.5">
    <text x="337" y="105" text-anchor="middle">open when the Pi is down</text>
    <text x="337" y="177" text-anchor="middle">held on by the Pi</text>
    <text x="292" y="200">IN</text><text x="344" y="200">VCC</text><text x="396" y="200">GND</text>
    <text x="472" y="308">pin 1 · 3.3 V</text><text x="472" y="330">pin 2 · 5 V</text><text x="472" y="352">pin 9 · GND</text>
    <text x="472" y="374">pin 5 · GPIO 3</text><text x="472" y="396">pin 6 · GND</text>
    <text x="652" y="282" text-anchor="end">USB-C</text><text x="634" y="300" text-anchor="end">USB</text>
    <text x="337" y="387" text-anchor="middle">closed when the Pi is down</text>
  </g>
  <g font-size="12.5" fill="#222">
    <rect x="20" y="432" width="16" height="4" fill="#d03b2f"/><text x="42" y="438">battery +</text>
    <rect x="120" y="432" width="16" height="4" fill="#222"/><text x="142" y="438">battery −</text>
    <rect x="220" y="433" width="16" height="3" fill="#2b6cb0"/><text x="242" y="438">jumper wires to the Pi's pins</text>
    <rect x="430" y="432" width="16" height="4" fill="#7b4fb5"/><text x="452" y="438">USB leads</text>
  </g>
</svg>
