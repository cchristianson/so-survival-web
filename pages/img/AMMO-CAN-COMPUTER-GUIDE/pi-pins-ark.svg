  <text x="140" y="335" font-size="12" fill="#555" text-anchor="end">board edge</text>
  <text x="140" y="395" font-size="12" fill="#555" text-anchor="end">inner row</text>
  <text x="648" y="452" font-size="12" fill="#555">… 24 more pins →</text>
