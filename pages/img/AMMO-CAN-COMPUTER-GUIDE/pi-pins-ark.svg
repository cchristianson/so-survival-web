<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" font-family="Arial, Helvetica, sans-serif">
  <title>The Raspberry Pi pins the ARK Vault uses, at the end of the 40-pin row farthest from the USB ports, all on the row along the board's edge: pin 2 (5 volts) takes the converter's plus wire, pins 4, 6 and 8 take the cooler fan's red, black and blue wires (5 volts, ground, GPIO 14), and pin 14 (ground) takes the converter's minus wire.</title>
  <rect width="760" height="690" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222">The Pi's pins in the ARK Vault (fit the wires with the power off)</text>
