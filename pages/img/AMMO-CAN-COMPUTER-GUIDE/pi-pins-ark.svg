  <text x="190" y="395" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <path d="M190 314 V44" stroke="#d03b2f" stroke-width="2.5"/>
  <text x="197" y="56" font-size="14" font-weight="bold" fill="#d03b2f">pin 2 · 5 V</text>
  <text x="197" y="73" font-size="13" fill="#d03b2f">← converter OUT + (red)</text>
  <circle cx="190" cy="330" r="16" fill="#d03b2f" stroke="#fff" stroke-width="2"/>
  <text x="190" y="335" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
