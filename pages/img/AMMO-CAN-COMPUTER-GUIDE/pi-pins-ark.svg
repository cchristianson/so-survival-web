  <text x="371" y="188" font-size="14" font-weight="bold" fill="#2b6cb0">pin 8 · GPIO 14</text>
  <text x="371" y="205" font-size="13" fill="#2b6cb0">← fan, blue wire</text>
  <circle cx="364" cy="330" r="16" fill="#2b6cb0" stroke="#fff" stroke-width="2"/>
