  <text x="255" y="100" font-size="14" font-weight="bold" fill="#d03b2f">pin 4 · 5 V</text>
  <text x="255" y="117" font-size="13" fill="#d03b2f">← fan, red wire</text>
  <circle cx="248" cy="330" r="16" fill="#d03b2f" stroke="#fff" stroke-width="2"/>
  <text x="248" y="335" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
