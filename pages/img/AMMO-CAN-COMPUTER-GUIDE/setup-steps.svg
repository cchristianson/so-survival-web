<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Arial, Helvetica, sans-serif">
  <title>Setting up the Pi in four steps: 1, fill the library drive with the installer kit on your computer; 2, write the Pi's small card with Raspberry Pi Imager (Raspberry Pi OS Lite, 64-bit, no customisation); 3, finish the card with the installer and write down the Wi-Fi name and password; 4, the card in the Pi, the drive in a blue USB port, switch on: the green light flickers for 5 to 10 minutes, then the Wi-Fi appears</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <rect x="6" y="6" width="433" height="204" rx="14" fill="#fbfaf6" stroke="#dcd6c8" stroke-width="1.5"/>
  <circle cx="32" cy="34" r="15" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="0"/>
  <text x="32" y="40" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="180" y="52" font-size="21" fill="#1d2721" text-anchor="start" font-weight="bold">Fill the library drive</text>
  <text x="180" y="84" font-size="16" fill="#555555" text-anchor="start">With the installer kit,</text>
  <text x="180" y="106" font-size="16" fill="#555555" text-anchor="start">on your computer.</text>
  <rect x="461" y="6" width="433" height="204" rx="14" fill="#fbfaf6" stroke="#dcd6c8" stroke-width="1.5"/>
  <circle cx="487" cy="34" r="15" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="0"/>
  <text x="487" y="40" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="635" y="52" font-size="21" fill="#1d2721" text-anchor="start" font-weight="bold">Write the Pi’s small card</text>
  <text x="635" y="84" font-size="16" fill="#555555" text-anchor="start">Raspberry Pi Imager:</text>
  <text x="635" y="106" font-size="16" fill="#555555" text-anchor="start">Raspberry Pi OS Lite (64-bit).</text>
  <text x="635" y="128" font-size="16" fill="#555555" text-anchor="start">Customisation: No.</text>
  <rect x="6" y="226" width="433" height="204" rx="14" fill="#fbfaf6" stroke="#dcd6c8" stroke-width="1.5"/>
  <circle cx="32" cy="254" r="15" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="0"/>
  <text x="32" y="260" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="180" y="272" font-size="21" fill="#1d2721" text-anchor="start" font-weight="bold">Finish the card</text>
  <text x="180" y="304" font-size="16" fill="#555555" text-anchor="start">In the installer: Finish a Raspberry</text>
  <text x="180" y="326" font-size="16" fill="#555555" text-anchor="start">Pi memory card. Write down the</text>
  <text x="180" y="348" font-size="16" fill="#555555" text-anchor="start">Wi-Fi name and password.</text>
  <rect x="461" y="226" width="433" height="204" rx="14" fill="#fbfaf6" stroke="#dcd6c8" stroke-width="1.5"/>
  <circle cx="487" cy="254" r="15" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="0"/>
  <text x="487" y="260" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="635" y="272" font-size="21" fill="#1d2721" text-anchor="start" font-weight="bold">Switch on</text>
  <text x="635" y="304" font-size="16" fill="#555555" text-anchor="start">Card in the Pi, drive in a blue</text>
  <text x="635" y="326" font-size="16" fill="#555555" text-anchor="start">USB port. The green light flickers</text>
  <text x="635" y="348" font-size="16" fill="#555555" text-anchor="start">5–10 minutes, then its Wi-Fi shows.</text>
