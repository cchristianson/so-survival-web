<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="Arial, Helvetica, sans-serif">
  <title>The five Raspberry Pi pins the slide uses, at the end of the 40-pin row farthest from the USB ports: pin 1 (3.3 volts) to the relay IN, pin 2 (5 volts) to the relay VCC, pin 9 (ground) to the relay GND, and pins 5 and 6 to switch B. Even-numbered pins are on the row along the edge of the board.</title>
  <rect width="640" height="450" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#222">The five pins the slide uses (fit the wires with the Pi unplugged)</text>
  <rect x="170" y="88" width="360" height="120" rx="8" fill="#222"/>
  <text x="160" y="122" font-size="12" fill="#555" text-anchor="end">board edge</text>
  <text x="160" y="182" font-size="12" fill="#555" text-anchor="end">inner row</text>
  <text x="530" y="226" font-size="12" fill="#555">… 30 more pins →</text>
  <circle cx="210" cy="118" r="15" fill="#d03b2f" stroke="#fff" stroke-width="2"/>
  <text x="210" y="123" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <path d="M210 102 V50" stroke="#d03b2f" stroke-width="2.5"/>
  <text x="210" y="46" font-size="13" font-weight="bold" fill="#d03b2f" text-anchor="end" dx="-6">pin 2 · 5 V → relay VCC</text>
  <circle cx="210" cy="178" r="15" fill="#e07b00" stroke="#fff" stroke-width="2"/>
  <text x="210" y="183" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <path d="M210 194 V232" stroke="#e07b00" stroke-width="2.5"/>
  <text x="210" y="250" font-size="13" font-weight="bold" fill="#e07b00" text-anchor="middle">pin 1 · 3.3 V</text>
  <text x="210" y="267" font-size="13" fill="#e07b00" text-anchor="middle">→ relay IN</text>
  <circle cx="280" cy="118" r="15" fill="#9a8a50" stroke="#fff" stroke-width="0"/>
  <text x="280" y="123" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <circle cx="280" cy="178" r="15" fill="#9a8a50" stroke="#fff" stroke-width="0"/>
  <text x="280" y="183" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <circle cx="350" cy="118" r="15" fill="#222222" stroke="#fff" stroke-width="2"/>
  <text x="350" y="123" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
  <path d="M350 102 V50" stroke="#222222" stroke-width="2.5"/>
  <text x="350" y="46" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" dx="6">pin 6 · GND → switch B</text>
  <circle cx="350" cy="178" r="15" fill="#2b6cb0" stroke="#fff" stroke-width="2"/>
  <text x="350" y="183" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
  <path d="M350 194 V232" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="350" y="250" font-size="13" font-weight="bold" fill="#2b6cb0" text-anchor="middle">pin 5 · GPIO 3</text>
  <text x="350" y="267" font-size="13" fill="#2b6cb0" text-anchor="middle">→ switch B</text>
  <circle cx="420" cy="118" r="15" fill="#9a8a50" stroke="#fff" stroke-width="0"/>
  <text x="420" y="123" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">8</text>
  <circle cx="420" cy="178" r="15" fill="#9a8a50" stroke="#fff" stroke-width="0"/>
  <text x="420" y="183" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">7</text>
  <circle cx="490" cy="118" r="15" fill="#9a8a50" stroke="#fff" stroke-width="0"/>
  <text x="490" y="123" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">10</text>
  <circle cx="490" cy="178" r="15" fill="#222222" stroke="#fff" stroke-width="2"/>
  <text x="490" y="183" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">9</text>
  <path d="M490 194 V232" stroke="#222222" stroke-width="2.5"/>
  <text x="490" y="250" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">pin 9 · GND</text>
  <text x="490" y="267" font-size="13" fill="#222222" text-anchor="middle">→ relay GND</text>
