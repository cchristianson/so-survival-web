<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Arial, Helvetica, sans-serif">
  <title>How the ammo-can library computer is used: lid open, power in, the Pi makes its own Wi-Fi, and phones open the library address in the browser</title>
  <rect width="640" height="440" fill="#ffffff"/>

  <!-- open ammo can -->
  <path d="M34,170 L22,82 L238,82 L250,170 Z" fill="#7d8a5e" stroke="#3f4a2a" stroke-width="2.5"/>
  <rect x="58" y="96" width="150" height="40" rx="3" fill="#f6f1e4" stroke="#8a7a55"/>
  <text x="133" y="113" text-anchor="middle" font-size="13" fill="#222">Wi-Fi card</text>
  <text x="133" y="129" text-anchor="middle" font-size="13" fill="#222">taped in the lid</text>
  <rect x="30" y="170" width="220" height="140" rx="4" fill="#6b7a4c" stroke="#3f4a2a" stroke-width="3"/>
  <rect x="44" y="180" width="192" height="118" rx="3" fill="#2f3a3f"/>
  <!-- foam tray contents -->
  <rect x="56" y="192" width="78" height="54" rx="4" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <text x="95" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Pi</text>
  <rect x="146" y="196" width="76" height="30" rx="4" fill="#cfd6dd" stroke="#555" stroke-width="1.5"/>
  <text x="184" y="216" text-anchor="middle" font-size="13" fill="#222">library drive</text>
  <rect x="56" y="256" width="166" height="32" rx="6" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text x="139" y="277" text-anchor="middle" font-size="13" fill="#222">power bank</text>
  <path d="M134,212 C140,212 140,211 146,211" fill="none" stroke="#111" stroke-width="3"/>
  <path d="M95,246 L95,256" fill="none" stroke="#111" stroke-width="3"/>
  <text x="140" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Pi + library drive</text>
  <text x="140" y="349" text-anchor="middle" font-size="13" fill="#222">plugged into power</text>

  <!-- wifi waves -->
  <g fill="none" stroke="#1f5f99" stroke-width="3" stroke-linecap="round">
    <path d="M285,200 a40,40 0 0 1 0,60"/>
    <path d="M305,185 a60,60 0 0 1 0,90"/>
    <path d="M325,170 a80,80 0 0 1 0,120"/>
  </g>
  <text x="312" y="320" text-anchor="middle" font-size="13" fill="#1f5f99" font-weight="bold">its own Wi-Fi</text>
  <text x="312" y="336" text-anchor="middle" font-size="13" fill="#1f5f99">no internet needed</text>

  <!-- phones -->
  <g>
    <rect x="390" y="110" width="100" height="190" rx="14" fill="#222"/>
    <rect x="398" y="128" width="84" height="150" rx="4" fill="#f4f7fb"/>
    <rect x="404" y="138" width="72" height="12" rx="2" fill="#dbe8f5"/>
    <rect x="404" y="158" width="72" height="50" rx="2" fill="#eef2e6"/>
    <rect x="404" y="216" width="72" height="50" rx="2" fill="#eef2e6"/>
  </g>
  <g>
    <rect x="510" y="140" width="90" height="170" rx="14" fill="#444"/>
    <rect x="517" y="156" width="76" height="134" rx="4" fill="#f4f7fb"/>
    <rect x="522" y="166" width="66" height="10" rx="2" fill="#dbe8f5"/>
    <rect x="522" y="184" width="66" height="44" rx="2" fill="#eef2e6"/>
    <rect x="522" y="234" width="66" height="44" rx="2" fill="#eef2e6"/>
  </g>
  <text x="495" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">phones are the screens</text>
  <text x="495" y="347" text-anchor="middle" font-size="13" fill="#222">(no SIM card or plan needed)</text>

  <!-- steps -->
  <rect x="15" y="370" width="610" height="62" rx="8" fill="#f2f6ec" stroke="#2e7d32" stroke-width="1.5"/>
  <g font-size="14" fill="#222">
    <text x="30" y="395"><tspan font-weight="bold">1.</tspan> Plug in power</text>
    <text x="215" y="395"><tspan font-weight="bold">2.</tspan> Wait 2–3 minutes</text>
    <text x="420" y="395"><tspan font-weight="bold">3.</tspan> Join the Pi's Wi-Fi</text>
    <text x="30" y="420"><tspan font-weight="bold">4.</tspan> In the phone's browser, type exactly: <tspan font-weight="bold" font-family="Courier New, monospace">http://192.168.4.1:8096</tspan></text>
  </g>
  <text x="20" y="40" font-size="15" font-weight="bold" fill="#222">In use: lid open</text>
  <text x="20" y="58" font-size="13" fill="#222">Shut and taped again when you're done.</text>
</svg>
