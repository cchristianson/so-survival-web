<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="Arial, Helvetica, sans-serif">
  <title>Two separate storage pieces: a small memory card in the slot under the Raspberry Pi holds the Pi's own system; the library drive (a USB stick, a small SSD, or a big microSD card in a USB card reader) plugs into a blue USB port</title>
  <rect width="660" height="400" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>
  <!-- the Pi, seen from the side -->
  <rect x="150" y="150" width="300" height="12" rx="3" fill="#3c8d4a" stroke="#1f5a2a" stroke-width="2"/>
  <rect x="170" y="128" width="60" height="22" fill="#222"/>
  <rect x="250" y="134" width="44" height="16" fill="#555"/>
  <rect x="392" y="112" width="58" height="38" rx="2" fill="#2b6cb0" stroke="#1d4f86" stroke-width="2"/>
  <rect x="398" y="124" width="46" height="5" fill="#9cc3ea"/>
  <text x="300" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Raspberry Pi</text>
  <!-- its own card, in the slot underneath -->
  <rect x="150" y="162" width="34" height="5" fill="#777"/>
  <rect x="122" y="164" width="40" height="7" rx="1.5" fill="#d4a017" stroke="#8a6a0e" stroke-width="1.5"/>
  <path d="M140 200 L140 176" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="12" y="206" width="300" height="140" rx="10" fill="#fff8e6" stroke="#d4a017" stroke-width="2"/>
  <text x="26" y="232" font-size="16" font-weight="bold" fill="#222">1. The Pi's own memory card</text>
  <text x="26" y="256" font-size="14" fill="#222">a small microSD card, 32 GB or more</text>
  <text x="26" y="278" font-size="14" fill="#222">in the slot underneath the Pi</text>
  <text x="26" y="300" font-size="14" fill="#222">holds only the Pi's system</text>
  <text x="26" y="336" font-size="12.5" fill="#555">(Raspberry Pi Imager, then "Finish the card")</text>
  <!-- the library drive, in a blue USB port -->
  <rect x="452" y="118" width="40" height="18" rx="2" fill="#bfc6cc" stroke="#666" stroke-width="1.5"/>
  <rect x="492" y="114" width="56" height="26" rx="4" fill="#3a3f45"/>
  <rect x="548" y="120" width="16" height="14" rx="1" fill="#d4a017" stroke="#8a6a0e" stroke-width="1"/>
  <text x="520" y="106" text-anchor="middle" font-size="12.5" fill="#555">e.g. card reader</text>
  <path d="M520 200 L520 146" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="340" y="206" width="308" height="140" rx="10" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="354" y="232" font-size="16" font-weight="bold" fill="#222">2. The library drive</text>
  <text x="354" y="256" font-size="14" fill="#222">256 GB or more, plugged into a</text>
  <text x="354" y="276" font-size="14" fill="#222">blue USB port: a USB stick, a small</text>
  <text x="354" y="296" font-size="14" fill="#222">SSD, or a microSD in a card reader</text>
  <text x="354" y="318" font-size="14" fill="#222">holds the whole library and the AI</text>
  <text x="354" y="338" font-size="12.5" fill="#555">(the library installer fills it)</text>
  <text x="330" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#b42318">Never write Raspberry Pi Imager to the library drive: it erases it.</text>
  <text x="330" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Two separate pieces, never the same one</text>
</svg>
