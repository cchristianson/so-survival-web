<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Arial, Helvetica, sans-serif">
  <title>Drilling and plugging a shiitake log: holes in a diamond pattern</title>
  <rect width="640" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Part of a log, seen from the side</text>
  <text x="620" y="28" text-anchor="end" font-size="13" font-style="italic" fill="#555">Not to scale</text>

  <!-- log body -->
  <rect x="20" y="60" width="600" height="150" fill="#b89b72" stroke="#5a4227" stroke-width="2.5"/>
  <g stroke="#8c6f48" stroke-width="1.2" fill="none">
    <path d="M30,78 C150,74 300,82 610,76"/><path d="M30,190 C200,196 380,186 610,192"/>
    <path d="M40,135 C120,131 170,140 250,134"/><path d="M380,137 C450,133 520,141 600,136"/>
  </g>
  <!-- dashed lines that show the diamond -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" fill="none" opacity="0.9">
    <path d="M100,95 L180,135 L260,95 L340,135 L420,95 L500,135 L580,95"/>
    <path d="M100,175 L180,135 L260,175 L340,135 L420,175 L500,135 L580,175"/>
  </g>
  <!-- rows of holes: rows offset by half a space -->
  <g fill="#3a2a17" stroke="#f3ead8" stroke-width="2">
    <circle cx="100" cy="95" r="7"/><circle cx="180" cy="95" r="0"/><circle cx="260" cy="95" r="7"/><circle cx="420" cy="95" r="7"/><circle cx="580" cy="95" r="7"/>
    <circle cx="180" cy="135" r="7"/><circle cx="340" cy="135" r="7"/><circle cx="500" cy="135" r="7"/>
    <circle cx="100" cy="175" r="7"/><circle cx="260" cy="175" r="7"/><circle cx="420" cy="175" r="7"/><circle cx="580" cy="175" r="7"/>
  </g>
  <!-- distance between holes in a row -->
  <line x1="262" y1="48" x2="418" y2="48" stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="260" y1="52" x2="260" y2="86" stroke="#333" stroke-width="1"/>
  <line x1="420" y1="52" x2="420" y2="86" stroke="#333" stroke-width="1"/>
  <text x="340" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">3 in apart in a row</text>
  <text x="320" y="232" text-anchor="middle" font-size="14" fill="#222">Each row starts half a space along from the one before, so the holes make diamonds.</text>

  <!-- inset 1: one hole, cut open -->
  <text x="20" y="272" font-size="16" font-weight="bold" fill="#222">One hole, cut open</text>
  <rect x="40" y="300" width="250" height="18" fill="#6e5233" stroke="#3a2a17" stroke-width="1.5"/>
  <text x="300" y="314" font-size="13" fill="#333">bark</text>
  <rect x="40" y="318" width="250" height="110" fill="#e2cfa8" stroke="#3a2a17" stroke-width="1.5"/>
  <text x="300" y="380" font-size="13" fill="#333">wood</text>
  <!-- the hole with spawn -->
  <rect x="150" y="300" width="30" height="86" fill="#f4f1ea" stroke="#3a2a17" stroke-width="2"/>
  <g fill="#bfb6a3"><circle cx="158" cy="320" r="4"/><circle cx="171" cy="331" r="4"/><circle cx="160" cy="345" r="4"/><circle cx="172" cy="358" r="4"/><circle cx="159" cy="371" r="4"/><circle cx="170" cy="379" r="3"/></g>
  <!-- wax cap -->
  <rect x="145" y="292" width="40" height="10" rx="4" fill="#e8b84a" stroke="#8c6a1a" stroke-width="1.5"/>
  <line x1="190" y1="296" x2="226" y2="280" stroke="#333" stroke-width="1.2"/>
  <text x="230" y="282" font-size="13" fill="#333">wax seal</text>
  <line x1="148" y1="350" x2="104" y2="350" stroke="#333" stroke-width="1.2"/>
  <text x="48" y="345" font-size="13" fill="#333">spawn</text>
  <text x="48" y="360" font-size="13" fill="#333">fills it</text>
  <!-- dimensions -->
  <line x1="150" y1="444" x2="180" y2="444" stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="165" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">7/16 in wide</text>
  <line x1="200" y1="302" x2="200" y2="384" stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="208" y="340" font-size="14" font-weight="bold" fill="#222">1¼ in</text>
  <text x="208" y="356" font-size="14" font-weight="bold" fill="#222">deep</text>

  <!-- inset 2: end of the log -->
  <text x="400" y="272" font-size="16" font-weight="bold" fill="#222">End of a 4-inch log</text>
  <circle cx="470" cy="355" r="62" fill="#e2cfa8" stroke="#6e5233" stroke-width="8"/>
  <g fill="none" stroke="#c4ad83" stroke-width="1.3"><circle cx="470" cy="355" r="40"/><circle cx="470" cy="355" r="20"/></g>
  <g fill="#3a2a17"><circle cx="470" cy="289" r="6"/><circle cx="536" cy="355" r="6"/><circle cx="470" cy="421" r="6"/><circle cx="404" cy="355" r="6"/></g>
  <text x="552" y="330" font-size="13" fill="#333">4 rows</text>
  <text x="552" y="346" font-size="13" fill="#333">around:</text>
  <text x="552" y="362" font-size="13" fill="#333">one row</text>
  <text x="552" y="378" font-size="13" fill="#333">per inch</text>
  <text x="552" y="394" font-size="13" fill="#333">across</text>
  <text x="470" y="452" text-anchor="middle" font-size="13" fill="#333">Logs 4–6 in across, cut while dormant</text>
</svg>
