<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" font-family="Arial, Helvetica, sans-serif">
  <title>Making a spore print in four steps</title>
  <rect width="640" height="540" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <!-- a generic mushroom cap seen from the side, gills down -->
    <g id="cap">
      <path d="M-70,0 C-66,-52 66,-52 70,0 Z" fill="#c9b89a" stroke="#4a3f30" stroke-width="2.5"/>
      <path d="M-66,0 L66,0" stroke="#4a3f30" stroke-width="2.5"/>
      <g stroke="#6b5c46" stroke-width="1.4">
        <line x1="-58" y1="0" x2="-50" y2="7"/><line x1="-42" y1="0" x2="-36" y2="8"/><line x1="-26" y1="0" x2="-22" y2="8"/>
        <line x1="-10" y1="0" x2="-8" y2="8"/><line x1="10" y1="0" x2="8" y2="8"/><line x1="26" y1="0" x2="22" y2="8"/>
        <line x1="42" y1="0" x2="36" y2="8"/><line x1="58" y1="0" x2="50" y2="7"/>
      </g>
    </g>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#bbb" stroke-width="1.5">
    <rect x="8" y="8" width="304" height="254" rx="8"/>
    <rect x="328" y="8" width="304" height="254" rx="8"/>
    <rect x="8" y="278" width="304" height="254" rx="8"/>
    <rect x="328" y="278" width="304" height="254" rx="8"/>
  </g>

  <!-- 1: cut off the stem -->
  <text x="22" y="36" font-size="17" font-weight="bold" fill="#222">1</text>
  <text x="42" y="36" font-size="15" fill="#222">Pick a mature cap and</text>
  <text x="42" y="55" font-size="15" fill="#222">cut off the stem.</text>
  <use href="#cap" x="160" y="130"/>
  <rect x="146" y="140" width="28" height="100" fill="#e6dcc8" stroke="#4a3f30" stroke-width="2.5"/>
  <line x1="110" y1="145" x2="215" y2="145" stroke="#b03a2e" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="220" y="150" font-size="14" fill="#b03a2e" font-weight="bold">cut</text>
  <text x="196" y="210" font-size="13" fill="#555">gills face</text>
  <text x="196" y="226" font-size="13" fill="#555">down</text>

  <!-- 2: lay it gills-down on half white, half dark paper -->
  <text x="342" y="36" font-size="17" font-weight="bold" fill="#222">2</text>
  <text x="362" y="36" font-size="15" fill="#222">Lay it gills-down on paper,</text>
  <text x="362" y="55" font-size="15" fill="#222">half white, half dark.</text>
  <rect x="360" y="170" width="120" height="22" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <rect x="480" y="170" width="120" height="22" fill="#2b2b2b" stroke="#333" stroke-width="2"/>
  <use href="#cap" x="480" y="162"/>
  <text x="420" y="216" text-anchor="middle" font-size="13" fill="#333">white paper</text>
  <text x="540" y="216" text-anchor="middle" font-size="13" fill="#333">dark paper</text>

  <!-- 3: cover with a glass, wait -->
  <text x="22" y="306" font-size="17" font-weight="bold" fill="#222">3</text>
  <text x="42" y="306" font-size="15" fill="#222">Cover it with a glass or bowl.</text>
  <text x="42" y="325" font-size="15" fill="#222">Wait a few hours.</text>
  <rect x="40" y="440" width="120" height="22" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <rect x="160" y="440" width="120" height="22" fill="#2b2b2b" stroke="#333" stroke-width="2"/>
  <use href="#cap" x="160" y="432"/>
  <path d="M68,440 L68,372 C68,345 252,345 252,372 L252,440" fill="#dcecf5" fill-opacity="0.45" stroke="#3d6f8e" stroke-width="3"/>
  <text x="160" y="498" text-anchor="middle" font-size="13" fill="#333">The glass stops drafts blowing</text>
  <text x="160" y="514" text-anchor="middle" font-size="13" fill="#333">the falling spores away.</text>

  <!-- 4: lift and read the color -->
  <text x="342" y="306" font-size="17" font-weight="bold" fill="#222">4</text>
  <text x="362" y="306" font-size="15" fill="#222">Lift the cap. Read the color:</text>
  <text x="362" y="325" font-size="15" fill="#222">it places the mushroom's family.</text>
  <rect x="360" y="345" width="120" height="120" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <rect x="480" y="345" width="120" height="120" fill="#2b2b2b" stroke="#333" stroke-width="2"/>
  <!-- the print: rays from the stem spot; brown spores show plainly on white -->
  <g stroke="#8a5a2b" stroke-width="2.2">
    <line x1="480" y1="405" x2="425" y2="405"/><line x1="480" y1="405" x2="429" y2="384"/><line x1="480" y1="405" x2="429" y2="426"/>
    <line x1="480" y1="405" x2="441" y2="366"/><line x1="480" y1="405" x2="441" y2="444"/><line x1="480" y1="405" x2="459" y2="354"/>
    <line x1="480" y1="405" x2="459" y2="456"/>
  </g>
  <g stroke="#5a4130" stroke-width="2.2">
    <line x1="480" y1="405" x2="535" y2="405"/><line x1="480" y1="405" x2="531" y2="384"/><line x1="480" y1="405" x2="531" y2="426"/>
    <line x1="480" y1="405" x2="519" y2="366"/><line x1="480" y1="405" x2="519" y2="444"/><line x1="480" y1="405" x2="501" y2="354"/>
    <line x1="480" y1="405" x2="501" y2="456"/>
  </g>
  <circle cx="480" cy="405" r="7" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="488" text-anchor="middle" font-size="13" fill="#333">A white print shows on the dark half,</text>
  <text x="480" y="504" text-anchor="middle" font-size="13" fill="#333">a colored one on the white half.</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333" font-style="italic">(This one is brown.)</text>
</svg>
