<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" font-family="Arial, Helvetica, sans-serif">
  <title>Running a weighted-gauge pressure canner, step by step</title>
  <rect width="640" height="600" fill="#ffffff"/>
  <defs>
    <!-- canner body with water and jars -->
    <g id="body">
      <path d="M-80,0 L-80,110 C-80,124 -70,130 -56,130 L56,130 C70,130 80,124 80,110 L80,0" fill="#e6e9ec" stroke="#3b4148" stroke-width="3"/>
      <rect x="-77" y="96" width="154" height="31" fill="#bcd9ea"/>
      <rect x="-70" y="118" width="140" height="5" fill="#6b7178"/>
      <g fill="#ffffff" stroke="#4d6b80" stroke-width="2">
        <rect x="-62" y="44" width="34" height="74" rx="5"/><rect x="-17" y="44" width="34" height="74" rx="5"/><rect x="28" y="44" width="34" height="74" rx="5"/>
      </g>
      <g fill="#7a8a96"><rect x="-64" y="38" width="38" height="8" rx="2"/><rect x="-19" y="38" width="38" height="8" rx="2"/><rect x="26" y="38" width="38" height="8" rx="2"/></g>
      <rect x="-90" y="130" width="180" height="10" fill="#555"/>
    </g>
    <!-- locked lid with vent pipe -->
    <g id="lid">
      <path d="M-86,0 C-80,-34 80,-34 86,0 Z" fill="#cfd4d9" stroke="#3b4148" stroke-width="3"/>
      <rect x="-5" y="-42" width="10" height="16" fill="#3b4148"/>
      <rect x="-96" y="-6" width="14" height="12" fill="#3b4148"/><rect x="82" y="-6" width="14" height="12" fill="#3b4148"/>
    </g>
    <!-- burner flames -->
    <g id="flame" fill="#e8742a" stroke="#a8461a" stroke-width="1">
      <path d="M-50,154 C-56,146 -48,140 -50,132 C-42,140 -40,148 -44,154 Z"/><path d="M-10,154 C-16,146 -8,140 -10,132 C-2,140 0,148 -4,154 Z"/>
      <path d="M30,154 C24,146 32,140 30,132 C38,140 40,148 36,154 Z"/>
    </g>
  </defs>

  <g fill="none" stroke="#bbb" stroke-width="1.5">
    <rect x="8" y="8" width="304" height="282" rx="8"/><rect x="328" y="8" width="304" height="282" rx="8"/>
    <rect x="8" y="306" width="304" height="282" rx="8"/><rect x="328" y="306" width="304" height="282" rx="8"/>
  </g>

  <!-- 1 -->
  <text x="22" y="34" font-size="17" font-weight="bold" fill="#222">1</text>
  <text x="42" y="34" font-size="15" fill="#222">Jars on the rack in</text>
  <text x="42" y="53" font-size="15" fill="#222"><tspan font-weight="bold">2–3 in</tspan> of hot water</text>
  <text x="42" y="72" font-size="13.5" fill="#444">(4–5 in for fish and long times)</text>
  <g transform="translate(150 140) scale(0.85)"><use href="#body"/></g>
  <line x1="232" y1="248" x2="232" y2="222" stroke="#333" stroke-width="1.5"/>
  <line x1="226" y1="248" x2="238" y2="248" stroke="#333" stroke-width="1.5"/><line x1="226" y1="222" x2="238" y2="222" stroke="#333" stroke-width="1.5"/>
  <text x="242" y="240" font-size="13" fill="#333">water</text>

  <!-- 2 -->
  <text x="342" y="34" font-size="17" font-weight="bold" fill="#222">2</text>
  <text x="362" y="34" font-size="15" fill="#222">Lock the lid, <tspan font-weight="bold">weight off</tspan>.</text>
  <text x="362" y="53" font-size="15" fill="#222">Heat till steam pours out,</text>
  <text x="362" y="72" font-size="15" fill="#222">then <tspan font-weight="bold">vent a full 10 minutes</tspan>.</text>
  <g transform="translate(470 152) scale(0.8)"><use href="#body"/><use href="#lid"/><use href="#flame"/></g>
  <g fill="none" stroke="#9aa5ad" stroke-width="3" stroke-linecap="round">
    <path d="M470,116 C462,108 478,100 468,90"/><path d="M480,116 C474,108 492,102 484,92"/><path d="M460,116 C452,110 464,102 456,94"/>
  </g>
  <text x="498" y="104" font-size="13" fill="#333">steam pours out</text>

  <!-- 3 -->
  <text x="22" y="332" font-size="17" font-weight="bold" fill="#222">3</text>
  <text x="42" y="332" font-size="15" fill="#222">Put the weight on. <tspan font-weight="bold">Start</tspan></text>
  <text x="42" y="351" font-size="15" fill="#222"><tspan font-weight="bold">timing when it jiggles.</tspan></text>
  <g transform="translate(130 422) scale(0.75)"><use href="#body"/><use href="#lid"/><use href="#flame"/></g>
  <rect x="120" y="372" width="20" height="18" rx="3" fill="#3b4148"/>
  <g stroke="#333" stroke-width="2" fill="none"><path d="M110,372 L104,366"/><path d="M150,372 L156,366"/><path d="M108,382 L100,382"/><path d="M152,382 L160,382"/></g>
  <text x="168" y="382" font-size="13.5" font-weight="bold" fill="#222">15-lb weight here</text>
  <text x="168" y="399" font-size="13" fill="#444">(11 lb on a dial gauge)</text>
  <rect x="20" y="540" width="280" height="42" rx="5" fill="#fbeceb" stroke="#b03a2e"/>
  <text x="160" y="557" text-anchor="middle" font-size="13.5" fill="#b03a2e" font-weight="bold">Pressure dropped? Bring it back up</text>
  <text x="160" y="574" text-anchor="middle" font-size="13.5" fill="#b03a2e" font-weight="bold">and start the whole time over.</text>

  <!-- 4 -->
  <text x="342" y="332" font-size="17" font-weight="bold" fill="#222">4</text>
  <text x="362" y="332" font-size="15" fill="#222">Heat off. Let it cool by itself</text>
  <text x="362" y="351" font-size="15" fill="#222">to <tspan font-weight="bold">zero pressure</tspan>. Weight off,</text>
  <text x="362" y="370" font-size="15" fill="#222"><tspan font-weight="bold">wait 10 minutes</tspan>, then open</text>
  <text x="362" y="389" font-size="15" fill="#222">the lid away from your face.</text>
  <g transform="translate(440 432) scale(0.75)"><use href="#body"/><use href="#lid"/></g>
  <!-- weight set aside -->
  <rect x="532" y="519" width="20" height="18" rx="3" fill="#3b4148"/>
  <text x="545" y="511" text-anchor="middle" font-size="13" fill="#333">weight off</text>
  <!-- clock -->
  <circle cx="580" cy="440" r="22" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
  <line x1="580" y1="440" x2="580" y2="424" stroke="#333" stroke-width="2.5"/><line x1="580" y1="440" x2="591" y2="446" stroke="#333" stroke-width="2.5"/>
  <text x="580" y="482" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">10 min</text>
  <rect x="340" y="540" width="280" height="42" rx="5" fill="#fbeceb" stroke="#b03a2e"/>
  <text x="480" y="566" text-anchor="middle" font-size="14" fill="#b03a2e" font-weight="bold">Never cool it with water.</text>
</svg>
