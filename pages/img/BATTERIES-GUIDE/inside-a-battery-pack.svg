<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Arial, Helvetica, sans-serif">
  <title>Inside a battery pack: six cells in three series groups of two in parallel, welded strips between them, and a management board watching every cell</title>
  <rect width="640" height="440" fill="#ffffff"/>
  <defs>
    <g id="licell">
      <rect x="0" y="0" width="90" height="32" rx="6" fill="#dfe3e0" stroke="#333" stroke-width="2"/>
      <text x="45" y="21" text-anchor="middle" font-size="13" fill="#444">3.7 V cell</text>
    </g>
  </defs>

  <text x="18" y="26" font-size="17" font-weight="bold" fill="#222">Inside a laptop or tool pack</text>

  <!-- case -->
  <rect x="70" y="44" width="500" height="250" rx="10" fill="#f7f7f5" stroke="#555" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="420" y="286" font-size="12" fill="#888">the pack's case</text>

  <!-- six cells: three groups of two -->
  <use href="#licell" x="102" y="92"/>
  <use href="#licell" x="102" y="146"/>
  <use href="#licell" x="252" y="92"/>
  <use href="#licell" x="252" y="146"/>
  <use href="#licell" x="402" y="92"/>
  <use href="#licell" x="402" y="146"/>

  <!-- welded strips: vertical bars join the two cells of a group (parallel) -->
  <g fill="#8d9aa3" stroke="#333" stroke-width="1.5">
    <rect x="90" y="88" width="10" height="94"/>
    <rect x="196" y="88" width="10" height="94"/>
    <rect x="240" y="88" width="10" height="94"/>
    <rect x="346" y="88" width="10" height="94"/>
    <rect x="390" y="88" width="10" height="94"/>
    <rect x="496" y="88" width="10" height="94"/>
  </g>
  <!-- strips from group to group (series) -->
  <g fill="#8d9aa3" stroke="#333" stroke-width="1.5">
    <rect x="206" y="123" width="34" height="12"/>
    <rect x="356" y="123" width="34" height="12"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="178" y="80">welded strip</text>
    <text x="328" y="80">welded strip</text>
  </g>

  <!-- management board -->
  <rect x="102" y="202" width="404" height="62" rx="6" fill="#e8efe4" stroke="#2f6b3a" stroke-width="2.5"/>
  <text x="114" y="224" font-size="14" font-weight="bold" fill="#2f6b3a">Management board (BMS)</text>
  <g font-size="12" fill="#333">
    <rect x="296" y="210" width="42" height="20" rx="3" fill="#fff6d6" stroke="#333" stroke-width="1.5"/>
    <text x="317" y="224" text-anchor="middle">fuse</text>
    <rect x="346" y="210" width="56" height="20" rx="3" fill="#dfe9f2" stroke="#333" stroke-width="1.5"/>
    <text x="374" y="224" text-anchor="middle">switches</text>
    <rect x="410" y="210" width="84" height="20" rx="3" fill="#dfe9f2" stroke="#333" stroke-width="1.5"/>
    <text x="452" y="224" text-anchor="middle">heat sensor</text>
  </g>
  <text x="114" y="252" font-size="13" fill="#333">a thin wire to every joint, so it can watch each cell on its own</text>

  <!-- sense wires -->
  <g stroke="#2f6b3a" stroke-width="1.2" fill="none">
    <path d="M95,182 V202"/><path d="M201,182 V202"/><path d="M245,182 V202"/>
    <path d="M351,182 V202"/><path d="M395,182 V202"/><path d="M501,182 V202"/>
  </g>

  <!-- terminals out of the pack -->
  <polyline points="95,88 95,66 40,66 40,330" fill="none" stroke="#222" stroke-width="3.5"/>
  <polyline points="501,88 501,62 600,62 600,330" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <text x="24" y="350" font-size="18" font-weight="bold" fill="#222">−</text>
  <text x="592" y="350" font-size="18" font-weight="bold" fill="#c0392b">+</text>
  <rect x="200" y="312" width="240" height="34" rx="5" fill="#f2f6ec" stroke="#333" stroke-width="2"/>
  <text x="320" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">11.1 V at the terminals</text>

  <!-- the three things to take away -->
  <g font-size="14" fill="#222">
    <text x="18" y="378"><tspan font-weight="bold">Two cells joined at both ends = parallel:</tspan> amp-hours add, volts stay at 3.7.</text>
    <text x="18" y="400"><tspan font-weight="bold">Three groups in a chain = series:</tspan> 3.7 + 3.7 + 3.7 = 11.1 V.</text>
    <text x="18" y="422"><tspan font-weight="bold">One cell out of range</tspan> and the board switches all six off.</text>
  </g>
</svg>
