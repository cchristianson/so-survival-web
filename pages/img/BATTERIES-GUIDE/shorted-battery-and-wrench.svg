<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Arial, Helvetica, sans-serif">
  <title>A wrench dropped across a car battery's posts: thousands of amps, a glowing welded wrench and boiling acid; beside it the right way, with the positive post covered and the wrench handle taped</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="rd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c0392b"/></marker>
    <g id="battery">
      <rect x="0" y="26" width="200" height="92" rx="7" fill="#444c52" stroke="#222" stroke-width="2.5"/>
      <rect x="10" y="18" width="180" height="14" rx="3" fill="#5c666d" stroke="#222" stroke-width="2"/>
      <g fill="#2f373c" stroke="#222" stroke-width="1.5">
        <rect x="66" y="8" width="26" height="12" rx="3"/>
        <rect x="110" y="8" width="26" height="12" rx="3"/>
      </g>
      <rect x="22" y="2" width="24" height="18" rx="3" fill="#c0392b" stroke="#222" stroke-width="2"/>
      <rect x="156" y="2" width="24" height="18" rx="3" fill="#222" stroke="#222" stroke-width="2"/>
      <text x="34" y="16" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">+</text>
      <text x="168" y="17" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">−</text>
    </g>
  </defs>

  <!-- ===== LEFT: the mistake ===== -->
  <text x="18" y="28" font-size="17" font-weight="bold" fill="#c0392b">A dropped wrench is a short circuit</text>
  <g transform="translate(26,66)">
    <use href="#battery" x="0" y="34"/>
    <!-- the current, from post to post -->
    <g stroke="#c0392b" stroke-width="4" fill="none" marker-end="url(#rd)">
      <path d="M40,62 H158"/>
    </g>
    <!-- wrench across both posts, glowing -->
    <g>
      <rect x="22" y="24" width="162" height="14" rx="4" fill="#e8742a" stroke="#8a2b10" stroke-width="2"/>
      <path d="M22,18 h22 v26 h-22 a9,13 0 0 1 0,-26 z" fill="#e8742a" stroke="#8a2b10" stroke-width="2"/>
      <path d="M184,18 h-22 v26 h22 a9,13 0 0 0 0,-26 z" fill="#e8742a" stroke="#8a2b10" stroke-width="2"/>
    </g>
    <!-- heat marks -->
    <g stroke="#c0392b" stroke-width="2.5" fill="none">
      <path d="M38,14 l6,-12 M52,12 l3,-14 M154,14 l-6,-12 M140,12 l-3,-14"/>
    </g>
    <!-- acid spitting from the vent caps -->
    <g fill="#8ab4d8" stroke="#2a6fa8" stroke-width="1.5">
      <circle cx="78" cy="30" r="5"/><circle cx="92" cy="16" r="4"/><circle cx="118" cy="26" r="4.5"/><circle cx="128" cy="12" r="3.5"/>
    </g>
    <text x="196" y="46" font-size="13" fill="#2a6fa8">acid</text>
    <text x="196" y="62" font-size="13" fill="#2a6fa8">spits out</text>

    <text x="0" y="174" font-size="16" font-weight="bold" fill="#c0392b">Thousands of amps</text>
    <text x="0" y="196" font-size="14" fill="#222">The wrench glows red and welds</text>
    <text x="0" y="214" font-size="14" fill="#222">itself to the posts. The acid boils</text>
    <text x="0" y="232" font-size="14" fill="#222">and can spray. The case can split.</text>
    <text x="0" y="262" font-size="16" font-weight="bold" fill="#c0392b">Get away. Do not grab it.</text>
  </g>

  <line x1="330" y1="48" x2="330" y2="350" stroke="#bbb" stroke-width="1.5"/>

  <!-- ===== RIGHT: the right way ===== -->
  <text x="352" y="28" font-size="17" font-weight="bold" fill="#2f6b3a">So it cannot happen</text>
  <g transform="translate(356,66)">
    <use href="#battery" x="0" y="34"/>
    <!-- red boot over the + post -->
    <path d="M14,16 h40 a4,4 0 0 1 4,4 v18 h-48 v-18 a4,4 0 0 1 4,-4 z" fill="#c0392b" stroke="#222" stroke-width="2"/>
    <text x="66" y="30" font-size="13" fill="#222">cover on the + post</text>
    <!-- a wrench with taped handle, set aside -->
    <g transform="translate(6,172)">
      <rect x="0" y="6" width="116" height="12" rx="3" fill="#9aa3a8" stroke="#333" stroke-width="2"/>
      <path d="M0,0 h20 v24 h-20 a8,12 0 0 1 0,-24 z" fill="#9aa3a8" stroke="#333" stroke-width="2"/>
      <g fill="#3d3d3d"><rect x="52" y="4" width="14" height="16"/><rect x="72" y="4" width="14" height="16"/><rect x="92" y="4" width="14" height="16"/></g>
      <text x="124" y="18" font-size="13" fill="#222">taped handle</text>
    </g>
    <!-- ring and watch crossed out -->
    <g transform="translate(6,212)">
      <circle cx="16" cy="16" r="12" fill="none" stroke="#9c7a2a" stroke-width="4"/>
      <rect x="54" y="4" width="26" height="24" rx="4" fill="#dfe3e0" stroke="#333" stroke-width="2"/>
      <line x1="44" y1="2" x2="92" y2="34" stroke="#c0392b" stroke-width="3.5"/>
      <line x1="0" y1="32" x2="34" y2="0" stroke="#c0392b" stroke-width="3.5"/>
      <text x="100" y="22" font-size="13" fill="#222">rings and watch off</text>
    </g>
    <text x="0" y="276" font-size="14" fill="#222">Also: a fuse right at the + post,</text>
    <text x="0" y="294" font-size="14" fill="#222">and the battery connected last.</text>
  </g>

  <text x="18" y="386" font-size="13" fill="#666">One golf-cart battery can push about 8,000 amps into a short: see Off-Grid Power, "Battery safety".</text>
</svg>
