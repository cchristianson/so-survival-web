<svg xmlns="http://www.w3.org/2000/svg" width="660" height="360" viewBox="0 0 660 360" font-family="Arial, Helvetica, sans-serif">
  <title>Squaring a corner with 6-8-10, then checking that both diagonals are equal</title>
  <rect width="660" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222">1. Square one corner: 6-8-10</text>
  <text x="360" y="30" font-size="16" font-weight="bold" fill="#222">2. Check the whole layout</text>

  <!-- LEFT: corner at (80,280); 24 px per ft -->
  <!-- string lines -->
  <line x1="80" y1="280" x2="310" y2="280" stroke="#2b4c7e" stroke-width="2.5"/>
  <line x1="80" y1="280" x2="80" y2="90" stroke="#2b4c7e" stroke-width="2.5"/>
  <!-- right-angle mark -->
  <path d="M80,262 H98 V280" fill="none" stroke="#2b4c7e" stroke-width="1.5"/>
  <!-- corner stake -->
  <rect x="74" y="274" width="12" height="12" fill="#8a5a2b"/>
  <!-- marks at 8 ft (x=272) and 6 ft (y=136) -->
  <circle cx="272" cy="280" r="6" fill="#c8431a"/>
  <circle cx="80" cy="136" r="6" fill="#c8431a"/>
  <!-- diagonal 10 ft -->
  <line x1="80" y1="136" x2="272" y2="280" stroke="#c8431a" stroke-width="2.5" stroke-dasharray="9 5"/>
  <!-- dimensions -->
  <line x1="80" y1="304" x2="272" y2="304" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="176" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">8 ft</text>
  <line x1="56" y1="280" x2="56" y2="136" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="46" y="213" text-anchor="end" font-size="15" font-weight="bold" fill="#222">6 ft</text>
  <text x="150" y="128" font-size="15" font-weight="bold" fill="#c8431a">10 ft exactly</text>
  <text x="150" y="146" font-size="13" fill="#444">move the line until</text>
  <text x="150" y="162" font-size="13" fill="#444">the diagonal is 10 ft</text>
  <text x="20" y="350" font-size="13" fill="#444">Measure from the corner. Never use less than 6 ft.</text>

  <!-- RIGHT: rectangle with equal diagonals -->
  <rect x="380" y="90" width="250" height="180" fill="#f4f1ea" stroke="#2b4c7e" stroke-width="2.5"/>
  <g fill="#8a5a2b"><rect x="374" y="84" width="12" height="12"/><rect x="624" y="84" width="12" height="12"/><rect x="374" y="264" width="12" height="12"/><rect x="624" y="264" width="12" height="12"/></g>
  <line x1="380" y1="90" x2="630" y2="270" stroke="#c8431a" stroke-width="2" stroke-dasharray="9 5"/>
  <line x1="630" y1="90" x2="380" y2="270" stroke="#c8431a" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="505" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Both diagonals the same length</text>
  <text x="505" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">= all four corners square</text>
  <text x="505" y="338" text-anchor="middle" font-size="13" fill="#444">If not, move the strings until they match.</text>
</svg>
