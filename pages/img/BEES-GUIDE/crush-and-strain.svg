<svg xmlns="http://www.w3.org/2000/svg" width="660" height="590" viewBox="0 0 660 590" font-family="Arial, Helvetica, sans-serif">
  <title>Taking honey without an extractor: cut the comb, crush it, strain it, squeeze the rest in a bag</title>
  <rect width="660" height="590" fill="#ffffff"/>
  <defs>
    <pattern id="hex" width="12" height="10.4" patternUnits="userSpaceOnUse">
      <path d="M3,0 L9,0 L12,5.2 L9,10.4 L3,10.4 L0,5.2 Z" fill="none" stroke="#c9a24a" stroke-width="0.8"/>
    </pattern>
    <path id="drop" d="M0,-7 C3,-2 5,1 5,3 A5,5 0 0 1 -5,3 C-5,1 -3,-2 0,-7 Z" fill="#e0a92e" stroke="#9a6d12" stroke-width="1"/>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>

  <!-- panel dividers -->
  <line x1="330" y1="12" x2="330" y2="520" stroke="#ccc" stroke-width="1.5"/>
  <line x1="12" y1="266" x2="648" y2="266" stroke="#ccc" stroke-width="1.5"/>

  <!-- step badges -->
  <g font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="28" cy="30" r="14" fill="#8b5a2b"/><text x="28" y="36">1</text>
    <circle cx="354" cy="30" r="14" fill="#8b5a2b"/><text x="354" y="36">2</text>
    <circle cx="28" cy="292" r="14" fill="#8b5a2b"/><text x="28" y="298">3</text>
    <circle cx="354" cy="292" r="14" fill="#8b5a2b"/><text x="354" y="298">4</text>
  </g>
  <g font-size="15" fill="#222">
    <text x="50" y="28">Cut the sealed comb off the</text>
    <text x="50" y="46">bar, leaving a finger's width</text>
    <text x="376" y="28">Crush it in a clean,</text>
    <text x="376" y="46">bone-dry bucket</text>
    <text x="50" y="290">Pour it through a coarse strainer,</text>
    <text x="50" y="308">then finer cloth; let it drain for hours</text>
    <text x="376" y="290">Squeeze the rest in a cloth</text>
    <text x="376" y="308">bag. Save the wax.</text>
  </g>

  <!-- ===== 1: cut the comb ===== -->
  <path d="M82,82 L262,82 L254,190 Q172,236 90,190 Z" fill="#f2d27a" stroke="#b8892c" stroke-width="2"/>
  <path d="M82,82 L262,82 L254,190 Q172,236 90,190 Z" fill="url(#hex)"/>
  <rect x="68" y="70" width="208" height="12" fill="#c8a165" stroke="#6b4a24" stroke-width="2"/>
  <line x1="62" y1="97" x2="290" y2="97" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 4"/>
  <!-- knife along the cut -->
  <path d="M188,94 L282,94 L282,101 L196,101 Z" fill="#c7ccd1" stroke="#555" stroke-width="1.5"/>
  <rect x="282" y="92" width="34" height="11" rx="3" fill="#6b4a24"/>
  <line x1="46" y1="114" x2="80" y2="90" stroke="#333" stroke-width="1.3"/>
  <text x="14" y="130" font-size="14" fill="#222">guide</text>
  <text x="14" y="147" font-size="14" fill="#222">strip</text>
  <text x="172" y="252" text-anchor="middle" font-size="14" fill="#555">only sealed honey: no brood, no pollen</text>

  <!-- ===== 2: crush in a bucket ===== -->
  <path d="M412,92 L558,92 L544,222 L426,222 Z" fill="#eef2f5" stroke="#4a4f57" stroke-width="2.5"/>
  <g fill="#f2d27a" stroke="#b8892c" stroke-width="1.5">
    <path d="M432,218 L440,188 L466,184 L470,214 Z"/>
    <path d="M466,216 L474,182 L502,178 L510,212 Z"/>
    <path d="M506,214 L512,190 L536,186 L538,216 Z"/>
    <path d="M448,190 L458,166 L486,170 L480,192 Z"/>
    <path d="M490,184 L500,160 L526,166 L518,188 Z"/>
  </g>
  <path d="M434,219 L536,219 L538,222 L432,222 Z" fill="#e0a92e"/>
  <ellipse cx="485" cy="92" rx="73" ry="9" fill="#dfe5ea" stroke="#4a4f57" stroke-width="2"/>
  <!-- wooden masher -->
  <line x1="530" y1="52" x2="500" y2="160" stroke="#8b5a2b" stroke-width="10" stroke-linecap="round"/>
  <rect x="474" y="158" width="50" height="12" rx="3" fill="#8b5a2b" transform="rotate(-16 499 164)"/>
  <text x="485" y="252" text-anchor="middle" font-size="14" fill="#555">food-grade plastic or stainless steel</text>

  <!-- ===== 3: strain ===== -->
  <!-- lower bucket with honey -->
  <path d="M84,402 L228,402 L216,508 L96,508 Z" fill="#eef2f5" stroke="#4a4f57" stroke-width="2.5"/>
  <path d="M92,472 L220,472 L216,508 L96,508 Z" fill="#e0a92e" stroke="none"/>
  <!-- fine cloth sagging over the bucket -->
  <path d="M74,400 Q156,452 238,400 L238,396 Q156,446 74,396 Z" fill="#f4f1ea" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M74,398 Q156,450 238,398" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <!-- coarse strainer with crushed comb -->
  <path d="M100,346 L212,346 Q208,394 156,398 Q104,394 100,346 Z" fill="#b8c0c8" stroke="#4a4f57" stroke-width="2"/>
  <g fill="#ffffff">
    <circle cx="124" cy="362" r="2.5"/><circle cx="140" cy="370" r="2.5"/><circle cx="156" cy="374" r="2.5"/><circle cx="172" cy="370" r="2.5"/><circle cx="188" cy="362" r="2.5"/>
    <circle cx="132" cy="384" r="2.5"/><circle cx="156" cy="388" r="2.5"/><circle cx="180" cy="384" r="2.5"/>
  </g>
  <g fill="#f2d27a" stroke="#b8892c" stroke-width="1.5">
    <path d="M106,346 L114,330 L136,332 L138,346 Z"/>
    <path d="M136,346 L142,326 L168,328 L170,346 Z"/>
    <path d="M168,346 L176,332 L200,334 L206,346 Z"/>
  </g>
  <use href="#drop" x="156" y="412"/>
  <use href="#drop" x="156" y="440"/>
  <use href="#drop" x="156" y="460"/>
  <g stroke="#333" stroke-width="1.3">
    <line x1="246" y1="360" x2="210" y2="364"/>
    <line x1="246" y1="420" x2="226" y2="406"/>
  </g>
  <g font-size="14" fill="#222">
    <text x="252" y="358">coarse</text>
    <text x="252" y="375">strainer</text>
    <text x="252" y="420">fine</text>
    <text x="252" y="437">cloth</text>
  </g>

  <!-- ===== 4: squeeze in a bag ===== -->
  <path d="M470,348 C428,384 428,452 486,462 C544,452 544,384 502,348 Z" fill="#f4f1ea" stroke="#8a8a8a" stroke-width="2"/>
  <g fill="#f2d27a" stroke="#b8892c" stroke-width="1" opacity="0.9">
    <circle cx="472" cy="420" r="9"/><circle cx="494" cy="430" r="10"/><circle cx="486" cy="404" r="8"/><circle cx="508" cy="410" r="7"/>
  </g>
  <!-- twisted neck -->
  <path d="M470,348 L478,336 L488,348 L496,336 L502,348" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M462,334 Q486,316 512,334" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="330" font-size="13" fill="#555">twist</text>
  <use href="#drop" x="486" y="476"/>
  <!-- bowl with honey -->
  <path d="M430,488 L542,488 Q538,520 486,522 Q434,520 430,488 Z" fill="#e0a92e" stroke="#4a4f57" stroke-width="2"/>
  <line x1="548" y1="412" x2="526" y2="412" stroke="#333" stroke-width="1.3"/>
  <g font-size="14" fill="#222">
    <text x="554" y="400">the wax</text>
    <text x="554" y="417">stays in</text>
    <text x="554" y="434">the bag</text>
  </g>

  <!-- note -->
  <line x1="12" y1="530" x2="648" y2="530" stroke="#ccc" stroke-width="1.5"/>
  <text x="330" y="556" text-anchor="middle" font-size="14" fill="#222">Work in a bee-tight room. A warm room (75–100 °F) helps it run.</text>
  <text x="330" y="576" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Don't heat the honey.</text>
</svg>
