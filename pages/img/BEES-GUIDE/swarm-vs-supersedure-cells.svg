<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="Arial, Helvetica, sans-serif">
  <title>Swarm cells hang along the bottom edge of a comb; supersedure or emergency cells sit on its face</title>
  <rect width="660" height="440" fill="#ffffff"/>
  <defs>
    <pattern id="hex" width="12" height="10.4" patternUnits="userSpaceOnUse">
      <path d="M3,0 L9,0 L12,5.2 L9,10.4 L3,10.4 L0,5.2 Z" fill="none" stroke="#c9a24a" stroke-width="0.8"/>
    </pattern>
    <!-- one queen cell: a peanut shape hanging point-down -->
    <g id="qc">
      <path d="M-7,0 C-9,8 -10,18 -8,26 C-6,34 6,34 8,26 C10,18 9,8 7,0 Z" fill="#c98f3c" stroke="#6b4a24" stroke-width="1.6"/>
      <path d="M-5,10 l3,3 M2,8 l3,3 M-4,20 l3,3 M3,19 l3,3" stroke="#6b4a24" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- ===== left: swarm cells ===== -->
  <rect x="30" y="40" width="280" height="14" fill="#c8a165" stroke="#6b4a24" stroke-width="2"/>
  <path d="M48,54 L292,54 L282,190 Q170,262 58,190 Z" fill="#f6e3a8" stroke="#b8892c" stroke-width="2"/>
  <path d="M48,54 L292,54 L282,190 Q170,262 58,190 Z" fill="url(#hex)"/>
  <!-- capped brood patch -->
  <ellipse cx="170" cy="150" rx="88" ry="52" fill="#d8b47a" opacity="0.75"/>
  <!-- a dozen+ cells hanging along the bottom edge -->
  <g>
    <use href="#qc" transform="translate(64,196)"/>
    <use href="#qc" transform="translate(80,208)"/>
    <use href="#qc" transform="translate(97,218)"/>
    <use href="#qc" transform="translate(114,225)"/>
    <use href="#qc" transform="translate(132,230)"/>
    <use href="#qc" transform="translate(151,233)"/>
    <use href="#qc" transform="translate(170,234)"/>
    <use href="#qc" transform="translate(189,233)"/>
    <use href="#qc" transform="translate(208,230)"/>
    <use href="#qc" transform="translate(226,225)"/>
    <use href="#qc" transform="translate(243,218)"/>
    <use href="#qc" transform="translate(260,208)"/>
    <use href="#qc" transform="translate(276,196)"/>
  </g>
  <text x="170" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">SWARM CELLS</text>
  <text x="170" y="330" text-anchor="middle" font-size="15" fill="#222">along the <tspan font-weight="bold">bottom edges</tspan></text>
  <text x="170" y="350" text-anchor="middle" font-size="15" fill="#222">of the combs,</text>
  <text x="170" y="370" text-anchor="middle" font-size="15" fill="#222"><tspan font-weight="bold">a dozen or more</tspan></text>
  <text x="170" y="398" text-anchor="middle" font-size="14" fill="#555">The colony is getting</text>
  <text x="170" y="416" text-anchor="middle" font-size="14" fill="#555">ready to swarm</text>

  <line x1="330" y1="40" x2="330" y2="420" stroke="#ccc" stroke-width="1.5"/>

  <!-- ===== right: supersedure / emergency cells ===== -->
  <rect x="350" y="40" width="280" height="14" fill="#c8a165" stroke="#6b4a24" stroke-width="2"/>
  <path d="M368,54 L612,54 L602,190 Q490,262 378,190 Z" fill="#f6e3a8" stroke="#b8892c" stroke-width="2"/>
  <path d="M368,54 L612,54 L602,190 Q490,262 378,190 Z" fill="url(#hex)"/>
  <ellipse cx="490" cy="150" rx="88" ry="52" fill="#d8b47a" opacity="0.75"/>
  <!-- 1-3 cells on the face of the comb -->
  <g>
    <use href="#qc" transform="translate(452,118)"/>
    <use href="#qc" transform="translate(522,132)"/>
  </g>
  <text x="490" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">SUPERSEDURE OR</text>
  <text x="490" y="326" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">EMERGENCY CELLS</text>
  <text x="490" y="350" text-anchor="middle" font-size="15" fill="#222">on the <tspan font-weight="bold">face</tspan> of the comb,</text>
  <text x="490" y="370" text-anchor="middle" font-size="15" fill="#222"><tspan font-weight="bold">1 to 3</tspan> of them</text>
  <text x="490" y="398" text-anchor="middle" font-size="14" fill="#555">The bees are raising a new</text>
  <text x="490" y="416" text-anchor="middle" font-size="14" fill="#555">queen to replace theirs</text>
</svg>
