<svg xmlns="http://www.w3.org/2000/svg" width="660" height="760" viewBox="0 0 660 760" font-family="Arial, Helvetica, sans-serif">
  <title>An electric bear fence around beehives: wire heights from the side, and the layout from above</title>
  <rect width="660" height="760" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>

  <!-- ===== Panel A: side view ===== -->
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222">From the side</text>

  <!-- soil and ground -->
  <rect x="20" y="250" width="620" height="80" fill="#efe6d6"/>
  <line x1="20" y1="250" x2="640" y2="250" stroke="#7a6a52" stroke-width="2"/>

  <!-- a hive standing behind the fence (faded) -->
  <g fill="#ece6d4" stroke="#a9a28f" stroke-width="2">
    <rect x="205" y="160" width="60" height="70"/>
    <rect x="200" y="152" width="70" height="10"/>
    <line x1="212" y1="230" x2="212" y2="250"/><line x1="258" y1="230" x2="258" y2="250"/>
  </g>
  <text x="235" y="200" text-anchor="middle" font-size="13" fill="#8a8473">hive</text>

  <!-- post spacing -->
  <line x1="94" y1="76" x2="386" y2="76" stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="240" y="66" text-anchor="middle" font-size="14" fill="#222">Heavy T-posts every 8 ft (never trees: bears climb them)</text>

  <!-- T-posts, 1.5 ft into the ground -->
  <g fill="#4d5560">
    <rect x="87" y="104" width="7" height="202"/>
    <rect x="387" y="104" width="7" height="202"/>
  </g>

  <!-- three hot wires -->
  <g stroke="#c0392b" stroke-width="2.6">
    <line x1="30" y1="150" x2="440" y2="150"/>
    <line x1="30" y1="187.5" x2="440" y2="187.5"/>
    <line x1="30" y1="225" x2="440" y2="225"/>
  </g>
  <!-- insulators -->
  <g fill="#f4d03f" stroke="#7d6608" stroke-width="1.2">
    <rect x="93" y="145" width="9" height="10" rx="2"/><rect x="93" y="182.5" width="9" height="10" rx="2"/><rect x="93" y="220" width="9" height="10" rx="2"/>
    <rect x="393" y="145" width="9" height="10" rx="2"/><rect x="393" y="182.5" width="9" height="10" rx="2"/><rect x="393" y="220" width="9" height="10" rx="2"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#c0392b">
    <text x="448" y="155">32 in</text>
    <text x="448" y="192">20 in</text>
    <text x="448" y="230">8 in</text>
  </g>
  <g font-size="14" fill="#222">
    <text x="508" y="150">3 hot wires, 12-</text>
    <text x="508" y="167">or 14-gauge high-</text>
    <text x="508" y="184">tensile, on</text>
    <text x="508" y="201">insulators</text>
    <text x="508" y="226" font-weight="bold">Test: 6,000–8,000</text>
    <text x="508" y="243" font-weight="bold">volts</text>
  </g>
  <text x="448" y="128" font-size="13" fill="#555">height above the ground</text>

  <!-- post depth -->
  <line x1="76" y1="253" x2="76" y2="303" stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="104" y="284" font-size="14" fill="#222">1½ ft in the ground</text>

  <!-- ===== Panel B: from above ===== -->
  <line x1="20" y1="342" x2="640" y2="342" stroke="#ccc" stroke-width="1.5"/>
  <text x="20" y="368" font-size="16" font-weight="bold" fill="#222">From above</text>

  <!-- cleared strip outside the wire -->
  <rect x="33" y="383" width="434" height="314" fill="#eef3e4" stroke="#7d9a55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="70" y="420" width="360" height="240" fill="#ffffff"/>

  <!-- hives, at least 3 ft in from the wire -->
  <g fill="#f2d27a" stroke="#8b5a2b" stroke-width="2">
    <rect x="140" y="465" width="36" height="30"/>
    <rect x="232" y="465" width="36" height="30"/>
    <rect x="324" y="465" width="36" height="30"/>
  </g>
  <g font-size="13" fill="#5a3b18" text-anchor="middle">
    <text x="158" y="514">hive</text><text x="250" y="514">hive</text><text x="342" y="514">hive</text>
  </g>
  <line x1="200" y1="424" x2="200" y2="461" stroke="#333" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="206" y="448" font-size="14" fill="#222">at least 3 ft</text>

  <!-- fence wire (gate gap on the south side) -->
  <path d="M190,660 L70,660 L70,420 L430,420 L430,660 L310,660" fill="none" stroke="#c0392b" stroke-width="2.6"/>
  <!-- gate: spring handles -->
  <path d="M190,660 l8,-6 l8,12 l8,-12 l8,12 l8,-12 l8,12 l8,-12 l8,12 l8,-12 l8,12 l8,-12 l8,12 l8,-12 l8,12 l8,-6" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- posts every 8 ft -->
  <g fill="#4d5560">
    <rect x="66" y="416" width="8" height="8"/><rect x="186" y="416" width="8" height="8"/><rect x="306" y="416" width="8" height="8"/><rect x="426" y="416" width="8" height="8"/>
    <rect x="66" y="536" width="8" height="8"/><rect x="426" y="536" width="8" height="8"/>
    <rect x="66" y="656" width="8" height="8"/><rect x="186" y="656" width="8" height="8"/><rect x="306" y="656" width="8" height="8"/><rect x="426" y="656" width="8" height="8"/>
  </g>

  <!-- charger with solar panel, and ground rod -->
  <rect x="378" y="604" width="26" height="20" fill="#5d6d7e" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="376" y="625" width="30" height="8" fill="#1f4e79" stroke="#2c3e50" stroke-width="1"/>
  <circle cx="414" cy="596" r="4" fill="#222"/>

  <!-- north arrow -->
  <line x1="610" y1="420" x2="610" y2="385" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="610" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">N</text>
  <text x="610" y="456" text-anchor="middle" font-size="13" fill="#555">south</text>
  <text x="610" y="471" text-anchor="middle" font-size="13" fill="#555">is down</text>

  <!-- labels -->
  <g stroke="#333" stroke-width="1.3" fill="none">
    <line x1="486" y1="530" x2="452" y2="530"/>
    <line x1="486" y1="604" x2="408" y2="612"/>
    <line x1="250" y1="712" x2="250" y2="668"/>
  </g>
  <g font-size="14" fill="#222">
    <text x="492" y="512">Cut plants back</text>
    <text x="492" y="529">2–3 ft: anything</text>
    <text x="492" y="546">touching the wire</text>
    <text x="492" y="563">drains it</text>
    <text x="492" y="604">Charger inside</text>
    <text x="492" y="621">the fence, solar</text>
    <text x="492" y="638">panel facing south;</text>
    <text x="492" y="655">6-ft ground rod (●)</text>
    <text x="250" y="728" text-anchor="middle">Gate: the wires hook on spring handles</text>
  </g>
  <text x="330" y="752" text-anchor="middle" font-size="13" fill="#555">Not to scale.</text>
</svg>
