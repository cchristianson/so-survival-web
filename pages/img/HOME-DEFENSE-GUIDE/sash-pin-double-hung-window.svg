<svg xmlns="http://www.w3.org/2000/svg" width="660" height="450" viewBox="0 0 660 450" font-family="Arial, Helvetica, sans-serif">
  <title>Pinning a double-hung window: a hole drilled down through the inner sash into the outer one, with a pin dropped in</title>
  <rect width="660" height="450" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222">Cut through the side of the window, where the sashes overlap</text>
  <text x="120" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">OUTSIDE</text>
  <text x="380" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">INSIDE (room)</text>

  <!-- outer (upper) sash side piece: runs up from the meeting point -->
  <rect x="212" y="70" width="38" height="226" fill="#d8b98c" stroke="#7a5a35" stroke-width="1.8"/>
  <!-- inner (lower) sash side piece: runs down from the meeting point -->
  <rect x="254" y="236" width="38" height="180" fill="#ecd5ab" stroke="#7a5a35" stroke-width="1.8"/>
  <!-- the pin, drilled down through the inner piece into the outer piece -->
  <line x1="302" y1="246" x2="222" y2="276" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
  <!-- second hole 5 in up, outer piece only -->
  <line x1="252" y1="150" x2="222" y2="161" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- 5 in -->
  <line x1="196" y1="161" x2="196" y2="274" stroke="#333" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="200" y1="161" x2="220" y2="161" stroke="#999" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="200" y1="276" x2="220" y2="276" stroke="#999" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="188" y="222" text-anchor="end" font-size="14" font-weight="bold" fill="#222">5 in</text>

  <!-- labels -->
  <g font-size="13" fill="#222">
    <text x="20" y="104" font-weight="bold">upper sash</text>
    <text x="20" y="120">(the outer one)</text>
    <line x1="112" y1="110" x2="210" y2="110" stroke="#888" stroke-width="1"/>
    <text x="320" y="374" font-weight="bold">lower sash</text>
    <text x="320" y="390">(the inner one)</text>
    <line x1="318" y1="378" x2="294" y2="378" stroke="#888" stroke-width="1"/>

    <text x="320" y="230" font-weight="bold">sash pin, long nail or Allen wrench,</text>
    <text x="320" y="246">in a hole drilled down through</text>
    <text x="320" y="262">the inner sash into the outer one</text>
    <line x1="318" y1="240" x2="304" y2="246" stroke="#888" stroke-width="1"/>

    <text x="320" y="128" font-weight="bold">a second hole 5 in up</text>
    <text x="320" y="144">lets you pin the window</text>
    <text x="320" y="160">open a little for air</text>
    <line x1="318" y1="148" x2="256" y2="150" stroke="#888" stroke-width="1"/>
  </g>

  <text x="20" y="430" font-size="13" fill="#8a2a0a" font-weight="bold">Pins you can pull out by hand: every bedroom needs a window to escape a fire.</text>
</svg>
