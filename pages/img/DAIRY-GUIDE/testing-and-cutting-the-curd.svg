<svg xmlns="http://www.w3.org/2000/svg" width="640" height="544" viewBox="0 0 640 544" font-family="Arial, Helvetica, sans-serif">
<title>Testing the curd with a finger for a clean split, then cutting it lengthwise, crosswise, and after a quarter turn lengthwise again into cubes three-eighths of an inch on a side</title>
<rect width="640" height="544" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>
<g transform="translate(8,8)">
<rect x="0" y="0" width="202" height="262" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold" fill="#222">Ready to cut?</text>
<text x="12" y="202" font-size="13.5" fill="#222">Slide a finger in at a</text>
<text x="12" y="220" font-size="13.5" fill="#222">slant and lift it. A clean</text>
<text x="12" y="238" font-size="13.5" fill="#222">split, nothing left on the</text>
<text x="12" y="256" font-size="13.5" fill="#222">finger: cut now.</text>
<path d="M26,104 H176 V172 Q176,186 162,186 H40 Q26,186 26,172 Z" fill="#f4efd9"/>
<path d="M24,74 V172 Q24,188 40,188 H162 Q178,188 178,172 V74" fill="none" stroke="#333" stroke-width="3.5"/>
<path d="M76,104 L94,126 L110,104 Z" fill="#e3ebcf" stroke="#7d7d5a" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="184.0" y1="44.0" x2="102.0" y2="136.0" stroke="#9c7a5a" stroke-width="17" stroke-linecap="round"/>
<line x1="184.0" y1="44.0" x2="102.0" y2="136.0" stroke="#efcfae" stroke-width="13" stroke-linecap="round"/>
<line x1="58" y1="70" x2="88" y2="108" stroke="#555" stroke-width="1.1"/>
<text x="16" y="64" font-size="13" fill="#333">clean split</text>
<text x="60" y="160" font-size="13" text-anchor="middle" fill="#666">curd</text>
</g>
<g transform="translate(219,8)">
<rect x="0" y="0" width="202" height="262" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold" fill="#222">1  Cut lengthwise</text>
<text x="12" y="202" font-size="13.5" fill="#222">Seen from above.</text>
<text x="12" y="220" font-size="13.5" fill="#222">Straight cuts ⅜ in apart</text>
<text x="12" y="238" font-size="13.5" fill="#222">with a long knife.</text>
<text x="12" y="256" font-size="13.5" fill="#222">Cut, don’t crush.</text>
<circle cx="101" cy="112" r="70" fill="#f4efd9"/>
<line x1="41.0" y1="75.9" x2="41.0" y2="148.1" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="53.0" y1="61.0" x2="53.0" y2="163.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="65.0" y1="52.0" x2="65.0" y2="172.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="77.0" y1="46.2" x2="77.0" y2="177.8" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="89.0" y1="43.0" x2="89.0" y2="181.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="101.0" y1="42.0" x2="101.0" y2="182.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="113.0" y1="43.0" x2="113.0" y2="181.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="125.0" y1="46.2" x2="125.0" y2="177.8" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="137.0" y1="52.0" x2="137.0" y2="172.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="149.0" y1="61.0" x2="149.0" y2="163.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="161.0" y1="75.9" x2="161.0" y2="148.1" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="101" cy="112" r="70" fill="none" stroke="#333" stroke-width="4"/>
</g>
<g transform="translate(430,8)">
<rect x="0" y="0" width="202" height="262" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold" fill="#222">2  Then crosswise</text>
<text x="12" y="202" font-size="13.5" fill="#222">Now the curd stands in</text>
<text x="12" y="220" font-size="13.5" fill="#222">long columns, ⅜ in</text>
<text x="12" y="238" font-size="13.5" fill="#222">square.</text>
<circle cx="101" cy="112" r="70" fill="#f4efd9"/>
<line x1="41.0" y1="75.9" x2="41.0" y2="148.1" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
