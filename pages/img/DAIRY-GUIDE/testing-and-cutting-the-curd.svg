<line x1="65.0" y1="52.0" x2="65.0" y2="172.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="41.0" y1="76.0" x2="161.0" y2="76.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="77.0" y1="46.2" x2="77.0" y2="177.8" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="35.2" y1="88.0" x2="166.8" y2="88.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="89.0" y1="43.0" x2="89.0" y2="181.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="32.0" y1="100.0" x2="170.0" y2="100.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="101.0" y1="42.0" x2="101.0" y2="182.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
