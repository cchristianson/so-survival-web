<polygon points="153.0,70.0 185.9,51.0 153.0,32.0 120.1,51.0" fill="#fbf7e8" stroke="#8a7a50" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="123" y1="158" x2="156" y2="139" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="166" y="176" font-size="14" font-weight="bold" fill="#222">⅜ in</text>
</g>
<text x="632" y="538" font-size="12" text-anchor="end" fill="#666">Not to scale.</text>
</svg>
