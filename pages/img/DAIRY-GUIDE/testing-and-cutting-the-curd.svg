<line x1="125.0" y1="46.2" x2="125.0" y2="177.8" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="35.2" y1="136.0" x2="166.8" y2="136.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="137.0" y1="52.0" x2="137.0" y2="172.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="41.0" y1="148.0" x2="161.0" y2="148.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="149.0" y1="61.0" x2="149.0" y2="163.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="50.0" y1="160.0" x2="152.0" y2="160.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="161.0" y1="75.9" x2="161.0" y2="148.1" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="64.9" y1="172.0" x2="137.1" y2="172.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="101" cy="112" r="70" fill="none" stroke="#333" stroke-width="4"/>
</g>
<g transform="translate(8,280)">
<rect x="0" y="0" width="308" height="240" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold" fill="#222">3  Quarter turn, cut again</text>
<text x="12" y="186" font-size="13.5" fill="#222">Give the curd a quarter turn so a</text>
<text x="12" y="204" font-size="13.5" fill="#222">side is on top, and cut lengthwise</text>
<text x="12" y="222" font-size="13.5" fill="#222">again: the columns become cubes.</text>
<rect x="28" y="58" width="72" height="92" fill="#f4efd9" stroke="#333" stroke-width="2"/>
<line x1="40.0" y1="58.0" x2="40.0" y2="150.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="52.0" y1="58.0" x2="52.0" y2="150.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="64.0" y1="58.0" x2="64.0" y2="150.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="76.0" y1="58.0" x2="76.0" y2="150.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="88.0" y1="58.0" x2="88.0" y2="150.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<text x="64" y="168" font-size="13" text-anchor="middle" fill="#444">columns</text>
<path d="M108,82 Q140,50 172,82" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="140" y="104" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">¼ turn</text>
<rect x="186" y="70" width="96" height="72" fill="#f4efd9" stroke="#333" stroke-width="2"/>
<line x1="186.0" y1="82.0" x2="282.0" y2="82.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="186.0" y1="94.0" x2="282.0" y2="94.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="186.0" y1="106.0" x2="282.0" y2="106.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="186.0" y1="118.0" x2="282.0" y2="118.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="186.0" y1="130.0" x2="282.0" y2="130.0" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="198.0" y1="64.0" x2="198.0" y2="148.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/>
<line x1="210.0" y1="64.0" x2="210.0" y2="148.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/>
<line x1="222.0" y1="64.0" x2="222.0" y2="148.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/>
<line x1="234.0" y1="64.0" x2="234.0" y2="148.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/>
<line x1="246.0" y1="64.0" x2="246.0" y2="148.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/>
<line x1="258.0" y1="64.0" x2="258.0" y2="148.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/>
<line x1="270.0" y1="64.0" x2="270.0" y2="148.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/>
<text x="234" y="168" font-size="13" text-anchor="middle" fill="#444">on their side: cut</text>
</g>
<g transform="translate(324,280)">
<rect x="0" y="0" width="308" height="240" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold" fill="#222">4  Cubes ⅜ in each way</text>
<text x="12" y="202" font-size="13.5" fill="#222">Then stir gently 15–20 minutes</text>
<text x="12" y="220" font-size="13.5" fill="#222">before heating (step 5).</text>
<polygon points="87.1,127.0 120.0,146.0 120.0,108.0 87.1,89.0" fill="#ebe2c2" stroke="#8a7a50" stroke-width="1.5" stroke-linejoin="round"/>
