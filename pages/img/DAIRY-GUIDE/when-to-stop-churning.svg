<text x="10" y="254" font-size="13.5" fill="#222">grainy, like</text>
<text x="10" y="272" font-size="13.5" fill="#222">cornmeal mush.</text>
<text x="10" y="290" font-size="13.5" fill="#222">Keep going, but</text>
<text x="10" y="308" font-size="13.5" fill="#222">stop and look</text>
<text x="10" y="326" font-size="13.5" fill="#222">often.</text>
