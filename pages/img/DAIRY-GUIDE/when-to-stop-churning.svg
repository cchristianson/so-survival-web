<text x="10" y="254" font-size="13.5" fill="#222">at 52–60 °F in</text>
<text x="10" y="272" font-size="13.5" fill="#222">summer, 58–66 °F</text>
<text x="10" y="290" font-size="13.5" fill="#222">in winter. Let the</text>
<text x="10" y="308" font-size="13.5" fill="#222">gas out a few times</text>
<text x="10" y="326" font-size="13.5" fill="#222">early on.</text>
</g>
