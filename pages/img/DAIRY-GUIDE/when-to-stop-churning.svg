<text x="10" y="236" font-size="13.5" fill="#222">One big lump. It</text>
<text x="10" y="254" font-size="13.5" fill="#222">traps buttermilk</text>
<text x="10" y="272" font-size="13.5" fill="#222">that won’t wash</text>
<text x="10" y="290" font-size="13.5" fill="#222">out, so the butter</text>
<text x="10" y="308" font-size="13.5" fill="#222">goes rancid sooner.</text>
