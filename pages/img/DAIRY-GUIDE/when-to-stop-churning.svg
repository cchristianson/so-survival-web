<text x="10" y="254" font-size="13.5" fill="#222">wheat in thin</text>
<text x="10" y="272" font-size="13.5" fill="#222">buttermilk, after</text>
<text x="10" y="290" font-size="13.5" fill="#222">30–40 minutes.</text>
<text x="10" y="308" font-size="13.5" fill="#222">Drain it through</text>
<text x="10" y="326" font-size="13.5" fill="#222">a strainer.</text>
