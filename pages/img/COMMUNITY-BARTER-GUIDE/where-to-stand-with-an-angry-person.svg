<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Arial, Helvetica, sans-serif">
  <title>Where to stand with an angry person, seen from above: not face to face and close, but off to the side, at an angle, a little more than a leg's length away</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>
  <rect width="640" height="420" fill="#ffffff"/>
  <line x1="320" y1="20" x2="320" y2="340" stroke="#ccc" stroke-width="1.2"/>
  <text x="160" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#b3261e">NOT LIKE THIS</text>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">LIKE THIS</text>

  <!-- wrong -->
  <g transform="translate(160,120) rotate(180)"><ellipse cx="0" cy="0" rx="32" ry="13" fill="#e7b1a8" stroke="#a3291a" stroke-width="2"/><circle cx="0" cy="-2" r="13" fill="#f0d2b4" stroke="#333" stroke-width="2"/><path d="M-7,-12 L0,-25 L7,-12 Z" fill="#333"/></g>
  <g transform="translate(160,198) rotate(0)"><line x1="20" y1="-6" x2="10" y2="-40" stroke="#333" stroke-width="3" stroke-linecap="round"/><circle cx="10" cy="-40" r="4" fill="#f0d2b4" stroke="#333" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="32" ry="13" fill="#b7cbe3" stroke="#1f5f8b" stroke-width="2"/><circle cx="0" cy="-2" r="13" fill="#f0d2b4" stroke="#333" stroke-width="2"/><path d="M-7,-12 L0,-25 L7,-12 Z" fill="#333"/></g>
  <g font-size="14" fill="#222">
    <text x="160" y="86" text-anchor="middle" fill="#a3291a" font-weight="bold">angry person</text>
    <text x="160" y="240" text-anchor="middle" fill="#1f5f8b" font-weight="bold">you</text>
    <text x="160" y="272" text-anchor="middle">face to face, toe to toe,</text>
    <text x="160" y="290" text-anchor="middle">within reach,</text>
    <text x="160" y="308" text-anchor="middle">pointing a finger</text>
  </g>

  <!-- right -->
  <g transform="translate(450,110) rotate(170)"><ellipse cx="0" cy="0" rx="32" ry="13" fill="#e7b1a8" stroke="#a3291a" stroke-width="2"/><circle cx="0" cy="-2" r="13" fill="#f0d2b4" stroke="#333" stroke-width="2"/><path d="M-7,-12 L0,-25 L7,-12 Z" fill="#333"/></g>
  <g transform="translate(552,212) rotate(-20)"><circle cx="-16" cy="-24" r="6" fill="#f0d2b4" stroke="#333" stroke-width="1.5"/><circle cx="16" cy="-24" r="6" fill="#f0d2b4" stroke="#333" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="32" ry="13" fill="#b7cbe3" stroke="#1f5f8b" stroke-width="2"/><circle cx="0" cy="-2" r="13" fill="#f0d2b4" stroke="#333" stroke-width="2"/><path d="M-7,-12 L0,-25 L7,-12 Z" fill="#333"/></g>
  <g transform="translate(372,238) rotate(30)"><circle cx="-16" cy="-24" r="6" fill="#f0d2b4" stroke="#333" stroke-width="1.5"/><circle cx="16" cy="-24" r="6" fill="#f0d2b4" stroke="#333" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="32" ry="13" fill="#cfe0cf" stroke="#2e7d32" stroke-width="2"/><circle cx="0" cy="-2" r="13" fill="#f0d2b4" stroke="#333" stroke-width="2"/><path d="M-7,-12 L0,-25 L7,-12 Z" fill="#333"/></g>
  <line x1="466" y1="126" x2="536" y2="196" stroke="#333" stroke-width="1.6" stroke-dasharray="6 4" marker-start="url(#a)" marker-end="url(#a)"/>
  <g font-size="14" fill="#222">
    <text x="450" y="76" text-anchor="middle" fill="#a3291a" font-weight="bold">angry person</text>
    <text x="552" y="252" text-anchor="middle" fill="#1f5f8b" font-weight="bold">you</text>
    <text x="510" y="146">a bit more than</text>
    <text x="510" y="163">a leg's length</text>
    <text x="616" y="282" text-anchor="end">off to the side, at an angle,</text>
    <text x="616" y="299" text-anchor="end">hands open and in view</text>
    <text x="372" y="280" text-anchor="middle" fill="#2e7d32" font-weight="bold">a second</text>
    <text x="372" y="297" text-anchor="middle" fill="#2e7d32" font-weight="bold">calm person</text>
  </g>
  <line x1="20" y1="344" x2="620" y2="344" stroke="#ccc" stroke-width="1.2"/>
  <text x="320" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Slow, calm voice. Listen. Never touch a hostile person.</text>
  <text x="320" y="392" text-anchor="middle" font-size="15" fill="#222">Move onlookers away and send one for help.</text>
  <text x="320" y="414" text-anchor="middle" font-size="13" fill="#555">Seen from above; the small point shows which way each person faces.</text>
</svg>
