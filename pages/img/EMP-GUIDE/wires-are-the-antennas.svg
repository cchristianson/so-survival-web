<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Arial, Helvetica, sans-serif">
  <title>Long wires carry the pulse in: a radio plugged into power and an outdoor antenna, versus one unplugged at the radio</title>
  <rect width="640" height="420" fill="#ffffff"/>
  <defs>
    <marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c0392b"/></marker>
    <g id="radio">
      <rect x="0" y="0" width="110" height="70" rx="8" fill="#30343a"/>
      <circle cx="30" cy="35" r="18" fill="#555" stroke="#888" stroke-width="2"/>
      <rect x="58" y="16" width="40" height="18" rx="2" fill="#9fc1a8"/>
      <circle cx="68" cy="50" r="5" fill="#888"/><circle cx="88" cy="50" r="5" fill="#888"/>
    </g>
  </defs>
  <line x1="320" y1="15" x2="320" y2="345" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== LEFT: connected ===== -->
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#a12a1c">Plugged in: the wires</text>
  <text x="20" y="50" font-size="16" font-weight="bold" fill="#a12a1c">bring the pulse in</text>
  <!-- antenna mast and coax -->
  <line x1="250" y1="70" x2="250" y2="140" stroke="#555" stroke-width="4"/>
  <line x1="225" y1="78" x2="275" y2="78" stroke="#555" stroke-width="4"/><line x1="232" y1="92" x2="268" y2="92" stroke="#555" stroke-width="4"/>
  <path d="M250,140 L250,250 L170,250" fill="none" stroke="#222" stroke-width="4"/>
  <text x="258" y="200" font-size="13" fill="#222">coax from an</text>
  <text x="258" y="216" font-size="13" fill="#222">outdoor</text>
  <text x="258" y="232" font-size="13" fill="#222">antenna</text>
  <!-- power cord to the wall -->
  <rect x="20" y="300" width="22" height="34" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M42,317 C90,317 70,270 60,270" fill="none" stroke="#222" stroke-width="4"/>
  <text x="20" y="360" font-size="13" fill="#222">wall outlet: miles</text>
  <text x="20" y="376" font-size="13" fill="#222">of power line behind it</text>
  <use href="#radio" x="60" y="220"/>
  <!-- surges -->
  <g stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#z)">
    <path d="M262,110 l-8,10 l10,4 l-8,12"/>
    <path d="M232,252 l-10,-8 l-4,10 l-12,-6"/>
    <path d="M30,294 l6,-10 l6,8 l6,-12"/>
  </g>

  <!-- ===== RIGHT: unplugged at the device ===== -->
  <text x="340" y="32" font-size="16" font-weight="bold" fill="#1b5e20">Unplugged at the radio:</text>
  <text x="340" y="50" font-size="16" font-weight="bold" fill="#1b5e20">mostly survives</text>
  <use href="#radio" x="440" y="220"/>
  <!-- coiled cords, disconnected -->
  <g fill="none" stroke="#222" stroke-width="3">
    <circle cx="380" cy="300" r="14"/><circle cx="386" cy="300" r="14"/><circle cx="392" cy="300" r="14"/>
  </g>
  <line x1="406" y1="300" x2="420" y2="288" stroke="#222" stroke-width="3"/>
  <text x="340" y="258" font-size="13" fill="#222">cord pulled out</text>
  <text x="340" y="274" font-size="13" fill="#222">and coiled</text>
  <path d="M600,160 L600,205" fill="none" stroke="#222" stroke-width="4"/>
  <circle cx="600" cy="208" r="5" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="595" y="150" text-anchor="end" font-size="13" fill="#222">coax unscrewed</text>
  <text x="490" y="320" text-anchor="middle" font-size="13" fill="#222">batteries out</text>
  <text x="490" y="336" text-anchor="middle" font-size="13" fill="#222">if it's being stored</text>

  <rect x="15" y="380" width="610" height="34" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
  <text x="320" y="402" text-anchor="middle" font-size="13.5" fill="#222">Unplug power, data and antenna cables at the device, not just at the wall.</text>
</svg>
