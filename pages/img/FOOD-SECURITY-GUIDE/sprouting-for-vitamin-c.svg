<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Arial, Helvetica, sans-serif">
  <title>Sprouting beans or grain for vitamin C in three steps</title>
  <rect width="640" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#555"/></marker>
  </defs>

  <!-- step headings -->
  <g font-size="15" fill="#222">
    <text x="16" y="30" font-weight="bold">1 Soak</text>
    <text x="16" y="50">whole beans, peas,</text>
    <text x="16" y="68">lentils or wheat</text>
    <text x="16" y="86" font-weight="bold">12–21 hours</text>

    <text x="228" y="30" font-weight="bold">2 Drain and spread</text>
    <text x="228" y="50">between damp cloths.</text>
    <text x="228" y="68">Keep them damp.</text>

    <text x="440" y="30" font-weight="bold">3 Eat when shoots</text>
    <text x="440" y="50">are ½–1 inch long</text>
    <text x="440" y="68" font-weight="bold">(30–48 hours)</text>
  </g>

  <!-- 1: jar of soaking seed -->
  <path d="M60,120 L60,270 C60,282 70,288 82,288 L138,288 C150,288 160,282 160,270 L160,120" fill="#e3f0f7" stroke="#3d6f8e" stroke-width="3"/>
  <rect x="54" y="108" width="112" height="14" rx="3" fill="#ffffff" stroke="#3d6f8e" stroke-width="3"/>
  <rect x="62" y="150" width="96" height="2" fill="#7fb0cc"/>
  <g fill="#d9b36a" stroke="#8f6d2c" stroke-width="1.2">
    <ellipse cx="80" cy="270" rx="9" ry="6"/><ellipse cx="100" cy="274" rx="9" ry="6"/><ellipse cx="120" cy="272" rx="9" ry="6"/><ellipse cx="140" cy="270" rx="9" ry="6"/>
    <ellipse cx="90" cy="258" rx="9" ry="6"/><ellipse cx="110" cy="260" rx="9" ry="6"/><ellipse cx="130" cy="257" rx="9" ry="6"/>
    <ellipse cx="100" cy="246" rx="9" ry="6"/><ellipse cx="122" cy="245" rx="9" ry="6"/>
  </g>
  <text x="110" y="316" text-anchor="middle" font-size="13" fill="#444">Unsplit seed only</text>

  <line x1="178" y1="200" x2="214" y2="200" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 2: seeds between damp cloths on a tray -->
  <rect x="232" y="232" width="176" height="14" fill="#c9c2b4" stroke="#6e6658" stroke-width="2"/>
  <rect x="236" y="216" width="168" height="16" rx="3" fill="#b8d4e3" stroke="#3d6f8e" stroke-width="2"/>
  <g fill="#d9b36a" stroke="#8f6d2c" stroke-width="1.2">
    <ellipse cx="256" cy="208" rx="9" ry="6"/><ellipse cx="280" cy="209" rx="9" ry="6"/><ellipse cx="304" cy="208" rx="9" ry="6"/><ellipse cx="328" cy="209" rx="9" ry="6"/><ellipse cx="352" cy="208" rx="9" ry="6"/><ellipse cx="376" cy="209" rx="9" ry="6"/>
  </g>
  <path d="M236,200 C280,190 360,190 404,200 L404,190 C360,180 280,180 236,190 Z" fill="#b8d4e3" stroke="#3d6f8e" stroke-width="2"/>
  <text x="320" y="176" text-anchor="middle" font-size="13" fill="#444">damp cloth</text>
  <text x="320" y="268" text-anchor="middle" font-size="13" fill="#444">damp cloth underneath</text>

  <line x1="414" y1="200" x2="436" y2="200" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 3: sprouted seeds with ruler -->
  <g>
    <ellipse cx="480" cy="240" rx="11" ry="7" fill="#d9b36a" stroke="#8f6d2c" stroke-width="1.2"/>
    <path d="M490,238 C510,232 520,226 528,214" fill="none" stroke="#7aa63a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="545" cy="262" rx="11" ry="7" fill="#d9b36a" stroke="#8f6d2c" stroke-width="1.2"/>
    <path d="M555,260 C578,256 594,248 604,234" fill="none" stroke="#7aa63a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="500" cy="282" rx="11" ry="7" fill="#d9b36a" stroke="#8f6d2c" stroke-width="1.2"/>
    <path d="M510,280 C525,276 535,270 540,262" fill="none" stroke="#7aa63a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- inch ruler -->
  <rect x="470" y="140" width="130" height="26" fill="#fff6d6" stroke="#8a7a3a" stroke-width="1.5"/>
  <g stroke="#8a7a3a" stroke-width="1.5">
    <line x1="480" y1="140" x2="480" y2="160"/><line x1="530" y1="140" x2="530" y2="152"/><line x1="580" y1="140" x2="580" y2="160"/>
  </g>
  <text x="480" y="182" text-anchor="middle" font-size="13" fill="#444">0</text>
  <text x="530" y="182" text-anchor="middle" font-size="13" fill="#444">½</text>
  <text x="580" y="182" text-anchor="middle" font-size="13" fill="#444">1 in</text>
  <text x="528" y="316" text-anchor="middle" font-size="13" fill="#444">The shoot holds the vitamin C</text>

  <rect x="16" y="328" width="608" height="26" rx="5" fill="#f4efe4" stroke="#b9a98a"/>
  <text x="320" y="346" text-anchor="middle" font-size="14" fill="#222">Eat raw, or cooked under 30 minutes. 1½–2 oz of dry seed per person a day is enough.</text>
</svg>
