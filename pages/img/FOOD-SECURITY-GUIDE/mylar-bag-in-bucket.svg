<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Arial, Helvetica, sans-serif">
  <title>Grain packed in a Mylar bag with an oxygen absorber, inside a plastic bucket</title>
  <rect width="640" height="470" fill="#ffffff"/>

  <!-- bucket, cut away -->
  <path d="M60,92 L80,400 L280,400 L300,92" fill="#f2f2f2" stroke="#2f5d8a" stroke-width="4"/>
  <rect x="48" y="74" width="264" height="18" rx="4" fill="#2f5d8a"/>
  <!-- Mylar bag -->
  <path d="M120,112 C100,116 82,120 78,128 L94,388 L266,388 L282,128 C278,120 260,116 240,112 Z" fill="#cfd3d8" stroke="#6d747c" stroke-width="3"/>
  <!-- bag top gathered and sealed -->
  <rect x="118" y="104" width="124" height="10" fill="#8d949c" stroke="#5a6067" stroke-width="1.5"/>
  <!-- grain -->
  <path d="M86,160 L97,382 L263,382 L274,160 Z" fill="#e8cf8f"/>
  <g fill="#c9a95a">
    <circle cx="110" cy="190" r="3"/><circle cx="140" cy="210" r="3"/><circle cx="180" cy="185" r="3"/><circle cx="220" cy="205" r="3"/><circle cx="250" cy="190" r="3"/>
    <circle cx="120" cy="250" r="3"/><circle cx="160" cy="270" r="3"/><circle cx="200" cy="245" r="3"/><circle cx="240" cy="265" r="3"/>
    <circle cx="125" cy="320" r="3"/><circle cx="170" cy="340" r="3"/><circle cx="210" cy="315" r="3"/><circle cx="245" cy="345" r="3"/><circle cx="140" cy="365" r="3"/><circle cx="200" cy="370" r="3"/>
  </g>
  <!-- oxygen absorber packet on top of the grain -->
  <rect x="160" y="146" width="44" height="26" rx="3" fill="#ffffff" stroke="#b03a2e" stroke-width="2.5"/>
  <text x="182" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a2e">O₂</text>

  <!-- labels -->
  <g font-size="14" fill="#222">
    <line x1="300" y1="83" x2="340" y2="70" stroke="#333" stroke-width="1.2"/>
    <text x="346" y="66" font-weight="bold">Plastic bucket</text>
    <text x="346" y="83">keeps rats out, but lets</text>
    <text x="346" y="99">oxygen in slowly</text>

    <line x1="244" y1="109" x2="340" y2="130" stroke="#333" stroke-width="1.2"/>
    <text x="346" y="128" font-weight="bold">Bag sealed shut,</text>
    <text x="346" y="145">labeled with contents and date</text>

    <line x1="206" y1="160" x2="340" y2="178" stroke="#333" stroke-width="1.2"/>
    <text x="346" y="176" font-weight="bold">Oxygen absorber,</text>
    <text x="346" y="193">2,000 cc for a 5-gallon bucket</text>

    <line x1="279" y1="230" x2="340" y2="228" stroke="#333" stroke-width="1.2"/>
    <text x="346" y="226" font-weight="bold">Mylar or foil bag inside</text>
    <text x="346" y="243">the bucket: oxygen-tight</text>

    <line x1="240" y1="300" x2="340" y2="284" stroke="#333" stroke-width="1.2"/>
    <text x="346" y="280" font-weight="bold">Dry food only:</text>
    <text x="346" y="297">under 10% moisture</text>
  </g>

  <!-- absorber sizes -->
  <rect x="346" y="320" width="276" height="108" rx="6" fill="#f6f3ec" stroke="#b9a98a"/>
  <text x="358" y="342" font-size="14" font-weight="bold" fill="#222">Absorber size</text>
  <g font-size="14" fill="#222">
    <text x="358" y="364">Quart jar</text><text x="610" y="364" text-anchor="end">100 cc</text>
    <text x="358" y="386">Gallon bag or #10 can</text><text x="610" y="386" text-anchor="end">300 cc</text>
    <text x="358" y="408">5-gallon bucket</text><text x="610" y="408" text-anchor="end" font-weight="bold">2,000 cc</text>
  </g>

  <text x="20" y="440" font-size="14" fill="#222">Work fast: an opened pack of absorbers is spent in about 5 hours.</text>
  <text x="20" y="460" font-size="14" fill="#b03a2e" font-weight="bold">Never moist food: botulism.</text>
</svg>
