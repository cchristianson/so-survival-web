<svg xmlns="http://www.w3.org/2000/svg" width="640" height="790" viewBox="0 0 640 790" font-family="Arial, Helvetica, sans-serif">
<title>Five steps to a strong thigh and knee: tighten the thigh, straight-leg raise, the raise with a sandbag, the raise sitting up, and lifting the foot over a rolled blanket</title>
<rect width="640" height="790" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker></defs>
<g transform="translate(8,8)">
<rect x="0" y="0" width="308" height="252" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="12" y="25" font-size="16" font-weight="bold" fill="#222">1  Tighten, don’t move</text>
<text x="12" y="186" font-size="14" fill="#222">Lying, tighten the top of the thigh;</text>
<text x="12" y="205" font-size="14" fill="#222">the knee stays still. Count 25,</text>
<text x="12" y="224" font-size="14" fill="#222">10 times, 3–4 times a day. After a</text>
<text x="12" y="243" font-size="14" fill="#222">few days, do it sitting too.</text>
<line x1="16" y1="152" x2="292" y2="152" stroke="#999" stroke-width="2" stroke-linecap="round"/>
<line x1="150" y1="141" x2="207" y2="143" stroke="#a3a3a3" stroke-width="10" stroke-linecap="round"/>
<line x1="207" y1="143" x2="260" y2="144" stroke="#a3a3a3" stroke-width="9" stroke-linecap="round"/>
<line x1="260" y1="144" x2="265" y2="130" stroke="#a3a3a3" stroke-width="7" stroke-linecap="round"/>
<line x1="58" y1="136" x2="150" y2="139" stroke="#5b5b5b" stroke-width="18" stroke-linecap="round"/>
<circle cx="38" cy="132" r="14" fill="#5b5b5b"/>
<line x1="66" y1="141" x2="116" y2="145" stroke="#8a8a8a" stroke-width="7" stroke-linecap="round"/>
<line x1="150" y1="139" x2="208" y2="138" stroke="#e07b00" stroke-width="11" stroke-linecap="round"/>
<line x1="208" y1="138" x2="262" y2="137" stroke="#2f5f8a" stroke-width="10" stroke-linecap="round"/>
<line x1="262" y1="137" x2="262" y2="122" stroke="#2f5f8a" stroke-width="8" stroke-linecap="round"/>
<line x1="180" y1="132" x2="168" y2="79" stroke="#555" stroke-width="1.2"/>
<text x="166" y="84" font-size="13" text-anchor="end" fill="#333">tighten here</text>
<line x1="210" y1="134" x2="198" y2="99" stroke="#555" stroke-width="1.2"/>
<text x="200" y="104" font-size="13" fill="#333">knee stays down</text>
</g>
<g transform="translate(324,8)">
<rect x="0" y="0" width="308" height="252" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="12" y="25" font-size="16" font-weight="bold" fill="#222">2  Straight-leg raise</text>
<text x="12" y="186" font-size="14" fill="#222">Tighten, lift the straight leg,</text>
<text x="12" y="205" font-size="14" fill="#222">count 5–10, lower slowly.</text>
<text x="12" y="224" font-size="14" fill="#222">Repeat until the leg shakes.</text>
<line x1="16" y1="152" x2="292" y2="152" stroke="#999" stroke-width="2" stroke-linecap="round"/>
<line x1="150" y1="141" x2="207" y2="143" stroke="#a3a3a3" stroke-width="10" stroke-linecap="round"/>
<line x1="207" y1="143" x2="260" y2="144" stroke="#a3a3a3" stroke-width="9" stroke-linecap="round"/>
<line x1="260" y1="144" x2="265" y2="130" stroke="#a3a3a3" stroke-width="7" stroke-linecap="round"/>
<line x1="58" y1="136" x2="150" y2="139" stroke="#5b5b5b" stroke-width="18" stroke-linecap="round"/>
<circle cx="38" cy="132" r="14" fill="#5b5b5b"/>
<line x1="66" y1="141" x2="116" y2="145" stroke="#8a8a8a" stroke-width="7" stroke-linecap="round"/>
<line x1="150" y1="138" x2="200" y2="109" stroke="#e07b00" stroke-width="11" stroke-linecap="round"/>
<line x1="200" y1="109" x2="247" y2="82" stroke="#2f5f8a" stroke-width="10" stroke-linecap="round"/>
<line x1="247" y1="82" x2="239" y2="69" stroke="#2f5f8a" stroke-width="8" stroke-linecap="round"/>
<line x1="196.22947341949745" y1="101.0" x2="114" y2="69" stroke="#555" stroke-width="1.2"/>
<text x="112" y="74" font-size="13" text-anchor="end" fill="#333">knee straight</text>
<path d="M 284 128 Q 292 100 268 76" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
</g>
<g transform="translate(8,268)">
<rect x="0" y="0" width="308" height="252" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="12" y="25" font-size="16" font-weight="bold" fill="#222">3  Add a sandbag at the ankle</text>
<text x="12" y="186" font-size="14" fill="#222">½ kg, then 1, then 1½ kg. Go up</text>
<text x="12" y="205" font-size="14" fill="#222">only when the knee does not</text>
<text x="12" y="224" font-size="14" fill="#222">bend at all.</text>
<line x1="16" y1="152" x2="292" y2="152" stroke="#999" stroke-width="2" stroke-linecap="round"/>
<line x1="150" y1="141" x2="207" y2="143" stroke="#a3a3a3" stroke-width="10" stroke-linecap="round"/>
<line x1="207" y1="143" x2="260" y2="144" stroke="#a3a3a3" stroke-width="9" stroke-linecap="round"/>
<line x1="260" y1="144" x2="265" y2="130" stroke="#a3a3a3" stroke-width="7" stroke-linecap="round"/>
<line x1="58" y1="136" x2="150" y2="139" stroke="#5b5b5b" stroke-width="18" stroke-linecap="round"/>
<circle cx="38" cy="132" r="14" fill="#5b5b5b"/>
<line x1="66" y1="141" x2="116" y2="145" stroke="#8a8a8a" stroke-width="7" stroke-linecap="round"/>
<line x1="150" y1="138" x2="200" y2="109" stroke="#e07b00" stroke-width="11" stroke-linecap="round"/>
<line x1="200" y1="109" x2="247" y2="82" stroke="#2f5f8a" stroke-width="10" stroke-linecap="round"/>
<line x1="247" y1="82" x2="239" y2="69" stroke="#2f5f8a" stroke-width="8" stroke-linecap="round"/>
<rect x="224" y="78" width="26" height="20" rx="5" fill="#b8925a" stroke="#6e5530" stroke-width="2" transform="rotate(-30 237 88)"/>
<line x1="232.99484522385714" y1="68.0" x2="210" y2="51" stroke="#555" stroke-width="1.2"/>
<text x="208" y="56" font-size="13" text-anchor="end" fill="#333">sandbag</text>
</g>
<g transform="translate(324,268)">
<rect x="0" y="0" width="308" height="252" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="12" y="25" font-size="16" font-weight="bold" fill="#222">4  The same raise, sitting up</text>
<text x="12" y="186" font-size="14" fill="#222">Build up to 5 kg (11 lb).</text>
<text x="12" y="205" font-size="14" fill="#222">Skip this one if the hip</text>
<text x="12" y="224" font-size="14" fill="#222">is sore or tight.</text>
<line x1="16" y1="152" x2="292" y2="152" stroke="#999" stroke-width="2" stroke-linecap="round"/>
<line x1="120" y1="143" x2="180" y2="145" stroke="#a3a3a3" stroke-width="10" stroke-linecap="round"/>
<line x1="180" y1="145" x2="232" y2="146" stroke="#a3a3a3" stroke-width="9" stroke-linecap="round"/>
<line x1="232" y1="146" x2="237" y2="132" stroke="#a3a3a3" stroke-width="7" stroke-linecap="round"/>
<line x1="120" y1="140" x2="95" y2="70" stroke="#5b5b5b" stroke-width="18" stroke-linecap="round"/>
<circle cx="86" cy="48" r="14" fill="#5b5b5b"/>
<line x1="97" y1="76" x2="64" y2="147" stroke="#8a8a8a" stroke-width="7" stroke-linecap="round"/>
<line x1="120" y1="140" x2="173" y2="115" stroke="#e07b00" stroke-width="11" stroke-linecap="round"/>
<line x1="173" y1="115" x2="222" y2="93" stroke="#2f5f8a" stroke-width="10" stroke-linecap="round"/>
<line x1="222" y1="93" x2="215" y2="79" stroke="#2f5f8a" stroke-width="8" stroke-linecap="round"/>
<rect x="198" y="88" width="26" height="20" rx="5" fill="#b8925a" stroke="#6e5530" stroke-width="2" transform="rotate(-25 211 98)"/>
<line x1="207.5064721481048" y1="80.66675468504167" x2="192" y2="57" stroke="#555" stroke-width="1.2"/>
<text x="190" y="62" font-size="13" text-anchor="end" fill="#333">sandbag</text>
</g>
<g transform="translate(8,528)">
<rect x="0" y="0" width="308" height="252" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="12" y="25" font-size="16" font-weight="bold" fill="#222">5  Roll under the knee</text>
<text x="12" y="186" font-size="14" fill="#222">Lift the foot until the knee is</text>
<text x="12" y="205" font-size="14" fill="#222">straight; the thigh stays on the</text>
<text x="12" y="224" font-size="14" fill="#222">roll. 10–30 times, building up</text>
<text x="12" y="243" font-size="14" fill="#222">to 5 kg.</text>
<line x1="16" y1="152" x2="292" y2="152" stroke="#999" stroke-width="2" stroke-linecap="round"/>
<line x1="150" y1="141" x2="207" y2="143" stroke="#a3a3a3" stroke-width="10" stroke-linecap="round"/>
<line x1="207" y1="143" x2="260" y2="144" stroke="#a3a3a3" stroke-width="9" stroke-linecap="round"/>
<line x1="260" y1="144" x2="265" y2="130" stroke="#a3a3a3" stroke-width="7" stroke-linecap="round"/>
<line x1="58" y1="136" x2="150" y2="139" stroke="#5b5b5b" stroke-width="18" stroke-linecap="round"/>
<circle cx="38" cy="132" r="14" fill="#5b5b5b"/>
<line x1="66" y1="141" x2="116" y2="145" stroke="#8a8a8a" stroke-width="7" stroke-linecap="round"/>
<circle cx="206" cy="139" r="13" fill="#d8c49a" stroke="#8a7346" stroke-width="2"/>
<line x1="206" y1="124" x2="253" y2="146" stroke="#8fa9c0" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="253" y1="146" x2="260" y2="133" stroke="#8fa9c0" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="150" y1="138" x2="206" y2="124" stroke="#e07b00" stroke-width="11" stroke-linecap="round"/>
<line x1="206" y1="124" x2="258" y2="111" stroke="#2f5f8a" stroke-width="10" stroke-linecap="round"/>
<line x1="258" y1="111" x2="255" y2="96" stroke="#2f5f8a" stroke-width="8" stroke-linecap="round"/>
<path d="M 276 140 Q 288 124 272 108" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="176" y1="128" x2="146" y2="93" stroke="#555" stroke-width="1.2"/>
<text x="144" y="98" font-size="13" text-anchor="end" fill="#333">thigh stays down</text>
<line x1="252.38769500784792" y1="96.90307624803802" x2="206" y2="61" stroke="#555" stroke-width="1.2"/>
<text x="204" y="66" font-size="13" text-anchor="end" fill="#333">only the foot lifts</text>
</g>
<g transform="translate(324,528)">
<rect x="0" y="0" width="308" height="252" rx="8" fill="#fff6e8" stroke="#e0b46a" stroke-width="1.5"/>
<text x="12" y="25" font-size="16" font-weight="bold" fill="#222">The rules</text>
<text x="12" y="52" font-size="14" fill="#222">• One step at a time: move up</text>
<text x="12" y="72" font-size="14" fill="#222">  only when the knee stays straight.</text>
<text x="12" y="92" font-size="14" fill="#222">• Adults start with what they can lift</text>
<text x="12" y="112" font-size="14" fill="#222">  10 times cleanly, about 1–2 kg</text>
<text x="12" y="132" font-size="14" fill="#222">  (2–5 lb).</text>
<text x="12" y="152" font-size="14" fill="#222">• The joint hurts more: less weight,</text>
<text x="12" y="172" font-size="14" fill="#222">  fewer times.</text>
<text x="12" y="192" font-size="14" font-weight="bold" fill="#222">• Severe pain: stop.</text>
<line x1="20" y1="222" x2="48" y2="222" stroke="#e07b00" stroke-width="11" stroke-linecap="round"/>
<text x="58" y="227" font-size="14" fill="#222">= the muscle you tighten</text>
</g>
</svg>
