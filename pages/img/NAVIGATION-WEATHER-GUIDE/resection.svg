<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="Arial, Helvetica, sans-serif">
  <title>Resection: lines drawn back from three known peaks cross where you are</title>
  <rect width="640" height="500" fill="#ffffff"/>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <!-- map sheet -->
  <rect x="10" y="10" width="620" height="335" fill="#f7f4ec" stroke="#8a7d68" stroke-width="2"/>

  <!-- back-bearing lines, each drawn from its peak -->
  <g stroke="#2d5f8a" stroke-width="3" fill="none">
    <line x1="96" y1="96" x2="336.8" y2="316.9"/>
    <line x1="534" y1="76" x2="266.6" y2="312.2"/>
    <line x1="600" y1="251" x2="248.2" y2="286"/>
  </g>

  <!-- peaks -->
  <g fill="#6b6359" stroke="#3d362e" stroke-width="1.5">
    <polygon points="96,74 80,100 112,100"/>
    <polygon points="534,54 518,80 550,80"/>
    <polygon points="600,229 584,255 616,255"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#222">
    <text x="120" y="80">Peak A</text>
    <text x="440" y="62">Peak B</text>
    <text x="540" y="222">Peak C</text>
  </g>

  <!-- you -->
  <circle cx="300" cy="281" r="16" fill="none" stroke="#b03a2e" stroke-width="3"/>
  <text x="300" y="334" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a2e">YOU ARE HERE</text>
  <text x="200" y="262" text-anchor="end" font-size="13.5" fill="#333">Three lines make a small</text>
  <text x="200" y="279" text-anchor="end" font-size="13.5" fill="#333">triangle: you are inside it.</text>
  <line x1="206" y1="272" x2="282" y2="279" stroke="#333" stroke-width="1.2"/>

  <!-- north arrow -->
  <line x1="40" y1="200" x2="40" y2="140" stroke="#222" stroke-width="3" marker-end="url(#n)"/>
  <text x="40" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">N</text>
  <text x="56" y="190" font-size="12.5" fill="#333">map turned</text>
  <text x="56" y="205" font-size="12.5" fill="#333">to the land</text>

  <!-- steps -->
  <g font-size="15" fill="#222">
    <text x="20" y="375"><tspan font-weight="bold">1.</tspan> Orient the map.</text>
    <text x="20" y="399"><tspan font-weight="bold">2.</tspan> Take a compass bearing to each peak you can name on the map.</text>
    <text x="20" y="423"><tspan font-weight="bold">3.</tspan> Add 14° (unless your compass is set), then add or subtract 180°.</text>
    <text x="20" y="447"><tspan font-weight="bold">4.</tspan> Draw each line back from its peak. Where they cross is you.</text>
    <text x="20" y="478" font-size="13" fill="#555">Seen from above. Two lines will do; a third checks them.</text>
  </g>
</svg>
