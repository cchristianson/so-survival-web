<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Arial, Helvetica, sans-serif">
  <title>Why a hand pump at the surface can't lift fuel from a deep tank, and why a pump lowered into the tank can</title>
  <rect width="640" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <marker id="up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#1b5e20"/></marker>
  </defs>

  <!-- ground -->
  <rect x="0" y="150" width="640" height="250" fill="#ece5d3"/>
  <rect x="0" y="140" width="640" height="10" fill="#a9a9a9"/>
  <line x1="320" y1="20" x2="320" y2="455" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== LEFT: suction from the top ===== -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#a12a1c">Hand or 12 V pump at the top</text>
  <text x="20" y="48" font-size="13" fill="#222">sucks air when the fuel is far down</text>
  <!-- tank section -->
  <rect x="40" y="250" width="230" height="140" rx="20" fill="#e9eef3" stroke="#333" stroke-width="2.5"/>
  <rect x="42" y="330" width="226" height="58" rx="18" fill="#f3d58a"/>
  <!-- pump on top -->
  <rect x="85" y="100" width="40" height="40" rx="4" fill="#f5c542" stroke="#333" stroke-width="2"/>
  <line x1="125" y1="110" x2="155" y2="95" stroke="#333" stroke-width="4"/>
  <line x1="103" y1="140" x2="103" y2="345" stroke="#555" stroke-width="5"/>
  <!-- 10 ft limit -->
  <line x1="185" y1="152" x2="185" y2="288" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="95" y1="290" x2="200" y2="290" stroke="#a12a1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="192" y="205" font-size="14" font-weight="bold" fill="#222">10 ft</text>
  <text x="192" y="222" font-size="13" fill="#222">or less</text>
  <text x="208" y="305" font-size="13" fill="#a12a1c" font-weight="bold">lift stops</text>
  <text x="80" y="360" font-size="13" fill="#6b4f0a" font-weight="bold">fuel, out of reach</text>
  <g font-size="13" fill="#222">
    <text x="20" y="420">Less on a hot afternoon: gasoline</text>
    <text x="20" y="437">boils in the hose. Works only while</text>
    <text x="20" y="454">the tank is fairly full.</text>
  </g>

  <!-- ===== RIGHT: pump down in the tank ===== -->
  <text x="335" y="30" font-size="16" font-weight="bold" fill="#1b5e20">Pump lowered INTO the tank</text>
  <text x="335" y="48" font-size="13" fill="#222">pushes the fuel up instead of sucking it</text>
  <rect x="360" y="250" width="230" height="140" rx="20" fill="#e9eef3" stroke="#333" stroke-width="2.5"/>
  <rect x="362" y="330" width="226" height="58" rx="18" fill="#f3d58a"/>
  <rect x="362" y="376" width="226" height="12" rx="6" fill="#9cc3e4"/>
  <!-- submersible pump -->
  <rect x="412" y="340" width="20" height="30" rx="4" fill="#555" stroke="#222" stroke-width="1.5"/>
  <path d="M422,340 L422,150 L422,120 C422,100 460,95 500,110" fill="none" stroke="#1b5e20" stroke-width="5" marker-end="url(#up)"/>
  <!-- metal can on the ground -->
  <rect x="500" y="100" width="44" height="40" rx="3" fill="#c0392b" stroke="#333" stroke-width="2"/>
  <text x="522" y="72" text-anchor="middle" font-size="13" fill="#222">metal can,</text>
  <text x="522" y="92" text-anchor="middle" font-size="13" fill="#222">on the ground</text>
  <text x="440" y="300" font-size="13" fill="#222">12 V submersible</text>
  <text x="440" y="316" font-size="13" fill="#222">pump rated for gasoline</text>
  <text x="440" y="350" font-size="13" fill="#222">a few inches</text>
  <text x="440" y="365" font-size="13" fill="#222">off the bottom</text>
  <g font-size="13" fill="#222">
    <text x="335" y="420">Keep it off the water and sludge.</text>
    <text x="335" y="437">Bond everything; filter through a</text>
    <text x="335" y="454">water-separating funnel.</text>
  </g>
</svg>
