<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" font-family="Arial, Helvetica, sans-serif">
  <title>Nine men's morris: the board, a mill, a move, and the four rules</title>
  <rect width="640" height="600" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b03a2e"/></marker></defs>

  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Nine men's morris</text>

  <!-- a mill highlighted along the top outer line -->
  <rect x="134" y="50" width="372" height="30" rx="15" fill="#f6e7b0" stroke="#c9a227" stroke-width="1.5"/>
  <text x="514" y="61" font-size="13" fill="#222">a mill:</text>
  <text x="514" y="77" font-size="13" fill="#222">3 in a row</text>

  <!-- the board: three squares joined at their middles -->
  <g fill="none" stroke="#333" stroke-width="3">
    <rect x="150" y="65" width="340" height="340"/>
    <rect x="205" y="120" width="230" height="230"/>
    <rect x="260" y="175" width="120" height="120"/>
    <line x1="320" y1="65" x2="320" y2="175"/>
    <line x1="320" y1="295" x2="320" y2="405"/>
    <line x1="150" y1="235" x2="260" y2="235"/>
    <line x1="380" y1="235" x2="490" y2="235"/>
  </g>

  <!-- the 24 points -->
  <g fill="#ffffff" stroke="#333" stroke-width="2">
    <circle cx="150" cy="65" r="6"/><circle cx="320" cy="65" r="6"/><circle cx="490" cy="65" r="6"/>
    <circle cx="150" cy="235" r="6"/><circle cx="490" cy="235" r="6"/>
    <circle cx="150" cy="405" r="6"/><circle cx="320" cy="405" r="6"/><circle cx="490" cy="405" r="6"/>
    <circle cx="205" cy="120" r="6"/><circle cx="320" cy="120" r="6"/><circle cx="435" cy="120" r="6"/>
    <circle cx="205" cy="235" r="6"/><circle cx="435" cy="235" r="6"/>
    <circle cx="205" cy="350" r="6"/><circle cx="320" cy="350" r="6"/><circle cx="435" cy="350" r="6"/>
    <circle cx="260" cy="175" r="6"/><circle cx="320" cy="175" r="6"/><circle cx="380" cy="175" r="6"/>
    <circle cx="260" cy="235" r="6"/><circle cx="380" cy="235" r="6"/>
    <circle cx="260" cy="295" r="6"/><circle cx="320" cy="295" r="6"/><circle cx="380" cy="295" r="6"/>
  </g>

  <!-- dark stones: a mill on top, one about to move -->
  <g fill="#333" stroke="#111" stroke-width="2">
    <circle cx="150" cy="65" r="13"/><circle cx="320" cy="65" r="13"/><circle cx="490" cy="65" r="13"/>
    <circle cx="435" cy="235" r="13"/>
  </g>
  <!-- light stones -->
  <g fill="#ffffff" stroke="#333" stroke-width="3">
    <circle cx="205" cy="235" r="13"/><circle cx="435" cy="120" r="13"/>
    <circle cx="260" cy="295" r="13"/><circle cx="320" cy="350" r="13"/>
  </g>

  <!-- a move: one step along a line to an empty point -->
  <line x1="435" y1="252" x2="435" y2="334" stroke="#b03a2e" stroke-width="3" marker-end="url(#a)"/>
  <text x="502" y="290" font-size="13" fill="#b03a2e">move one step</text>
  <text x="502" y="306" font-size="13" fill="#b03a2e">along a line</text>

  <!-- the rules -->
  <g font-size="15" fill="#222">
    <text x="24" y="444">1. Take turns putting one stone on any empty dot (9 stones each).</text>
    <text x="24" y="470">2. Three of yours in a straight line is a mill: take away one of</text>
    <text x="43" y="490">the other player's stones that is not in a mill.</text>
    <text x="24" y="516">3. When all 18 are down, move one stone one step along a line.</text>
    <text x="24" y="542">4. Down to 3 stones: jump to any empty dot. Down to 2: you lose.</text>
  </g>
  <text x="24" y="578" font-size="13" fill="#555">Scratch the board on a plank or draw it on paper; use stones, beans or buttons.</text>
</svg>
