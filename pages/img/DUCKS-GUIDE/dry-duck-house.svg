<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="Arial, Helvetica, sans-serif">
  <title>A dry duck house, side view: raised bedded floor, floor-level nests, high vents, water outside on a screen</title>
  <rect width="680" height="460" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <pattern id="straw" width="10" height="8" patternUnits="userSpaceOnUse"><rect width="10" height="8" fill="#ecd88f"/><path d="M0,6 L6,2 M5,8 L10,4" stroke="#b8972f" stroke-width="1.2"/></pattern>
    <pattern id="gravel" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#d6d2c8"/><circle cx="3" cy="3" r="2" fill="#8d877a"/><circle cx="9" cy="7" r="2.2" fill="#8d877a"/></pattern>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">A dry duck house (side view)</text>

  <!-- ground: high under the house, sloping down to the right -->
  <path d="M0,350 L400,350 L680,392 L680,460 L0,460 Z" fill="#cdb79a"/>
  <path d="M0,350 L400,350 L680,392" fill="none" stroke="#6b5434" stroke-width="2"/>

  <!-- raised earth floor 4-6 in above ground (x 90..350) -->
  <path d="M80,350 L92,330 L348,330 L360,350 Z" fill="#a98b66" stroke="#6b5434" stroke-width="2"/>
  <!-- bedding -->
  <rect x="92" y="318" width="256" height="12" fill="url(#straw)" stroke="#9c7d24" stroke-width="1"/>

  <!-- walls: back (low, left) and front (high, right) -->
  <rect x="86" y="196" width="8" height="134" fill="#8a6a45"/>
  <rect x="346" y="150" width="8" height="122" fill="#8a6a45"/>
  <!-- roof -->
  <path d="M66,206 L374,140" stroke="#5a4128" stroke-width="9" stroke-linecap="round"/>
  <!-- vents under the eaves: gaps shown as open slots -->
  <rect x="86" y="200" width="8" height="18" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <rect x="346" y="152" width="8" height="18" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <!-- door gap at the front, low -->
  <rect x="346" y="272" width="8" height="46" fill="#ffffff" stroke="#333" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- nest stall at the back wall, on the floor: 18 in deep, 12 in boards -->
  <rect x="94" y="290" width="62" height="28" fill="none" stroke="#5a4128" stroke-width="3"/>
  <ellipse cx="118" cy="311" rx="9" ry="6.5" fill="#f4f1e8" stroke="#666"/>
  <ellipse cx="134" cy="312" rx="9" ry="6.5" fill="#f4f1e8" stroke="#666"/>

  <!-- two ducks resting on the bedding -->
  <g fill="#fafafa" stroke="#444" stroke-width="1.6">
    <ellipse cx="215" cy="304" rx="30" ry="14"/><circle cx="244" cy="290" r="8"/>
    <ellipse cx="290" cy="304" rx="30" ry="14"/><circle cx="319" cy="290" r="8"/>
  </g>
  <g fill="#e2a23a" stroke="#8a5a14" stroke-width="1"><path d="M251,289 L262,292 L251,294 Z"/><path d="M326,289 L337,292 L326,294 Z"/></g>

  <!-- waterer outside, downhill, on a wire screen over a gravel pit -->
  <path d="M500,374 L590,388 L590,418 L500,404 Z" fill="url(#gravel)" stroke="#6b5434" stroke-width="1.5"/>
  <path d="M500,374 L590,388" stroke="#222" stroke-width="2.5" stroke-dasharray="4 3"/>
  <path d="M528,366 L562,371 L558,384 L532,379 Z" fill="#9cc4e4" stroke="#2f5f8a" stroke-width="2"/>

  <!-- fence at the right: 2 ft -->
  <line x1="650" y1="388" x2="650" y2="316" stroke="#555" stroke-width="4"/>
  <path d="M650,320 L672,320 M650,334 L672,334 M650,348 L672,348 M650,362 L672,362 M650,376 L672,376" stroke="#777" stroke-width="1.5"/>

  <!-- rain runoff arrow -->
  <path d="M410,364 L480,375" stroke="#2f5f8a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- labels -->
  <g font-size="13" fill="#222">
    <text x="392" y="132">Vents high under the eaves;</text>
    <text x="392" y="148">open wide on dry days</text>
    <line x1="390" y1="144" x2="358" y2="160" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>

    <text x="10" y="178">Shed roof</text>

    <text x="6" y="228" font-weight="bold">Nests on</text>
    <text x="6" y="244" font-weight="bold">the floor:</text>
    <text x="6" y="260">12 in wide,</text>
    <text x="6" y="276">18 in deep,</text>
    <text x="6" y="292">1 per 3–4</text>
    <line x1="50" y1="298" x2="100" y2="306" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>

    <text x="168" y="236">No roost: ducks sleep</text>
    <text x="168" y="252">on the bedding</text>

    <text x="392" y="232">Door: shut at night,</text>
    <text x="392" y="248">open after mid-morning</text>
    <line x1="390" y1="252" x2="358" y2="286" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>

    <text x="10" y="386">Dry straw or shavings: add fresh on top when wet</text>
    <line x1="150" y1="372" x2="170" y2="326" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="10" y="406">Earth floor raised 4–6 in above the ground,</text>
    <text x="10" y="422">on high, well-drained, sandy ground</text>
    <line x1="60" y1="394" x2="88" y2="342" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>

    <text x="420" y="300">Water OUTSIDE, far from</text>
    <text x="420" y="316">the house, on a wire screen</text>
    <text x="420" y="332">over a gravel pit</text>
    <line x1="520" y1="338" x2="540" y2="364" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>

    <text x="590" y="296">2-ft fence</text>
    <text x="406" y="446" fill="#2f5f8a">Rain runs downhill, away from the floor</text>
  </g>
</svg>
