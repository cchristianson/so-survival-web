<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="Arial, Helvetica, sans-serif">
  <title>A rabbit hutch cut through from the end: about 2 ft high and no more than 2½ ft deep, rain-proof roof, wire front, solid back, wire floor with a resting board, hay manger, water valve 9 inches up, waist high on legs, with a worm bin underneath</title>
  <rect width="680" height="480" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <pattern id="w" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffffff"/><path d="M0,0 H8 M0,0 V8" stroke="#666" stroke-width="1"/></pattern>
  </defs>

  <!-- ground -->
  <rect x="0" y="446" width="680" height="34" fill="#e2d4bb"/>
  <line x1="0" y1="446" x2="680" y2="446" stroke="#6b5a40" stroke-width="2"/>

  <!-- end wall (background) -->
  <rect x="206" y="92" width="258" height="208" fill="#f4f1ea"/>

  <!-- roof: rain-proof, overhangs, slopes to the back -->
  <polygon points="168,62 506,92 506,102 168,72" fill="#6d6d6d" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="56" text-anchor="middle" font-size="13" fill="#333">rain-proof roof</text>

  <!-- front: wire -->
  <rect x="198" y="76" width="8" height="226" fill="url(#w)" stroke="#555" stroke-width="1"/>
  <!-- back: solid boards -->
  <rect x="464" y="94" width="10" height="208" fill="#9b7b4f" stroke="#5e4a2e" stroke-width="1.5"/>

  <!-- floor: wire, with resting board -->
  <rect x="198" y="300" width="276" height="6" fill="url(#w)" stroke="#555" stroke-width="1"/>
  <rect x="380" y="292" width="80" height="8" fill="#c9a874" stroke="#6b5232" stroke-width="1.5"/>

  <!-- hay manger on the end wall -->
  <path d="M236,150 L300,150 L280,222 L256,222 Z" fill="#fbf3d0" stroke="#6b5232" stroke-width="2"/>
  <g stroke="#b59a3a" stroke-width="1.6"><line x1="246" y1="156" x2="262" y2="214"/><line x1="258" y1="152" x2="268" y2="214"/><line x1="272" y1="152" x2="274" y2="214"/><line x1="286" y1="154" x2="280" y2="214"/></g>
  <g stroke="#6b5232" stroke-width="1.5"><line x1="250" y1="150" x2="262" y2="222"/><line x1="268" y1="150" x2="268" y2="222"/><line x1="286" y1="150" x2="274" y2="222"/></g>
  <text x="268" y="142" text-anchor="middle" font-size="13" fill="#333">hay manger</text>

  <!-- water line along the backs, valve 9 in up -->
  <circle cx="488" cy="221" r="7" fill="#9fc3df" stroke="#2f5f86" stroke-width="2"/>
  <path d="M481,221 L452,221 L446,226" fill="none" stroke="#2f5f86" stroke-width="4" stroke-linecap="round"/>
  <line x1="440" y1="227" x2="440" y2="299" stroke="#333" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="434" y="262" text-anchor="end" font-size="13" fill="#333">9 in</text>

  <!-- dimensions -->
  <line x1="182" y1="94" x2="182" y2="299" stroke="#333" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="176" y="192" text-anchor="end" font-size="13" font-weight="bold" fill="#222">about</text>
  <text x="176" y="208" text-anchor="end" font-size="13" font-weight="bold" fill="#222">2 ft high</text>
  <!-- legs: waist high -->
  <g fill="#9b7b4f" stroke="#5e4a2e" stroke-width="1.5"><rect x="204" y="306" width="10" height="140"/><rect x="458" y="306" width="10" height="140"/></g>
  <line x1="200" y1="324" x2="472" y2="324" stroke="#333" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="246" y="316" width="180" height="16" fill="#ffffff"/>
  <text x="336" y="329" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">no more than 2½ ft deep</text>

  <!-- worm bin under the hutch -->
  <rect x="222" y="404" width="228" height="42" fill="#8a6f4e" stroke="#4d3b25" stroke-width="2"/>
  <text x="336" y="430" text-anchor="middle" font-size="13" fill="#ffffff">worm bin, 1 ft deep</text>

  <!-- labels left -->
  <text x="8" y="88" font-size="13" font-weight="bold" fill="#222">FRONT</text>
  <text x="8" y="250" font-size="13" fill="#333">wire front:</text>
  <text x="8" y="266" font-size="13" fill="#333">1 × 2-in welded</text>
  <text x="8" y="282" font-size="13" fill="#333">wire (1 × 1 in</text>
  <text x="8" y="298" font-size="13" fill="#333">where rats are)</text>
  <text x="8" y="380" font-size="13" fill="#333">floor about</text>
  <text x="8" y="396" font-size="13" fill="#333">waist high</text>

  <!-- labels right -->
  <text x="512" y="112" font-size="13" font-weight="bold" fill="#222">BACK</text>
  <text x="512" y="130" font-size="13" fill="#333">solid panel</text>
  <text x="512" y="146" font-size="13" fill="#333">against drafts</text>
  <text x="512" y="198" font-size="13" fill="#333">water line along</text>
  <text x="512" y="214" font-size="13" fill="#333">the backs; valve</text>
  <text x="512" y="230" font-size="13" fill="#333">9 in up (7 in for</text>
  <text x="512" y="246" font-size="13" fill="#333">small breeds)</text>
  <line x1="508" y1="296" x2="462" y2="296" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="512" y="292" font-size="13" fill="#333">resting board</text>
  <text x="512" y="308" font-size="13" fill="#333">against sore hocks</text>
  <text x="512" y="342" font-size="13" fill="#333">floor: wire, smooth</text>
  <text x="512" y="358" font-size="13" fill="#333">side up, or slats</text>
  <text x="512" y="374" font-size="13" fill="#333">⅝–¾ in apart</text>

  <text x="340" y="472" text-anchor="middle" font-size="12.5" fill="#555">Cut-away end view. Length: 3 ft for small breeds, 4 ft for medium, 6 ft for giants.</text>
</svg>
