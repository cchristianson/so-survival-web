<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="Arial, Helvetica, sans-serif">
  <title>A pinhole leak in a hydraulic hose, and the two ways of looking for it: on the left a piece of cardboard held well away from the body catches the jet and marks it; on the right a bare hand reaching for the leak, crossed out, with what injected oil does to a finger</title>
  <rect width="680" height="500" fill="#ffffff"/>
  <defs>
    <marker id="rx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c8431a"/></marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">A pinhole leak is a needle</text>
  <text x="340" y="46" text-anchor="middle" font-size="13.5" fill="#222">Equipment hydraulics run at up to 3,000 psi — 5,000 in a piston pump — and the oil can be over 200 °F.</text>

  <line x1="340" y1="72" x2="340" y2="296" stroke="#ccc" stroke-width="1"/>

  <!-- ===== LEFT: cardboard ===== -->
  <text x="20" y="96" font-size="14" font-weight="bold" fill="#2f5e16">YES — cardboard or wood</text>
  <!-- hose -->
  <rect x="30" y="236" width="276" height="18" rx="9" fill="#55504a" stroke="#333" stroke-width="2"/>
  <rect x="294" y="230" width="20" height="30" rx="3" fill="#8a8a85" stroke="#333" stroke-width="2"/>
  <rect x="30" y="230" width="18" height="30" rx="3" fill="#8a8a85" stroke="#333" stroke-width="2"/>
  <circle cx="176" cy="236" r="2.6" fill="#c8431a"/>
  <!-- the jet -->
  <path d="M176,234 L236,178" stroke="#c8431a" stroke-width="1.6"/>
  <g fill="#c8431a"><circle cx="196" cy="216" r="1.1"/><circle cx="212" cy="201" r="1.1"/><circle cx="228" cy="186" r="1.1"/></g>
  <text x="120" y="212" text-anchor="end" font-size="12.5" font-weight="bold" fill="#c8431a">a pinhole you can</text>
  <text x="120" y="228" text-anchor="end" font-size="12.5" font-weight="bold" fill="#c8431a">hardly see</text>
  <path d="M126,220 L170,232" fill="none" stroke="#c8431a" stroke-width="1"/>
  <!-- cardboard -->
  <g transform="translate(222,128) rotate(18)">
    <rect x="0" y="0" width="52" height="58" fill="#d8b98c" stroke="#8a6a3a" stroke-width="2"/>
    <circle cx="18" cy="46" r="4" fill="#3a2a14"/>
    <circle cx="18" cy="46" r="9" fill="#3a2a14" opacity="0.25"/>
  </g>
  <!-- hand holding it -->
  <g fill="#e6c6a6" stroke="#8a6a4a" stroke-width="1.8">
    <rect x="268" y="150" width="46" height="30" rx="9"/>
    <rect x="252" y="154" width="20" height="8" rx="4"/>
    <rect x="252" y="164" width="20" height="8" rx="4"/>
    <rect x="258" y="174" width="18" height="8" rx="4"/>
  </g>
  <text x="20" y="128" font-size="12.5" fill="#222">Hunt for a leak with a piece of</text>
  <text x="20" y="144" font-size="12.5" fill="#222">cardboard or wood, held well</text>
  <text x="20" y="160" font-size="12.5" fill="#222">away from your body. The jet</text>
  <text x="20" y="176" font-size="12.5" fill="#222">marks it.</text>
  <text x="20" y="282" font-size="12.5" font-weight="bold" fill="#222">Check hoses before and after work for cracks,</text>
  <text x="20" y="298" font-size="12.5" font-weight="bold" fill="#222">splits, pinholes, rubbing, heat and twisting.</text>

  <!-- ===== RIGHT: the hand ===== -->
  <text x="364" y="96" font-size="14" font-weight="bold" fill="#c8431a">NO — never a hand</text>
  <rect x="374" y="236" width="256" height="18" rx="9" fill="#55504a" stroke="#333" stroke-width="2"/>
  <rect x="618" y="230" width="20" height="30" rx="3" fill="#8a8a85" stroke="#333" stroke-width="2"/>
  <rect x="374" y="230" width="18" height="30" rx="3" fill="#8a8a85" stroke="#333" stroke-width="2"/>
  <circle cx="500" cy="236" r="2.6" fill="#c8431a"/>
  <path d="M500,234 L548,190" stroke="#c8431a" stroke-width="1.6"/>
  <!-- bare hand reaching in -->
  <g fill="#e6c6a6" stroke="#8a6a4a" stroke-width="1.8">
    <rect x="556" y="166" width="48" height="32" rx="10"/>
    <rect x="536" y="170" width="22" height="8" rx="4"/>
    <rect x="534" y="180" width="24" height="8" rx="4"/>
    <rect x="540" y="190" width="20" height="8" rx="4"/>
  </g>
  <g stroke="#c8431a" stroke-width="5" stroke-linecap="round">
    <path d="M532,160 L612,206 M612,160 L532,206"/>
  </g>
  <text x="364" y="128" font-size="12.5" fill="#222">Never feel for a leak with your</text>
  <text x="364" y="144" font-size="12.5" fill="#222">hand, and don't trust gloves:</text>
  <text x="364" y="160" font-size="12.5" fill="#222">the jet goes through both.</text>
  <text x="364" y="282" font-size="12.5" font-weight="bold" fill="#c8431a">The same goes for a diesel injector's spray, and</text>
  <text x="364" y="298" font-size="12.5" font-weight="bold" fill="#c8431a">for compressed air.</text>

  <!-- ===== what injected oil does ===== -->
  <rect x="16" y="318" width="648" height="110" fill="#fdf1ec" stroke="#c8431a" stroke-width="2"/>
  <text x="34" y="344" font-size="14" font-weight="bold" fill="#c8431a">IF OIL GETS UNDER THE SKIN, IT IS A SURGICAL EMERGENCY</text>
  <g font-size="13" fill="#222">
    <text x="34" y="366">The wound may be a dot that hardly hurts at first. The oil spreads under the</text>
    <text x="34" y="386">skin and kills tissue over hours, and fingers and hands are lost.</text>
    <text x="34" y="410" font-weight="bold">Get to whoever can operate, fast, and say it was injected oil. Don't wait to see.</text>
  </g>
  <g transform="translate(610,348)">
    <path d="M0,0 C14,0 22,10 22,24 C22,42 12,56 0,56 C-12,56 -22,42 -22,24 C-22,10 -14,0 0,0 z" fill="#e6c6a6" stroke="#8a6a4a" stroke-width="1.8"/>
    <circle cx="0" cy="18" r="3" fill="#c8431a"/>
    <circle cx="0" cy="18" r="9" fill="none" stroke="#c8431a" stroke-width="1.4"/>
  </g>
  <text x="610" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#c8431a">a dot, no more</text>

  <text x="16" y="456" font-size="13.5" font-weight="bold" fill="#222">Before you loosen anything: lower every bucket, blade and implement to the ground, stop the</text>
  <text x="16" y="474" font-size="13.5" font-weight="bold" fill="#222">engine, and work the levers back and forth to let the pressure out.</text>
  <text x="16" y="494" font-size="13" fill="#222">Never work under a raised load held only by hydraulics: lower it, or block it, or use the support strut.</text>
</svg>
