<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" font-family="Arial, Helvetica, sans-serif">
  <title>A brood coop for goslings with a movable wire runway, seen from the side</title>
  <rect width="660" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0,0 L12,0 M0,0 L0,12" stroke="#6b6b6b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ground and grass -->
  <rect x="0" y="300" width="660" height="20" fill="#e3efd9"/>
  <line x1="0" y1="300" x2="660" y2="300" stroke="#5b7f3a" stroke-width="2"/>

  <!-- coop: wooden box with sloped roof -->
  <polygon points="60,150 250,120 250,300 60,300" fill="#e8d6b8" stroke="#6b4a24" stroke-width="3"/>
  <polygon points="45,154 265,117 265,107 45,144" fill="#a9773f" stroke="#6b4a24" stroke-width="2"/>
  <!-- wooden floor and straw -->
  <rect x="60" y="282" width="190" height="10" fill="#a9773f" stroke="#6b4a24" stroke-width="1.5"/>
  <path d="M66,282 l8,-8 l6,8 l7,-9 l6,9 l8,-7 l6,7 l7,-8 l6,8 l8,-8 l6,8 l7,-9 l6,9 l8,-7 l6,7 l7,-8 l6,8 l8,-8 l6,8 l7,-9 l6,9 l8,-7 l6,7 l7,-8 l6,8 l8,-8 l4,8" fill="#f1dc8a" stroke="#b8962e" stroke-width="1.2"/>
  <!-- sliding screen in the front wall, half raised -->
  <rect x="244" y="160" width="12" height="80" fill="url(#mesh)" stroke="#333" stroke-width="2"/>
  <line x1="240" y1="150" x2="240" y2="282" stroke="#6b4a24" stroke-width="2"/>
  <line x1="260" y1="150" x2="260" y2="282" stroke="#6b4a24" stroke-width="2"/>
  <line x1="250" y1="166" x2="250" y2="140" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- goslings inside -->
  <g fill="#e9c94a" stroke="#8a6d10" stroke-width="1.2">
    <ellipse cx="120" cy="268" rx="15" ry="10"/><circle cx="134" cy="254" r="7"/>
    <ellipse cx="175" cy="270" rx="15" ry="10"/><circle cx="189" cy="256" r="7"/>
  </g>

  <!-- wire runway -->
  <rect x="260" y="214" width="300" height="86" fill="url(#mesh)" stroke="#333" stroke-width="2.5"/>
  <!-- opening in the wire top at the far end -->
  <rect x="500" y="208" width="56" height="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <!-- goslings on grass in the run -->
  <g fill="#e9c94a" stroke="#8a6d10" stroke-width="1.2">
    <ellipse cx="320" cy="288" rx="15" ry="10"/><circle cx="334" cy="274" r="7"/>
    <ellipse cx="400" cy="286" rx="15" ry="10"/><circle cx="388" cy="273" r="7"/>
  </g>
  <!-- small waterer -->
  <rect x="452" y="272" width="34" height="26" fill="#bcd7ea" stroke="#2f5d7c" stroke-width="2"/>
  <line x1="452" y1="280" x2="486" y2="280" stroke="#2f5d7c" stroke-width="1.5"/>

  <!-- move arrow -->
  <line x1="330" y1="345" x2="560" y2="345" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="445" y="368" text-anchor="middle" font-size="14" fill="#222">Move coop and run every day or two</text>
  <text x="445" y="386" text-anchor="middle" font-size="14" fill="#222">onto fresh, short grass</text>

  <!-- labels -->
  <g font-size="14" fill="#222">
    <text x="60" y="40" font-weight="bold" font-size="16">Coop about 2 × 3 ft: 25 young goslings</text>
    <text x="60" y="60">Wooden floor, dry straw litter, waterproof roof</text>
    <text x="60" y="80">No heat needed in mild weather; or shut the hen in it</text>

    <text x="282" y="140">Sliding screen: close</text>
    <text x="282" y="157">the front every night</text>
    <line x1="280" y1="152" x2="262" y2="175" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>

    <text x="400" y="180">Wire top, opening at</text>
    <text x="400" y="197">the far end</text>
    <line x1="490" y1="196" x2="520" y2="208" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="264" y="230" width="166" height="27" fill="#ffffff" stroke="none"/>
    <text x="270" y="248" font-weight="bold">Portable wire runway</text>
    <rect x="430" y="248" width="120" height="19" fill="#ffffff" stroke="none"/>
    <text x="436" y="262" font-size="13">water: heads only</text>

    <text x="60" y="345">Keep goslings out of</text>
    <text x="60" y="362">rain the first month</text>
    <text x="60" y="379">and shut in until the</text>
    <text x="60" y="396">dew dries (2–3 weeks)</text>
  </g>
  <text x="650" y="412" text-anchor="end" font-size="12" fill="#555">Side view. Not to scale.</text>
</svg>
