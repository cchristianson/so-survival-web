<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Arial, Helvetica, sans-serif">
  <title>Pulling a tick: fine tweezers grip it right at the skin and pull straight up</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2d5f8a"/></marker>
  </defs>

  <!-- skin, cut away -->
  <rect x="20" y="250" width="380" height="80" fill="#f1dcc8"/>
  <line x1="20" y1="250" x2="400" y2="250" stroke="#8a5a3c" stroke-width="3"/>
  <text x="34" y="300" font-size="16" font-weight="bold" fill="#6b3f26">SKIN</text>

  <!-- tick: mouthparts in the skin, head, body -->
  <line x1="300" y1="246" x2="300" y2="266" stroke="#3d2a1e" stroke-width="5"/>
  <ellipse cx="303" cy="242" rx="10" ry="7" fill="#3d2a1e"/>
  <ellipse cx="345" cy="226" rx="40" ry="22" transform="rotate(-18 345 226)" fill="#5a3a26" stroke="#2e1d12" stroke-width="2"/>
  <g stroke="#2e1d12" stroke-width="2" fill="none">
    <path d="M318,240 L312,250"/><path d="M330,244 L328,250"/><path d="M346,244 L350,250"/><path d="M360,240 L370,250"/>
  </g>

  <!-- fine-tipped tweezers -->
  <g stroke="#555" stroke-width="7" stroke-linecap="round">
    <line x1="110" y1="96" x2="292" y2="244"/>
    <line x1="132" y1="76" x2="297" y2="238"/>
  </g>
  <line x1="104" y1="102" x2="138" y2="70" stroke="#555" stroke-width="9" stroke-linecap="round"/>
  <text x="40" y="60" font-size="15" font-weight="bold" fill="#222">FINE-TIPPED TWEEZERS</text>
  <text x="40" y="196" font-size="14" fill="#222">Grip as close to</text>
  <text x="40" y="214" font-size="14" fill="#222">the skin as you can</text>
  <line x1="168" y1="208" x2="284" y2="246" stroke="#222" stroke-width="1.3"/>

  <!-- pull straight up -->
  <line x1="304" y1="196" x2="304" y2="86" stroke="#2d5f8a" stroke-width="5" marker-end="url(#a)"/>
  <text x="318" y="98" font-size="16" font-weight="bold" fill="#2d5f8a">PULL STRAIGHT UP</text>
  <text x="318" y="118" font-size="14" fill="#2d5f8a">no twisting</text>

  <!-- don'ts -->
  <rect x="430" y="160" width="190" height="130" rx="6" fill="#f7e6e3" stroke="#b03a2e"/>
  <text x="446" y="188" font-size="16" font-weight="bold" fill="#b03a2e">DON'T</text>
  <g font-size="15" fill="#222">
    <text x="446" y="214">× twist it</text>
    <text x="446" y="238">× use heat</text>
    <text x="446" y="262">× use petroleum jelly</text>
  </g>
  <text x="20" y="360" font-size="14" fill="#333">Treat clothing with permethrin. The western blacklegged tick here carries</text>
  <text x="20" y="380" font-size="14" fill="#333">Lyme disease. Side view, much enlarged.</text>
</svg>
