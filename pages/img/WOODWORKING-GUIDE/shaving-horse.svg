<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="Arial, Helvetica, sans-serif">
  <title>A shaving horse seen from the side: bench, sloping platform, swinging arm with its clamp head, pivot pin and foot bar</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2f5e16"/></marker>
  </defs>
  <rect width="680" height="340" fill="#ffffff"/>
  <g transform="translate(0,-78)">
  <line x1="10" y1="392" x2="670" y2="392" stroke="#6b5a45" stroke-width="2.5"/>

  <!-- legs (far pair lighter, behind) -->
  <g stroke="#7a5a35" stroke-width="2" stroke-linejoin="round">
    <path d="M80,266 L94,266 L112,392 L98,392 Z" fill="#d9bd8c"/>
    <path d="M478,266 L492,266 L470,392 L456,392 Z" fill="#d9bd8c"/>
    <path d="M56,266 L72,266 L50,392 L34,392 Z" fill="#e8cfa0"/>
    <path d="M500,266 L516,266 L540,392 L524,392 Z" fill="#e8cfa0"/>
  </g>
  <!-- the bench plank -->
  <rect x="20" y="248" width="530" height="20" fill="#e8cfa0" stroke="#7a5a35" stroke-width="2"/>
  <g stroke="#c9a874" stroke-width="1.2"><path d="M26,256 H210 M240,261 H426 M460,256 H544"/></g>
  <!-- cheek that carries the pivot (behind the arm) -->
  <rect x="418" y="196" width="54" height="52" fill="#d9bd8c" stroke="#7a5a35" stroke-width="2"/>
  <!-- sloping platform on its block -->
  <path d="M200,248 L418,190 L418,204 L246,248 Z" fill="#e8cfa0" stroke="#7a5a35" stroke-width="2" stroke-linejoin="round"/>
  <!-- the work lying on the platform -->
  <path d="M236,238 L414,190 L414,174 L232,222 Z" fill="#f3e2bb" stroke="#7a5a35" stroke-width="2" stroke-linejoin="round"/>
  <!-- the swinging arm, its clamp head and foot bar -->
  <rect x="432" y="150" width="18" height="198" fill="#c99a5c" stroke="#6b4a24" stroke-width="2"/>
  <path d="M378,150 H452 V182 H378 Z" fill="#c99a5c" stroke="#6b4a24" stroke-width="2"/>
  <circle cx="441" cy="226" r="6" fill="#555" stroke="#222" stroke-width="1.5"/>
  <circle cx="441" cy="356" r="13" fill="#c99a5c" stroke="#6b4a24" stroke-width="2"/>
  <!-- how it moves -->
  <path d="M462,356 H506" stroke="#2f5e16" stroke-width="3.5" marker-end="url(#g)"/>
  <path d="M410,138 C396,132 384,134 374,142" fill="none" stroke="#2f5e16" stroke-width="3" marker-end="url(#g)"/>

  <g font-size="16" fill="#222">
    <text x="26" y="236" font-weight="bold">Sit here, astride</text>
    <text x="130" y="296">a thick plank on four legs</text>
    <text x="70" y="196">sloping platform</text>
    <text x="140" y="146" font-weight="bold">the work</text>
    <text x="140" y="166">(shave it with a drawknife)</text>
    <text x="466" y="104" font-weight="bold">Clamp head:</text>
    <text x="466" y="124">heavy, tough hardwood</text>
    <text x="482" y="192" font-weight="bold">Pivot pin</text>
    <text x="482" y="212">(more holes, to raise</text>
    <text x="482" y="232">it for thick work)</text>
    <text x="414" y="342" text-anchor="end" font-weight="bold" fill="#2f5e16">Push the foot bar away:</text>
    <text x="414" y="362" text-anchor="end" fill="#2f5e16">the head swings down</text>
    <text x="414" y="382" text-anchor="end" fill="#2f5e16">and grips the work</text>
  </g>
  <line x1="190" y1="200" x2="232" y2="241" stroke="#333" stroke-width="1.2"/>
  <line x1="270" y1="172" x2="300" y2="205" stroke="#333" stroke-width="1.2"/>
  <line x1="478" y1="190" x2="449" y2="222" stroke="#333" stroke-width="1.2"/>
  <line x1="470" y1="130" x2="440" y2="150" stroke="#333" stroke-width="1.2"/>
  </g>
</svg>
