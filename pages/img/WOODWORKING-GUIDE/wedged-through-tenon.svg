<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="Arial, Helvetica, sans-serif">
  <title>A tenon wedged through a hole: side view cut through the middle, and the slit turned across the grain seen from above</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>
  <rect width="660" height="400" fill="#ffffff"/>

  <!-- side view, cut through -->
  <text x="16" y="28" font-size="17" font-weight="bold" fill="#222">Cut through the middle</text>
  <!-- board, the two sides of the hole -->
  <rect x="30" y="160" width="122" height="70" fill="#e8cfa0" stroke="#7a5a35" stroke-width="2"/>
  <rect x="208" y="160" width="122" height="70" fill="#e8cfa0" stroke="#7a5a35" stroke-width="2"/>
  <g stroke="#c9a874" stroke-width="1.2"><path d="M34,178 H148 M34,196 H148 M34,214 H148 M212,178 H326 M212,196 H326 M212,214 H326"/></g>
  <!-- leg with its round tenon: the two halves spread by the wedge -->
  <path d="M138,372 V240 H152 V160 L148,112 H178 L180,190 L182,112 H212 L208,160 V240 H222 V372 L208,364 L194,374 L180,364 L166,374 L152,364 Z" fill="#f0dcb4" stroke="#7a5a35" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#c9a874" stroke-width="1.2"><path d="M160,250 V362 M180,250 V362 M200,250 V362"/></g>
  <!-- the wedge in the slit -->
  <path d="M168,100 H192 L181,196 H179 Z" fill="#b88446" stroke="#5c3d17" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- saw off flush -->
  <line x1="110" y1="160" x2="250" y2="160" stroke="#c8431a" stroke-width="2.2" stroke-dasharray="7 5"/>
  <g font-size="15" fill="#222">
    <text x="232" y="74" font-weight="bold">Hardwood wedge,</text>
    <text x="232" y="92">in a saw slit</text>
    <text x="232" y="138" font-weight="bold" fill="#c8431a">Saw off flush</text>
    <text x="24" y="256">seat or rail,</text>
    <text x="24" y="274">bored through</text>
    <text x="234" y="300" font-weight="bold">Leg: its end</text>
    <text x="234" y="318">rounded to fit</text>
    <text x="234" y="336">the hole</text>
  </g>
  <line x1="228" y1="84" x2="194" y2="108" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="230" y1="306" x2="214" y2="300" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>

  <line x1="360" y1="40" x2="360" y2="380" stroke="#cccccc" stroke-width="1.5"/>

  <!-- from above -->
  <text x="376" y="28" font-size="17" font-weight="bold" fill="#222">Seen from above</text>
  <rect x="376" y="70" width="270" height="150" fill="#e8cfa0" stroke="#7a5a35" stroke-width="2"/>
  <g fill="none" stroke="#c9a874" stroke-width="1.3">
    <path d="M378,88 C440,84 500,92 644,86"/>
    <path d="M378,108 C430,104 470,112 644,106"/>
    <path d="M378,198 C450,194 520,202 644,196"/>
    <path d="M378,178 C440,176 530,182 644,177"/>
  </g>
  <text x="511" y="240" text-anchor="middle" font-size="14" fill="#555">the board's grain runs this way</text>
  <line x1="420" y1="250" x2="602" y2="250" stroke="#999" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- right: slit across the grain -->
  <circle cx="445" cy="145" r="30" fill="#f0dcb4" stroke="#7a5a35" stroke-width="2"/>
  <circle cx="445" cy="145" r="18" fill="none" stroke="#d8bd8c" stroke-width="1"/>
  <rect x="441" y="115" width="8" height="60" fill="#b88446" stroke="#5c3d17" stroke-width="1.2"/>
  <!-- wrong: slit along the grain -->
  <circle cx="577" cy="145" r="30" fill="#f0dcb4" stroke="#7a5a35" stroke-width="2"/>
  <circle cx="577" cy="145" r="18" fill="none" stroke="#d8bd8c" stroke-width="1"/>
  <rect x="547" y="141" width="60" height="8" fill="#b88446" stroke="#5c3d17" stroke-width="1.2"/>
  <path d="M607,145 L618,143 L626,147 L636,144 L646,146" fill="none" stroke="#c8431a" stroke-width="2.4"/>
  <path d="M547,145 L536,147 L527,143 L518,146" fill="none" stroke="#c8431a" stroke-width="2.4"/>
  <g font-size="16" font-weight="bold">
    <text x="445" y="290" text-anchor="middle" fill="#2f5e16">RIGHT</text>
    <text x="577" y="290" text-anchor="middle" fill="#c8431a">WRONG</text>
  </g>
  <g font-size="15" fill="#222">
    <text x="445" y="310" text-anchor="middle">wedge across</text>
    <text x="445" y="328" text-anchor="middle">the grain</text>
    <text x="577" y="310" text-anchor="middle">wedge along the</text>
    <text x="577" y="328" text-anchor="middle">grain splits it</text>
  </g>
</svg>
