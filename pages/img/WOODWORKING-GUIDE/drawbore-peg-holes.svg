<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380" font-family="Arial, Helvetica, sans-serif">
  <title>A drawbored mortise and tenon: the hole in the tenon is bored a little nearer the shoulder, so the peg pulls the joint tight</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2f5e16"/></marker>
  </defs>
  <rect width="660" height="380" fill="#ffffff"/>

  <!-- 1. holes bored, the parts apart -->
  <text x="16" y="28" font-size="17" font-weight="bold" fill="#222">1. Bore the post, then the tenon</text>
  <rect x="40" y="70" width="110" height="250" fill="#e8cfa0" stroke="#7a5a35" stroke-width="2"/>
  <g stroke="#c9a874" stroke-width="1.2"><path d="M58,70 V320 M88,70 V140 M88,230 V320 M132,70 V320"/></g>
  <rect x="70" y="155" width="80" height="60" fill="#f6ead2" stroke="#7a5a35" stroke-width="1.6" stroke-dasharray="6 4"/>
  <circle cx="113" cy="185" r="9" fill="#4a3518"/>
  <text x="95" y="342" text-anchor="middle" font-size="15" fill="#222">post, with its mortise</text>
  <!-- distance X from the post's face -->
  <line x1="113" y1="62" x2="113" y2="176" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="113" y1="56" x2="150" y2="56" stroke="#333" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="132" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">X</text>

  <!-- rail with its tenon, pulled out -->
  <path d="M180,155 H262 V140 H330 V230 H262 V215 H180 Z" fill="#e8cfa0" stroke="#7a5a35" stroke-width="2"/>
  <path d="M330,138 l-6,24 l8,22 l-8,24 l6,24 H342 V138 Z" fill="#ffffff" stroke="none"/>
  <path d="M330,140 l-6,22 l8,22 l-8,24 l6,22" fill="none" stroke="#7a5a35" stroke-width="1.4"/>
  <g stroke="#c9a874" stroke-width="1.2"><path d="M186,170 H258 M186,200 H258 M268,158 H322 M268,212 H322"/></g>
  <line x1="262" y1="62" x2="262" y2="140" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="225" y1="96" x2="225" y2="178" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="225" y1="90" x2="262" y2="90" stroke="#333" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="244" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">X</text>
  <!-- the mark, and the hole bored nearer the shoulder -->
  <path d="M219,185 h12 M225,179 v12" stroke="#c8431a" stroke-width="2"/>
  <circle cx="242" cy="185" r="9" fill="#4a3518"/>
  <text x="184" y="264" font-size="15" fill="#222"><tspan font-weight="bold" fill="#c8431a">+</tspan> marks the post's hole.</text>
  <text x="184" y="282" font-size="15" fill="#222">Bore the tenon</text>
  <text x="184" y="300" font-size="15" font-weight="bold" fill="#222">1/16–1/8 in nearer</text>
  <text x="184" y="318" font-size="15" font-weight="bold" fill="#222">the shoulder</text>
  <text x="274" y="128" font-size="14" fill="#222">shoulder</text>
  <line x1="242" y1="248" x2="242" y2="199" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>

  <line x1="357" y1="40" x2="357" y2="350" stroke="#cccccc" stroke-width="1.5"/>

  <!-- 2. assembled and pegged -->
  <text x="362" y="28" font-size="17" font-weight="bold" fill="#222">2. Drive a peg through</text>
  <rect x="380" y="70" width="110" height="250" fill="#e8cfa0" stroke="#7a5a35" stroke-width="2"/>
  <g stroke="#c9a874" stroke-width="1.2"><path d="M398,70 V320 M428,70 V140 M428,230 V320 M472,70 V320"/></g>
  <rect x="410" y="155" width="80" height="60" fill="#ecd6aa" stroke="#7a5a35" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="490" y="140" width="160" height="90" fill="#e8cfa0" stroke="#7a5a35" stroke-width="2"/>
  <path d="M650,140 l-6,22 l8,22 l-8,24 l6,22" fill="#ffffff" stroke="#7a5a35" stroke-width="1.4"/>
  <g stroke="#c9a874" stroke-width="1.2"><path d="M496,158 H636 M496,212 H636"/></g>
  <circle cx="453" cy="185" r="10" fill="#d4a35e" stroke="#4a3518" stroke-width="2"/>
  <line x1="447" y1="179" x2="459" y2="191" stroke="#4a3518" stroke-width="1.2"/>
  <!-- labels -->
  <text x="500" y="58" font-size="15" fill="#222">A split, dry hardwood</text>
  <text x="500" y="76" font-size="15" fill="#222">peg, tapered, driven</text>
  <text x="500" y="94" font-size="15" fill="#222">through both holes</text>
  <line x1="510" y1="102" x2="462" y2="176" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M640,262 H504" stroke="#2f5e16" stroke-width="3.5" marker-end="url(#g)"/>
  <text x="504" y="292" font-size="16" font-weight="bold" fill="#2f5e16">The peg pulls</text>
  <text x="504" y="312" font-size="16" font-weight="bold" fill="#2f5e16">the shoulder tight</text>
  <text x="435" y="342" text-anchor="middle" font-size="14" fill="#555">tenon inside (dashed)</text>
  <text x="16" y="370" font-size="13" fill="#555">The offset is drawn larger than it is. Less in softwood.</text>
</svg>
