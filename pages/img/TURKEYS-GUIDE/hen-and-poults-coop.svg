<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Arial, Helvetica, sans-serif">
  <title>Side view of a coop for a turkey hen and her poults, with a wire-floored porch</title>
  <rect width="640" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,0 L8,8 M8,0 L0,8" stroke="#777" stroke-width="0.8"/>
    </pattern>
  </defs>

  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Coop for a turkey hen and her poults (side view)</text>

  <!-- ground -->
  <line x1="20" y1="320" x2="620" y2="320" stroke="#5b7f3a" stroke-width="3"/>
  <text x="600" y="338" text-anchor="end" font-size="13" fill="#456f26">short grass</text>

  <!-- coop body: 5 ft long x 3 ft high (50 px per ft) -->
  <rect x="90" y="150" width="250" height="150" fill="#f3efe6" stroke="none"/>
  <path d="M340,250 L340,150 L90,150 L90,300 L340,300 L340,288" fill="none" stroke="#333" stroke-width="3"/>
  <!-- roof with overhang -->
  <polygon points="72,140 358,152 358,160 72,148" fill="#8a6a45" stroke="#333" stroke-width="2"/>
  <!-- screened vent under eaves -->
  <rect x="112" y="160" width="206" height="26" fill="url(#mesh)" stroke="#555" stroke-width="1.5"/>
  <!-- raised floor and blocks -->
  <rect x="90" y="296" width="250" height="8" fill="#a9773f" stroke="#333" stroke-width="1.5"/>
  <rect x="98" y="304" width="18" height="16" fill="#bbb" stroke="#333" stroke-width="1.5"/>
  <rect x="314" y="304" width="18" height="16" fill="#bbb" stroke="#333" stroke-width="1.5"/>
  <!-- litter -->
  <rect x="92" y="286" width="246" height="10" fill="#e8d9a8"/>
  <!-- opening to porch -->

  <!-- porch: wire sides, top and floor, raised off the ground -->
  <rect x="343" y="220" width="197" height="76" fill="url(#mesh)" stroke="none"/>
  <path d="M340,220 L540,220 L540,296" fill="none" stroke="#555" stroke-width="1.5"/>
  <line x1="340" y1="220" x2="340" y2="250" stroke="#555" stroke-width="1.5"/>
  <line x1="340" y1="296" x2="540" y2="296" stroke="#333" stroke-width="3"/>
  <rect x="520" y="296" width="12" height="24" fill="#bbb" stroke="#333" stroke-width="1.5"/>

  <!-- labels -->
  <g font-size="14" fill="#222">
    <text x="215" y="226" text-anchor="middle" font-weight="bold">hen + up to 20 poults</text>
    <text x="215" y="246" text-anchor="middle">(25 in warm weather)</text>
    <text x="215" y="278" text-anchor="middle">litter: clean sand</text>
    <text x="290" y="268" font-size="13" fill="#333">door →</text>
  </g>
  <g font-size="13" fill="#333">
    <text x="370" y="62">screened openings up high,</text>
    <text x="370" y="79">under the eaves, so rain</text>
    <text x="370" y="96">can't beat in</text>
    <text x="440" y="180">wire-floored porch:</text>
    <text x="440" y="197">poults run in and out</text>
    <text x="440" y="214">by day, off the ground</text>
    <text x="12" y="356">raised, rat-proof floor</text>
  </g>
  <g stroke="#333" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="368" y1="78" x2="300" y2="166"/>
    <line x1="72" y1="346" x2="104" y2="304"/>
  </g>

  <!-- dimensions -->
  <g stroke="#333" stroke-width="1.6" fill="none" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="92" y1="345" x2="338" y2="345"/>
    <line x1="56" y1="152" x2="56" y2="298"/>
  </g>
  <g font-size="14" fill="#222" font-weight="bold">
    <text x="215" y="368" text-anchor="middle">about 5 ft long</text>
    <text x="48" y="232" text-anchor="end" transform="rotate(-90 48 225)">3 ft high</text>
  </g>
  <text x="215" y="386" text-anchor="middle" font-size="13" fill="#333">and about 3 ft wide (front to back)</text>

  <!-- rules -->
  <g font-size="14" fill="#222">
    <text x="320" y="414" text-anchor="middle">Shut hen and poults in every night. Keep poults out of long wet grass and rain.</text>
    <text x="320" y="432" text-anchor="middle">No wire floor? Move the coop to fresh, short grass every few days.</text>
  </g>
</svg>
