  <g font-size="14.5" fill="#222">
    <text x="20" y="500">About 6 quarts an hour at first, 2 later. Faster than a quart in 10 minutes:</text>
    <text x="20" y="520">repack the soil. Replace the soil after about 50 quarts.</text>
    <text x="20" y="544" font-weight="bold" fill="#b03a2e">Then disinfect the water: the filter takes out fallout, not germs.</text>
  </g>
</svg>
