<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Arial, Helvetica, sans-serif">
  <title>Cut-through view of a whelping box with a rail around the inside that keeps pups from being crushed</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>

  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Whelping box, cut through: the rail that saves pups</text>

  <!-- floor and walls -->
  <rect x="40" y="290" width="420" height="16" fill="#b08850" stroke="#5a4020" stroke-width="2"/>
  <rect x="40" y="120" width="16" height="186" fill="#b08850" stroke="#5a4020" stroke-width="2"/>
  <rect x="444" y="120" width="16" height="186" fill="#b08850" stroke="#5a4020" stroke-width="2"/>

  <!-- straw bedding -->
  <rect x="56" y="276" width="388" height="14" fill="#efd98a"/>
  <g stroke="#c9a640" stroke-width="2">
    <line x1="70" y1="284" x2="95" y2="278"/><line x1="120" y1="286" x2="150" y2="280"/><line x1="200" y1="283" x2="230" y2="287"/>
    <line x1="280" y1="280" x2="310" y2="286"/><line x1="350" y1="285" x2="380" y2="279"/><line x1="410" y1="283" x2="435" y2="287"/>
  </g>

  <!-- rails: boards fixed around the inside, sticking out from the walls -->
  <rect x="56" y="232" width="52" height="10" fill="#7a5a2e" stroke="#3d2a10" stroke-width="2"/>
  <rect x="392" y="232" width="52" height="10" fill="#7a5a2e" stroke="#3d2a10" stroke-width="2"/>

  <!-- pup safe under the left rail -->
  <ellipse cx="80" cy="266" rx="18" ry="9" fill="#d9c7a0" stroke="#5a4a32" stroke-width="2"/>
  <circle cx="64" cy="263" r="6" fill="#d9c7a0" stroke="#5a4a32" stroke-width="2"/>

  <!-- mother lying down, her back against the right rail -->
  <path d="M170 276 C 165 220, 230 195, 300 200 C 360 204, 395 225, 392 250 C 390 268, 380 276, 370 276 Z" fill="#c9a36a" stroke="#5a4020" stroke-width="2"/>
  <circle cx="170" cy="245" r="22" fill="#c9a36a" stroke="#5a4020" stroke-width="2"/>
  <text x="300" y="240" text-anchor="middle" font-size="14" fill="#2a1a08">mother</text>
  <!-- nursing pups along her belly -->
  <g fill="#d9c7a0" stroke="#5a4a32" stroke-width="2">
    <ellipse cx="225" cy="268" rx="15" ry="8"/><ellipse cx="262" cy="270" rx="15" ry="8"/><ellipse cx="299" cy="270" rx="15" ry="8"/>
  </g>

  <!-- dimension: rail height above floor -->
  <g stroke="#333" stroke-width="1.5" fill="none" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="428" y1="245" x2="428" y2="288"/>
  </g>
  <text x="472" y="262" font-size="14" fill="#222">about 4 in</text>
  <text x="472" y="279" font-size="14" fill="#222">above the floor</text>

  <!-- callouts -->
  <g font-size="14" fill="#222">
    <text x="472" y="150" font-weight="bold">Rail all round</text>
    <text x="472" y="168">the inside: a 4-inch</text>
    <text x="472" y="186">board fixed to the walls</text>
  </g>
  <g stroke="#333" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M468 160 C 440 160, 430 200, 424 228"/>
  </g>

  <g font-size="14" fill="#222">
    <text x="40" y="76" font-weight="bold">A pup that crawls behind its mother</text>
    <text x="40" y="94">lies safe under the rail instead of being</text>
    <text x="40" y="112">pressed flat against the wall.</text>
  </g>
  <g stroke="#333" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M90 116 C 110 170, 100 220, 86 252"/>
  </g>

  <g font-size="14" fill="#222">
    <text x="40" y="335">• Clean straw in the bottom; she makes her own nest.</text>
    <text x="40" y="355">• Put it in a quiet place before the pups are due (about 63 days after mating).</text>
    <text x="40" y="375">• Don't handle the newborns — just check that each one is warm and nursing.</text>
  </g>
</svg>
