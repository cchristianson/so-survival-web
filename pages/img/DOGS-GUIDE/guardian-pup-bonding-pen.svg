<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="Arial, Helvetica, sans-serif">
  <title>A small pen for raising a guardian pup with lambs, seen from above</title>
  <rect width="640" height="500" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>

  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Bonding pen for a guardian pup (seen from above)</text>

  <!-- pen outline: strong fence the pup can't escape -->
  <rect x="30" y="55" width="360" height="270" fill="#f3f0e6" stroke="#5a4a32" stroke-width="5"/>
  <text x="210" y="347" text-anchor="middle" font-size="14" fill="#333">Pen of about 150 sq ft, fenced so the pup can't get out</text>

  <!-- pup-only corner -->
  <rect x="35" y="60" width="105" height="130" fill="#e3ecf5"/>
  <!-- wooden panel partition with a low gap -->
  <line x1="140" y1="58" x2="140" y2="132" stroke="#7a5a2e" stroke-width="7"/>
  <line x1="140" y1="164" x2="140" y2="193" stroke="#7a5a2e" stroke-width="7"/>
  <line x1="33" y1="193" x2="143" y2="193" stroke="#7a5a2e" stroke-width="7"/>
  <line x1="140" y1="134" x2="140" y2="162" stroke="#7a5a2e" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- dog shelter and food -->
  <rect x="48" y="72" width="58" height="44" fill="#c9b48f" stroke="#5a4a32" stroke-width="2"/>
  <text x="77" y="99" text-anchor="middle" font-size="13" fill="#222">shelter</text>
  <circle cx="74" cy="158" r="16" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="74" y="163" text-anchor="middle" font-size="12" fill="#222">food</text>
  <text x="87" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3f63">PUP ONLY</text>

  <!-- shared water trough just outside the pup corner -->
  <rect x="160" y="205" width="66" height="26" rx="5" fill="#9cc3e6" stroke="#2c5d8a" stroke-width="2"/>
  <text x="193" y="223" text-anchor="middle" font-size="13" fill="#123">water</text>

  <!-- lambs -->
  <g fill="#ffffff" stroke="#555" stroke-width="2">
    <ellipse cx="245" cy="92" rx="24" ry="14"/>
    <ellipse cx="325" cy="135" rx="24" ry="14"/>
    <ellipse cx="250" cy="282" rx="24" ry="14"/>
    <ellipse cx="335" cy="245" rx="24" ry="14"/>
  </g>
  <g fill="#555">
    <circle cx="267" cy="87" r="6"/><circle cx="347" cy="130" r="6"/><circle cx="272" cy="277" r="6"/><circle cx="357" cy="240" r="6"/>
  </g>
  <text x="335" y="305" text-anchor="middle" font-size="14" fill="#333">3–6 lambs</text>

  <!-- pup -->
  <ellipse cx="190" cy="160" rx="16" ry="9" fill="#d9c7a0" stroke="#5a4a32" stroke-width="2"/>
  <circle cx="207" cy="155" r="6" fill="#d9c7a0" stroke="#5a4a32" stroke-width="2"/>
  <text x="190" y="140" text-anchor="middle" font-size="13" fill="#333">pup</text>

  <!-- callouts on the right -->
  <g font-size="14" fill="#222">
    <text x="410" y="70" font-weight="bold">Low gap in the panel:</text>
    <text x="410" y="88">the pup crawls through,</text>
    <text x="410" y="106">the sheep can't</text>

    <text x="410" y="146" font-weight="bold">Pup's corner:</text>
    <text x="410" y="164">its food and shelter,</text>
    <text x="410" y="182">a place to get away</text>

    <text x="410" y="222" font-weight="bold">One water trough</text>
    <text x="410" y="240">for pup and sheep,</text>
    <text x="410" y="258">so they have to mix</text>
  </g>
  <g stroke="#333" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M405 80 C 300 60, 190 100, 147 140"/>
    <path d="M405 160 C 330 205, 160 215, 112 178"/>
    <path d="M405 236 C 330 236, 280 222, 232 219"/>
  </g>

  <!-- notes underneath -->
  <g font-size="14" fill="#222">
    <text x="30" y="382">• Pup goes in at <tspan font-weight="bold">7–8 weeks</tspan>. Lambs (orphans are ideal) or quiet ewe lambs;</text>
    <text x="44" y="401">take out any sheep that bullies the pup, and swap sheep in and out.</text>
    <text x="30" y="425">• Check several times a day at first, then daily. A pat is fine — the bond</text>
    <text x="44" y="444">you want is pup-to-sheep, not pup-to-people.</text>
    <text x="30" y="468">• At <tspan font-weight="bold">16 weeks</tspan> or older, move the pup and its lambs out to the bigger flock.</text>
  </g>
</svg>
