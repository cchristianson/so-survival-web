<svg xmlns="http://www.w3.org/2000/svg" width="680" height="546" viewBox="0 0 680 546" font-family="Arial, Helvetica, sans-serif">
  <title>The Hidatsa three-sisters field seen from above, as Buffalo Bird Woman described her family's garden: corn in hills about four feet apart in rows about four feet apart, beans in their own hills between the corn rows, a row of squash hills about four feet apart between each block of eight to ten corn rows, and sunflowers round the edge of the field, eight or nine paces apart</title>
