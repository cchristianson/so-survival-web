  <defs>
    <marker id="d5" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">The three sisters, as one Hidatsa family really grew them</text>
  <text x="340" y="44" text-anchor="middle" font-size="13" fill="#222">Seen from above. Corn and beans in their own hills; squash in rows of its own.</text>

  <!-- field -->
  <rect x="64" y="84" width="516" height="300" fill="#f3efe4" stroke="#c8bda4" stroke-width="1.5"/>

