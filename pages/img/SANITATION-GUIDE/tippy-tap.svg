<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="640" viewBox="0 0 640 640" font-family="Arial, Helvetica, sans-serif">
  <title>How to make and hang a tippy tap: a plastic jug with its handle sealed and pierced, hung tilted from a stick, with soap under a tin can</title>
  <rect width="640" height="640" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b03a2e"/></marker>
    <clipPath id="body"><rect x="-45" y="-60" width="90" height="120" rx="14"/></clipPath>
    <g id="jug">
      <rect x="-45" y="-60" width="90" height="120" rx="14" fill="#eef6fc" stroke="#333" stroke-width="2.5"/>
      <rect x="-32" y="-76" width="26" height="17" fill="#eef6fc" stroke="#333" stroke-width="2"/>
      <rect x="-35" y="-87" width="32" height="12" rx="2" fill="#2f6fa8" stroke="#333" stroke-width="1.5"/>
      <path d="M2,-60 C 12,-76 52,-72 58,-50 L 58,-14 C 58,-6 52,-3 44,-5" fill="none" stroke="#333" stroke-width="13" stroke-linecap="round"/>
      <path d="M2,-60 C 12,-76 52,-72 58,-50 L 58,-14 C 58,-6 52,-3 44,-5" fill="none" stroke="#eef6fc" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ===== Top: the jug ===== -->
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#222">1. Make it: a 1½-gallon (5 L) jug with a handle</text>
  <g transform="translate(320,170) scale(1.35)">
    <use xlink:href="#jug"/>
    <!-- sealed base of handle -->
    <line x1="46" y1="-12" x2="56" y2="-1" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <!-- small hole just above the seal -->
    <circle cx="64" cy="-22" r="3" fill="#111"/>
    <!-- two holes in the back, halfway up -->
    <circle cx="-38" cy="-6" r="3.5" fill="#111"/><circle cx="-38" cy="8" r="3.5" fill="#111"/>
  </g>
  <!-- leaders and labels, top -->
  <line x1="410" y1="141" x2="450" y2="104" stroke="#333" stroke-width="1.3"/>
  <text x="454" y="88" font-size="14.5" fill="#222">Small hole on the outside</text>
  <text x="454" y="105" font-size="14.5" fill="#222">of the handle, just above</text>
  <text x="454" y="122" font-size="14.5" fill="#222">the seal (hot nail)</text>
  <line x1="397" y1="168" x2="450" y2="196" stroke="#333" stroke-width="1.3"/>
  <text x="454" y="186" font-size="14.5" fill="#222">Seal the base of the</text>
  <text x="454" y="203" font-size="14.5" fill="#222">handle: warm it over a</text>
  <text x="454" y="220" font-size="14.5" fill="#222">candle, pinch it with pliers</text>
  <line x1="266" y1="170" x2="214" y2="170" stroke="#333" stroke-width="1.3"/>
  <text x="208" y="148" text-anchor="end" font-size="14.5" fill="#222">Two bigger holes in</text>
  <text x="208" y="165" text-anchor="end" font-size="14.5" fill="#222">the back, halfway up,</text>
  <text x="208" y="182" text-anchor="end" font-size="14.5" fill="#222">for the hanging string</text>
  <line x1="296" y1="58" x2="230" y2="62" stroke="#333" stroke-width="1.3"/>
  <text x="224" y="58" text-anchor="end" font-size="14.5" fill="#222">Cap: tie the</text>
  <text x="224" y="75" text-anchor="end" font-size="14.5" fill="#222">pull string here</text>

  <line x1="10" y1="290" x2="630" y2="290" stroke="#bbb" stroke-width="1.5"/>

  <!-- ===== Bottom: hung up ===== -->
  <text x="20" y="318" font-size="18" font-weight="bold" fill="#222">2. Hang it from a stick so the full jug tilts at 45°</text>
  <!-- posts and crossbar -->
  <line x1="110" y1="350" x2="110" y2="620" stroke="#7a5230" stroke-width="9" stroke-linecap="round"/>
  <line x1="520" y1="350" x2="520" y2="620" stroke="#7a5230" stroke-width="9" stroke-linecap="round"/>
  <line x1="96" y1="356" x2="534" y2="356" stroke="#7a5230" stroke-width="9" stroke-linecap="round"/>
  <line x1="40" y1="620" x2="600" y2="620" stroke="#5b4a30" stroke-width="3"/>

  <!-- hanging strings to the back holes -->
  <line x1="300" y1="360" x2="337" y2="441" stroke="#555" stroke-width="2"/>
  <line x1="380" y1="360" x2="345" y2="449" stroke="#555" stroke-width="2"/>

  <!-- the tilted jug, with water -->
  <g transform="translate(365,470) rotate(45)">
    <g clip-path="url(#body)">
      <rect x="-45" y="-60" width="90" height="120" fill="#eef6fc"/>
      <rect x="-200" y="-18" width="400" height="300" fill="#9cc6e6" transform="rotate(-45)"/>
    </g>
    <rect x="-45" y="-60" width="90" height="120" rx="14" fill="none" stroke="#333" stroke-width="2.5"/>
    <rect x="-32" y="-76" width="26" height="17" fill="#eef6fc" stroke="#333" stroke-width="2"/>
    <rect x="-35" y="-87" width="32" height="12" rx="2" fill="#2f6fa8" stroke="#333" stroke-width="1.5"/>
    <path d="M2,-60 C 12,-76 52,-72 58,-50 L 58,-14 C 58,-6 52,-3 44,-5" fill="none" stroke="#333" stroke-width="13" stroke-linecap="round"/>
    <path d="M2,-60 C 12,-76 52,-72 58,-50 L 58,-14 C 58,-6 52,-3 44,-5" fill="none" stroke="#9cc6e6" stroke-width="7" stroke-linecap="round"/>
    <line x1="46" y1="-12" x2="56" y2="-1" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-38" cy="-6" r="3.5" fill="#111"/><circle cx="-38" cy="8" r="3.5" fill="#111"/>
    <circle cx="64" cy="-22" r="3" fill="#111"/>
  </g>
  <!-- pull string from the cap -->
  <line x1="420" y1="400" x2="440" y2="560" stroke="#555" stroke-width="2"/>
  <line x1="440" y1="530" x2="440" y2="578" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#b)"/>
  <circle cx="440" cy="560" r="4" fill="#555"/>
  <!-- water from the handle hole -->
  <g fill="#2f6fa8"><circle cx="427" cy="512" r="3"/><circle cx="428" cy="527" r="3"/><circle cx="429" cy="542" r="3"/></g>

  <!-- soap under a tin can -->
  <line x1="190" y1="360" x2="190" y2="440" stroke="#555" stroke-width="2"/>
  <path d="M168,440 L212,440 L212,476 L168,476 Z" fill="#c7c7c7" stroke="#333" stroke-width="2"/>
  <line x1="190" y1="476" x2="190" y2="490" stroke="#555" stroke-width="2"/>
  <rect x="176" y="490" width="28" height="18" rx="5" fill="#f2e3a0" stroke="#333" stroke-width="1.5"/>
  <text x="190" y="532" text-anchor="middle" font-size="14" fill="#222">soap on a string,</text>
  <text x="190" y="549" text-anchor="middle" font-size="14" fill="#222">under an upside-</text>
  <text x="190" y="566" text-anchor="middle" font-size="14" fill="#222">down tin can</text>

  <text x="532" y="452" font-size="14" fill="#222">Pull the</text>
  <text x="532" y="469" font-size="14" fill="#222">cap string:</text>
  <text x="532" y="486" font-size="14" fill="#222">water runs</text>
  <text x="532" y="503" font-size="14" fill="#222">out of the</text>
  <text x="532" y="520" font-size="14" fill="#222">handle hole</text>

  <text x="320" y="608" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#222">One within 16 ft (5 m) of every toilet</text>
</svg>
