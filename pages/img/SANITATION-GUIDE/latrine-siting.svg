<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="Arial, Helvetica, sans-serif">
  <title>Siting a pit latrine: at least 100 feet from a well, downhill of it, with the pit bottom at least 5 feet above groundwater</title>
  <rect width="640" height="480" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>

  <!-- soil -->
  <path d="M20,120 L620,200 L620,380 L20,380 Z" fill="#e8dcc6"/>
  <!-- groundwater -->
  <path d="M20,300 L620,340 L620,380 L20,380 Z" fill="#cfe3f3"/>
  <line x1="20" y1="300" x2="620" y2="340" stroke="#2f6fa8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="600" y="368" text-anchor="end" font-size="14.5" fill="#1f4f7a">groundwater</text>
  <line x1="20" y1="120" x2="620" y2="200" stroke="#5b4a30" stroke-width="3"/>

  <!-- well -->
  <rect x="82" y="104" width="16" height="250" fill="#888" stroke="#333" stroke-width="1.5"/>
  <rect x="86" y="305" width="8" height="48" fill="#6fa8d6"/>
  <rect x="76" y="98" width="28" height="8" fill="#333"/>
  <text x="90" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">well or spring</text>

  <!-- latrine shelter and pit -->
  <rect x="440" y="124" width="60" height="56" fill="#c9b48e" stroke="#5b4a30" stroke-width="2"/>
  <polygon points="434,126 506,116 506,124 434,134" fill="#7a6a55"/>
  <rect x="446" y="180" width="48" height="90" fill="#7a6a55" stroke="#4a3d2c" stroke-width="2"/>
  <rect x="448" y="236" width="44" height="32" fill="#5a4a36"/>
  <text x="470" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">latrine</text>

  <!-- 100 ft distance -->
  <line x1="92" y1="52" x2="468" y2="52" stroke="#333" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="90" y1="44" x2="90" y2="72" stroke="#333" stroke-width="1"/>
  <line x1="470" y1="44" x2="470" y2="94" stroke="#333" stroke-width="1"/>
  <text x="280" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">at least 100 ft (30 m)</text>

  <!-- downhill -->
  <line x1="200" y1="128" x2="330" y2="146" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="262" y="126" text-anchor="middle" font-size="14.5" fill="#222" transform="rotate(7.6 262 126)">downhill</text>

  <!-- 5 ft above groundwater -->
  <line x1="520" y1="272" x2="520" y2="328" stroke="#333" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="494" y1="270" x2="528" y2="270" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="528" y="292" font-size="14.5" font-weight="bold" fill="#222">5 ft</text>
  <text x="528" y="309" font-size="14.5" font-weight="bold" fill="#222">or more</text>
  <text x="440" y="275" text-anchor="end" font-size="14" fill="#222">pit bottom</text>

  <!-- winter note -->
  <rect x="20" y="394" width="600" height="76" rx="8" fill="#fbf3e6" stroke="#c9a46a" stroke-width="1.5"/>
  <text x="34" y="418" font-size="14.5" font-weight="bold" fill="#222">Valley-floor clay in winter: water only 24–36 in down.</text>
  <text x="34" y="438" font-size="14.5" fill="#333">A pit dug there fills with water. Dig pits in the dry season, on</text>
  <text x="34" y="458" font-size="14.5" fill="#333">higher ground; November–April use a bucket or above-ground toilet.</text>
</svg>
