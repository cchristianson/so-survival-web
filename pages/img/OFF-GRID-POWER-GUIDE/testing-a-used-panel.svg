<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="Arial, Helvetica, sans-serif">
  <title>Testing a used solar panel with a meter: open-circuit volts, then short-circuit amps on the 10 amp range</title>
  <rect width="640" height="430" fill="#ffffff"/>
  <defs>
    <g id="panel">
      <rect x="0" y="0" width="120" height="150" fill="#dfe7f2" stroke="#2f3e55" stroke-width="2.5"/>
      <g stroke="#9fb0c8" stroke-width="1"><line x1="0" y1="37" x2="120" y2="37"/><line x1="0" y1="75" x2="120" y2="75"/><line x1="0" y1="112" x2="120" y2="112"/><line x1="40" y1="0" x2="40" y2="150"/><line x1="80" y1="0" x2="80" y2="150"/></g>
      <rect x="40" y="150" width="40" height="14" fill="#555" stroke="#333"/>
    </g>
    <g id="meter">
      <rect x="0" y="0" width="110" height="170" rx="10" fill="#f5c542" stroke="#333" stroke-width="2.5"/>
      <rect x="12" y="12" width="86" height="34" rx="3" fill="#dde5d0" stroke="#333" stroke-width="1.5"/>
      <circle cx="55" cy="86" r="20" fill="#333"/>
      <g font-size="13" font-weight="bold" fill="#222" text-anchor="middle"><text x="20" y="124">10A</text><text x="55" y="124">COM</text><text x="90" y="124">V</text></g>
      <circle cx="20" cy="138" r="7" fill="#222"/><circle cx="55" cy="138" r="7" fill="#222"/><circle cx="90" cy="138" r="7" fill="#222"/>
    </g>
  </defs>

  <!-- sun -->
  <circle cx="320" cy="34" r="20" fill="#ffd34d" stroke="#d68a00" stroke-width="2"/>
  <text x="350" y="30" font-size="13" fill="#333">Clear sun, panel facing</text>
  <text x="350" y="46" font-size="13" fill="#333">the sun squarely</text>

  <!-- ===== Test 1: volts ===== -->
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">1. VOLTS</text>
  <use href="#panel" x="25" y="70"/>
  <use href="#meter" x="180" y="80"/>
  <text x="235" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">DC volts</text>
  <!-- leads: + to V, - to COM -->
  <polyline points="72,234 72,284 270,284 270,218" fill="none" stroke="#c0392b" stroke-width="4"/>
  <polyline points="88,234 88,268 235,268 235,218" fill="none" stroke="#222" stroke-width="4"/>
  <text x="62" y="258" text-anchor="end" font-size="15" font-weight="bold" fill="#c0392b">+</text>
  <text x="104" y="258" font-size="17" font-weight="bold" fill="#222">−</text>
  <g font-size="13.5" fill="#222">
    <text x="20" y="310" font-weight="bold">Nothing else connected.</text>
    <text x="20" y="328">Should read within 10%</text>
    <text x="20" y="345">of the label's open-circuit</text>
    <text x="20" y="362">volts (a hot panel reads lower).</text>
  </g>

  <line x1="318" y1="70" x2="318" y2="372" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== Test 2: amps ===== -->
  <text x="335" y="70" font-size="16" font-weight="bold" fill="#222">2. AMPS</text>
  <use href="#panel" x="340" y="80"/>
  <use href="#meter" x="500" y="80"/>
  <text x="555" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">10 A range</text>
  <!-- leads: + to 10A, - to COM : the meter shorts the panel -->
  <polyline points="403,244 403,272 520,272 520,218" fill="none" stroke="#c0392b" stroke-width="4"/>
  <polyline points="387,244 387,286 555,286 555,218" fill="none" stroke="#222" stroke-width="4"/>
  <text x="377" y="268" text-anchor="end" font-size="17" font-weight="bold" fill="#222">−</text>
  <text x="413" y="266" font-size="15" font-weight="bold" fill="#c0392b">+</text>
  <g font-size="13.5" fill="#222">
    <text x="335" y="310" font-weight="bold">Red lead in the 10 A jack:</text>
    <text x="335" y="328">the meter shorts the panel.</text>
    <text x="335" y="345">Should read within 20% of the</text>
    <text x="335" y="362">label's short-circuit amps.</text>
  </g>

  <rect x="15" y="384" width="610" height="38" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="320" y="401" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8e2a1f">One panel at a time, unhooked from everything else.</text>
  <text x="320" y="416" text-anchor="middle" font-size="13" fill="#8e2a1f">Panels are live whenever light hits them.</text>
</svg>
