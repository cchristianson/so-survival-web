<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="Arial, Helvetica, sans-serif">
  <title>Batteries in series add volts; batteries in parallel add amp-hours</title>
  <rect width="640" height="500" fill="#ffffff"/>
  <defs>
    <g id="fz"><rect x="-18" y="-8" width="36" height="16" rx="3" fill="#fff6d6" stroke="#333" stroke-width="2"/><line x1="-12" y1="0" x2="12" y2="0" stroke="#333" stroke-width="2"/></g>
    <!-- one battery: body 100 x 70 at (0,20); + post left, - post right -->
    <g id="bat">
      <rect x="0" y="20" width="100" height="70" rx="5" fill="#e6e1d6" stroke="#333" stroke-width="2.5"/>
      <rect x="14" y="8" width="18" height="12" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
      <rect x="68" y="8" width="18" height="12" fill="#444" stroke="#333" stroke-width="1.5"/>
      <text x="23" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#c0392b">+</text>
      <text x="77" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">−</text>
    </g>
  </defs>

  <!-- ===== SERIES ===== -->
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#222">SERIES: − of one to + of the next. Volts add up.</text>
  <use href="#bat" x="30" y="70"/>
  <use href="#bat" x="175" y="70"/>
  <use href="#bat" x="320" y="70"/>
  <use href="#bat" x="465" y="70"/>
  <g font-size="15" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="80" y="140">6 V</text><text x="225" y="140">6 V</text><text x="370" y="140">6 V</text><text x="515" y="140">6 V</text>
  </g>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="80" y="156">220 Ah</text><text x="225" y="156">220 Ah</text><text x="370" y="156">220 Ah</text><text x="515" y="156">220 Ah</text>
  </g>
  <!-- jumpers - to + -->
  <g fill="none" stroke="#555" stroke-width="4">
    <path d="M107,78 C107,52 198,52 198,78"/>
    <path d="M252,78 C252,52 343,52 343,78"/>
    <path d="M397,78 C397,52 488,52 488,78"/>
  </g>
  <!-- output leads -->
  <polyline points="53,78 53,40 20,40 20,190 238,190" fill="none" stroke="#c0392b" stroke-width="4"/>
  <use href="#fz" x="53" y="56" transform="rotate(90 53 56)"/>
  <polyline points="542,78 542,40 600,40 600,212 412,212" fill="none" stroke="#222" stroke-width="4"/>
    <rect x="238" y="176" width="174" height="50" rx="6" fill="#f2f6ec" stroke="#333" stroke-width="2"/>
  <text x="325" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">24 V, 220 Ah</text>
  <text x="325" y="216" text-anchor="middle" font-size="13" fill="#333">amp-hours stay the same</text>
  <text x="420" y="188" font-size="13" fill="#444">24 V × 220 Ah</text><text x="420" y="204" font-size="13" fill="#444">= 5,280 Wh</text>
  <use href="#fz" x="40" y="246"/><text x="66" y="251" font-size="13" fill="#222">= main fuse, right at the + post of the bank</text>

  <line x1="15" y1="268" x2="625" y2="268" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== PARALLEL ===== -->
  <text x="20" y="296" font-size="17" font-weight="bold" fill="#222">PARALLEL: + to +, − to −. Amp-hours add up.</text>
  <use href="#bat" x="110" y="330"/>
  <use href="#bat" x="330" y="330"/>
  <g font-size="15" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="160" y="400">12 V</text><text x="380" y="400">12 V</text>
  </g>
  <g font-size="13" fill="#444" text-anchor="middle"><text x="160" y="416">100 Ah</text><text x="380" y="416">100 Ah</text></g>
  <!-- + to + and - to - jumpers, equal length -->
  <path d="M133,338 C133,312 353,312 353,338" fill="none" stroke="#c0392b" stroke-width="4"/>
  <path d="M187,338 C187,322 407,322 407,338" fill="none" stroke="#222" stroke-width="4"/>
  <!-- output: + from the first battery, - from the last -->
  <polyline points="133,338 133,300 90,300 90,461 260,461" fill="none" stroke="#c0392b" stroke-width="4"/>
  <use href="#fz" x="90" y="345" transform="rotate(90 90 345)"/>
  <polyline points="407,338 407,300 470,300 470,461 410,461" fill="none" stroke="#222" stroke-width="4"/>
  <rect x="260" y="436" width="150" height="50" rx="6" fill="#f2f6ec" stroke="#333" stroke-width="2"/>
  <text x="335" y="458" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">12 V, 200 Ah</text>
  <text x="335" y="476" text-anchor="middle" font-size="13" fill="#333">volts stay the same</text>
  <g font-size="13" fill="#222">
    <text x="490" y="345">Rules for parallel:</text>
    <text x="490" y="365">• same age and size</text>
    <text x="490" y="383">• equal cables</text>
    <text x="490" y="401">• no more than 3–4</text>
    <text x="502" y="417">strings</text>
  </g>
</svg>
