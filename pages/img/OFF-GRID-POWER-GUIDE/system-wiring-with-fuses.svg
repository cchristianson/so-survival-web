<svg xmlns="http://www.w3.org/2000/svg" width="660" height="610" viewBox="0 0 660 610" font-family="Arial, Helvetica, sans-serif">
  <title>How a small solar system is wired: panels, charge controller, battery bank, inverter and 12-volt loads, with every fuse</title>
  <rect width="660" height="610" fill="#ffffff"/>
  <defs>
    <!-- fuse: a small box with a line through it, drawn horizontally around (0,0), 40 long -->
    <g id="fuseH"><rect x="-20" y="-8" width="40" height="16" rx="3" fill="#fff6d6" stroke="#333" stroke-width="2"/><line x1="-14" y1="0" x2="14" y2="0" stroke="#333" stroke-width="2"/></g>
    <g id="fuseV"><rect x="-8" y="-20" width="16" height="40" rx="3" fill="#fff6d6" stroke="#333" stroke-width="2"/><line x1="0" y1="-14" x2="0" y2="14" stroke="#333" stroke-width="2"/></g>
  </defs>

  <!-- ===== solar panels ===== -->
  <g stroke="#2f3e55" stroke-width="2" fill="#dfe7f2">
    <rect x="15" y="30" width="62" height="90"/>
    <rect x="88" y="30" width="62" height="90"/>
  </g>
  <g stroke="#9fb0c8" stroke-width="1">
    <line x1="15" y1="60" x2="77" y2="60"/><line x1="15" y1="90" x2="77" y2="90"/><line x1="46" y1="30" x2="46" y2="120"/>
    <line x1="88" y1="60" x2="150" y2="60"/><line x1="88" y1="90" x2="150" y2="90"/><line x1="119" y1="30" x2="119" y2="120"/>
  </g>
  <text x="82" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Solar panels</text>
  <text x="82" y="160" text-anchor="middle" font-size="13" fill="#444">(live whenever light</text>
  <text x="82" y="175" text-anchor="middle" font-size="13" fill="#444">hits them)</text>

  <!-- panel to controller wires -->
  <polyline points="150,55 240,55" fill="none" stroke="#c0392b" stroke-width="4"/>
  <polyline points="150,95 240,95" fill="none" stroke="#222" stroke-width="4"/>
  <use href="#fuseH" x="195" y="55"/>
  <text x="195" y="40" text-anchor="middle" font-size="13" fill="#222">DC fuse or</text>
  <text x="195" y="82" text-anchor="middle" font-size="13" fill="#222">breaker</text>

  <!-- ===== charge controller ===== -->
  <rect x="240" y="25" width="140" height="100" rx="6" fill="#eef2e6" stroke="#333" stroke-width="2.5"/>
  <text x="310" y="68" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Charge</text>
  <text x="310" y="87" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">controller</text>

  <!-- controller LOAD output to 12 V loads -->
  <polyline points="380,55 470,55" fill="none" stroke="#c0392b" stroke-width="3"/>
  <polyline points="380,95 470,95" fill="none" stroke="#222" stroke-width="3"/>
  <use href="#fuseH" x="425" y="55"/>
  <text x="425" y="40" text-anchor="middle" font-size="13" fill="#222">10 A fuse</text>
  <text x="425" y="116" text-anchor="middle" font-size="13" fill="#222">14 AWG</text>
  <text x="425" y="131" text-anchor="middle" font-size="13" fill="#222">or larger</text>
  <rect x="470" y="25" width="175" height="100" rx="6" fill="#f6f1e4" stroke="#333" stroke-width="2"/>
  <text x="557" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">12 V loads</text>
  <text x="557" y="80" text-anchor="middle" font-size="13" fill="#333">lights, radio, fan</text>
  <text x="557" y="98" text-anchor="middle" font-size="13" fill="#333">(its low-voltage cutoff</text>
  <text x="557" y="114" text-anchor="middle" font-size="13" fill="#333">protects the battery)</text>

  <!-- controller BAT wires down to the battery -->
  <polyline points="280,125 280,300 445,300 445,385" fill="none" stroke="#c0392b" stroke-width="4"/>
  <polyline points="340,125 340,270 600,270 600,385" fill="none" stroke="#222" stroke-width="4"/>
  <use href="#fuseV" x="445" y="340"/>
  <text x="460" y="330" font-size="13" fill="#222">fuse right at</text>
  <text x="460" y="346" font-size="13" fill="#222">the + post</text>

  <!-- ===== battery bank ===== -->
  <rect x="435" y="385" width="20" height="14" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <rect x="590" y="385" width="20" height="14" fill="#444" stroke="#333" stroke-width="1.5"/>
  <rect x="420" y="399" width="205" height="72" rx="5" fill="#e6e1d6" stroke="#333" stroke-width="2.5"/>
  <text x="471" y="420" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">+</text>
  <text x="575" y="420" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">−</text>
  <text x="522" y="445" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">BATTERY BANK</text>
  <text x="522" y="463" text-anchor="middle" font-size="13" fill="#333">in a vented box</text>

  <!-- main fuse to inverter -->
  <polyline points="435,392 190,392" fill="none" stroke="#c0392b" stroke-width="5"/>
  <use href="#fuseH" x="385" y="392"/>
  <text x="358" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Main fuse, close</text>
  <text x="358" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">to the battery:</text>
  <text x="358" y="372" text-anchor="middle" font-size="13" fill="#222">class T or RK5</text>
  <polyline points="610,392 640,392 640,490 205,490 205,428 190,428" fill="none" stroke="#222" stroke-width="5"/>

  <!-- ===== inverter ===== -->
  <rect x="20" y="345" width="170" height="100" rx="6" fill="#e9eef5" stroke="#333" stroke-width="2.5"/>
  <text x="105" y="388" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Inverter</text>
  <text x="105" y="407" text-anchor="middle" font-size="13" fill="#333">pure sine wave;</text>
  <text x="105" y="423" text-anchor="middle" font-size="13" fill="#333">switch off when idle</text>
  <!-- AC side -->
  <line x1="90" y1="445" x2="90" y2="510" stroke="#555" stroke-width="3"/>
  <line x1="120" y1="445" x2="120" y2="510" stroke="#555" stroke-width="3"/>
  <rect x="35" y="510" width="140" height="56" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="105" y="534" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">120 V AC</text>
  <text x="105" y="553" text-anchor="middle" font-size="13" fill="#333">outlets</text>

  <!-- ===== ground ===== -->
  <line x1="300" y1="490" x2="300" y2="540" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="300" cy="490" r="5" fill="#2e7d32"/>
  <g stroke="#2e7d32" stroke-width="3"><line x1="280" y1="540" x2="320" y2="540"/><line x1="287" y1="548" x2="313" y2="548"/><line x1="294" y1="556" x2="306" y2="556"/></g>
  <text x="330" y="518" font-size="13" fill="#1b5e20" font-weight="bold">Bond DC − to ground here</text>
  <text x="330" y="534" font-size="13" fill="#1b5e20">only (one point): #6 copper</text>
  <text x="330" y="550" font-size="13" fill="#1b5e20">to a rod driven 8 ft deep</text>

  <!-- legend -->
  <g font-size="13" fill="#222">
    <line x1="330" y1="580" x2="360" y2="580" stroke="#c0392b" stroke-width="4"/><text x="366" y="585">+ positive</text>
    <line x1="450" y1="580" x2="480" y2="580" stroke="#222" stroke-width="4"/><text x="486" y="585">− negative</text>
    <use href="#fuseH" x="40" y="590" transform="translate(0,0)"/><text x="66" y="595">= DC-rated fuse</text>
  </g>
  <text x="330" y="603" font-size="13" fill="#555">Not to scale. Connect the battery last.</text>
</svg>
