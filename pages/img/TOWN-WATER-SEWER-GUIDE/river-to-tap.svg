<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="Arial, Helvetica, sans-serif">
  <title>Town water from the river to the tap: the intake and its screen, the treatment plant's steps, the tank on the hill that gives the pressure, the main under the street, the service line with its curb valve and meter, and the house valve</title>
  <rect width="680" height="480" fill="#ffffff"/>
  <defs>
    <marker id="bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#1d6fa8"/></marker>
    <marker id="dm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#333"/></marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">River to tap: pumps fill the tank, and the tank's height gives the pressure.</text>

  <!-- ground -->
  <path d="M16,360 H290 C340,360 356,214 420,214 H470 C520,214 530,330 566,330 H664" fill="#efe8dc" stroke="#6b5a45" stroke-width="2.5"/>
  <rect x="16" y="360" width="648" height="40" fill="#efe8dc"/>

  <!-- river and intake -->
  <path d="M16,300 C44,306 56,320 56,346 L16,346 z" fill="#8cc3e6" stroke="#1d6fa8" stroke-width="2"/>
  <text x="20" y="292" font-size="13" font-weight="bold" fill="#1d6fa8">river</text>
  <rect x="56" y="326" width="16" height="22" fill="#fff" stroke="#333" stroke-width="2"/>
  <g stroke="#333" stroke-width="1.2"><path d="M60,326 V348 M64,326 V348 M68,326 V348"/></g>
  <text x="64" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">intake</text>
  <text x="64" y="392" text-anchor="middle" font-size="12" fill="#222">+ screen</text>

  <!-- treatment plant -->
  <rect x="100" y="296" width="196" height="60" fill="#dfe4e8" stroke="#333" stroke-width="2"/>
  <g stroke="#333" stroke-width="1.4" fill="#ffffff">
    <rect x="110" y="306" width="38" height="40"/><rect x="156" y="306" width="38" height="40"/>
    <rect x="202" y="306" width="38" height="40"/><rect x="248" y="306" width="38" height="40"/>
  </g>
  <g fill="#8cc3e6"><rect x="111" y="330" width="36" height="15"/><rect x="157" y="326" width="36" height="19"/><rect x="203" y="322" width="36" height="23"/><rect x="249" y="318" width="36" height="27"/></g>
  <g font-size="11.5" text-anchor="middle" fill="#222">
    <text x="129" y="290">screens</text><text x="175" y="290">alum,</text><text x="175" y="278">mixing</text>
    <text x="221" y="290">settling</text><text x="267" y="290">filters</text>
  </g>
  <text x="198" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">TREATMENT PLANT</text>
  <text x="198" y="394" text-anchor="middle" font-size="12" fill="#222">chlorine goes in last, with 30 minutes before the first tap</text>
  <path d="M72,336 H100" stroke="#1d6fa8" stroke-width="3.5" marker-end="url(#bl)"/>

  <!-- high-lift pump and rising main -->
  <circle cx="312" cy="326" r="13" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M306,320 L318,326 L306,332 z" fill="#333"/>
  <text x="312" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">pump</text>
  <path d="M296,326 H299" stroke="#1d6fa8" stroke-width="3.5"/>
  <path d="M325,326 C352,326 368,276 388,236 C398,216 410,200 426,196" fill="none" stroke="#1d6fa8" stroke-width="3.5" marker-end="url(#bl)"/>

  <!-- the tank on the hill -->
  <rect x="408" y="124" width="76" height="52" rx="3" fill="#cfe6f2" stroke="#333" stroke-width="2.5"/>
  <rect x="408" y="140" width="76" height="36" fill="#8cc3e6" stroke="none"/>
  <rect x="408" y="124" width="76" height="52" rx="3" fill="none" stroke="#333" stroke-width="2.5"/>
  <g stroke="#555" stroke-width="4"><path d="M420,176 V214 M472,176 V214 M446,176 V214"/></g>
  <text x="446" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">TANK ON HIGH GROUND</text>
  <text x="446" y="100" text-anchor="middle" font-size="12" fill="#222">about a day or two of normal use</text>

  <!-- main down to the houses -->
  <path d="M484,152 C520,160 528,250 540,300 C548,336 556,356 572,356 H664" fill="none" stroke="#1d6fa8" stroke-width="4"/>
  <text x="620" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d6fa8">main under the street</text>

  <!-- house -->
  <polygon points="582,318 614,294 646,318" fill="#c8a07a" stroke="#333" stroke-width="2"/>
  <rect x="588" y="318" width="52" height="38" fill="#f0e6d8" stroke="#333" stroke-width="2"/>
  <circle cx="584" cy="338" r="7" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M600,356 V372" stroke="#1d6fa8" stroke-width="3"/>
  <rect x="594" y="366" width="12" height="12" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="664" y="412" text-anchor="end" font-size="12" font-weight="bold" fill="#222">curb valve and meter; a house valve inside</text>
  <text x="664" y="428" text-anchor="end" font-size="12" fill="#222">everyone at home should know how to shut it</text>

  <!-- the pressure dimension -->
  <line x1="372" y1="140" x2="372" y2="356" stroke="#333" stroke-width="1.5" marker-start="url(#dm)" marker-end="url(#dm)"/>
  <line x1="372" y1="140" x2="406" y2="140" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="372" y1="356" x2="580" y2="356" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <g font-size="13" font-weight="bold" fill="#222" text-anchor="end">
    <text x="364" y="190">more than</text>
    <text x="364" y="208">90 feet above</text>
    <text x="364" y="226">the house</text>
    <text x="364" y="244">gives 40 psi</text>
    <text x="364" y="262">at the tap</text>
  </g>

  <line x1="16" y1="440" x2="664" y2="440" stroke="#ccc" stroke-width="1"/>
  <g font-size="13.5" fill="#222">
    <text x="16" y="462"><tspan font-weight="bold">Height is pressure:</tspan> water gains 1 psi for every 2.31 feet it falls. Town mains run at 40 to 80 psi.</text>
    <text x="16" y="478" fill="#c8431a" font-weight="bold">All of it runs on electricity. With the pumps stopped, the tank drains in hours to a day or two.</text>
  </g>
</svg>
