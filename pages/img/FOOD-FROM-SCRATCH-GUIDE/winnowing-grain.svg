<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Arial, Helvetica, sans-serif">
  <title>Winnowing: pouring threshed grain in front of a fan so the chaff blows away</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3d6f8e"/></marker>
  </defs>

  <!-- ground / tarp -->
  <line x1="10" y1="350" x2="630" y2="350" stroke="#777" stroke-width="2"/>
  <rect x="160" y="346" width="460" height="6" fill="#9db7c9"/>
  <text x="560" y="372" text-anchor="middle" font-size="13" fill="#444">tarp</text>

  <!-- fan -->
  <rect x="30" y="170" width="20" height="120" rx="4" fill="#d9d9d9" stroke="#444" stroke-width="2.5"/>
  <rect x="34" y="290" width="12" height="60" fill="#888"/>
  <rect x="16" y="342" width="48" height="8" fill="#666"/>
  <text x="40" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Fan</text>
  <text x="12" y="374" font-size="13" fill="#444">or a steady breeze</text>

  <!-- wind arrows -->
  <g stroke="#3d6f8e" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M60,190 C150,186 300,190 470,200"/>
    <path d="M60,230 C150,228 300,234 500,248"/>
    <path d="M60,270 C150,270 300,276 520,296"/>
  </g>

  <!-- pan pouring -->
  <path d="M150,58 L240,58 L230,92 L160,92 Z" fill="#c9c2b4" stroke="#444" stroke-width="2.5" transform="rotate(18 195 75)"/>
  <!-- falling stream of grain -->
  <g fill="#b88a3a">
    <circle cx="232" cy="110" r="3"/><circle cx="234" cy="128" r="3"/><circle cx="231" cy="146" r="3"/><circle cx="235" cy="164" r="3"/>
    <circle cx="232" cy="182" r="3"/><circle cx="236" cy="200" r="3"/><circle cx="233" cy="218" r="3"/><circle cx="237" cy="236" r="3"/>
    <circle cx="234" cy="254" r="3"/><circle cx="238" cy="272" r="3"/><circle cx="235" cy="290" r="3"/><circle cx="239" cy="306" r="3"/>
    <circle cx="228" cy="120" r="2.5"/><circle cx="238" cy="150" r="2.5"/><circle cx="229" cy="190" r="2.5"/><circle cx="240" cy="226" r="2.5"/><circle cx="231" cy="264" r="2.5"/><circle cx="242" cy="296" r="2.5"/>
  </g>
  <!-- chaff blowing away -->
  <g stroke="#c8b57a" stroke-width="3" stroke-linecap="round">
    <line x1="290" y1="196" x2="300" y2="192"/><line x1="340" y1="214" x2="352" y2="212"/><line x1="380" y1="236" x2="390" y2="230"/>
    <line x1="420" y1="262" x2="432" y2="260"/><line x1="460" y1="290" x2="470" y2="286"/><line x1="500" y1="318" x2="512" y2="316"/>
    <line x1="320" y1="250" x2="330" y2="246"/><line x1="400" y1="300" x2="410" y2="298"/><line x1="470" y1="336" x2="482" y2="334"/>
    <line x1="530" y1="340" x2="542" y2="338"/><line x1="560" y1="342" x2="572" y2="340"/><line x1="440" y1="340" x2="452" y2="341"/>
  </g>

  <!-- tub catching the grain -->
  <path d="M188,312 L198,350 L282,350 L292,312 Z" fill="#a37a4a" stroke="#4e3519" stroke-width="2.5"/>
  <ellipse cx="240" cy="312" rx="52" ry="8" fill="#d9b36a" stroke="#4e3519" stroke-width="2"/>

  <!-- labels -->
  <g font-size="14" fill="#222">
    <text x="262" y="56" font-weight="bold">1 Pour the threshed grain</text>
    <text x="262" y="74">slowly, in front of the fan</text>
    <text x="490" y="162" font-weight="bold">2 Light chaff</text>
    <text x="490" y="180">blows away</text>
    <text x="250" y="374" text-anchor="middle" font-weight="bold">3 Heavy grain falls in the tub</text>
  </g>
  <rect x="300" y="90" width="320" height="50" rx="6" fill="#f4efe4" stroke="#b9a98a"/>
  <text x="460" y="111" text-anchor="middle" font-size="14" fill="#222">Pour it through again until no chaff</text>
  <text x="460" y="129" text-anchor="middle" font-size="14" fill="#222">is left. Then dry it to 12–13% moisture.</text>
</svg>
